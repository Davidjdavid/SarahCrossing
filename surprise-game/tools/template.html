<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Carry the One</title>
<style>
:root { --bg: #1a1420; --ink: #fff6e0; --pad: #2a1f33; --pad-edge: #4a3a55; --accent: #f6cf55; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1a1420; --ink: #fff6e0; --pad: #2a1f33; --pad-edge: #4a3a55; --accent: #f6cf55; } }
:root[data-theme="dark"] { --bg: #1a1420; --ink: #fff6e0; --pad: #2a1f33; --pad-edge: #4a3a55; --accent: #f6cf55; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; font-family: system-ui, sans-serif; }
canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; outline: none; }
#touch { display: none; width: 100%; max-width: 520px; box-sizing: border-box; padding: 12px 16px 18px; justify-content: space-between; align-items: center; gap: 12px; }
body.touch #touch { display: flex; }
#touch button { background: var(--pad); color: var(--ink); border: 2px solid var(--pad-edge); border-radius: 12px; font: 600 15px system-ui, sans-serif; touch-action: none; }
#touch button.on { background: var(--pad-edge); }
.dpad { display: grid; grid-template: 44px 44px 44px / 44px 44px 44px; gap: 4px; }
.dpad button { width: 44px; height: 44px; padding: 0; }
.mid { display: flex; flex-direction: column; gap: 6px; }
.mid button { padding: 6px 10px; font-size: 13px; }
.ab { display: flex; gap: 10px; align-items: center; }
.ab button { width: 58px; height: 58px; border-radius: 50%; font-size: 18px; }
.ab button.a { background: var(--accent); color: #2a1f33; border-color: #ee8f3e; }
</style>
</head>
<body>
<canvas id="game" width="256" height="192" aria-label="game"></canvas>
<div id="touch">
  <div class="dpad">
    <span></span><button data-k="u" aria-label="up">▲</button><span></span>
    <button data-k="l" aria-label="left">◀</button><span></span><button data-k="r" aria-label="right">▶</button>
    <span></span><button data-k="d" aria-label="down">▼</button><span></span>
  </div>
  <div class="mid">
    <button data-k="ESC">menu</button>
    <button data-k="UNDO">undo</button>
    <button data-k="WAIT">wait</button>
  </div>
  <div class="ab">
    <button data-k="B" class="b">X</button>
    <button data-k="A" class="a">Z</button>
  </div>
</div>
<script>window.__DEBUG = /[?&]debug\b/.test(location.search);</script>
<script>
/*@@GAME@@*/
</script>
</body>
</html>
