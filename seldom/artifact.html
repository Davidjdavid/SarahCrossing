<title>Seldom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root { --ground: #000000; color-scheme: dark; }
html, body { height: 100%; margin: 0; background: var(--ground); overflow: hidden; }
body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
canvas { display: block; width: 100%; height: 100%; outline: none; image-rendering: pixelated; touch-action: none; }
</style>
<canvas id="game" tabindex="0" aria-label="Seldom, a small game. Click, then use the keyboard."></canvas>
<script>
/* ---- 00_core.js ---- */
'use strict';
/* Seldom: one script, joined in file-name order by build.mjs. Everything is global. */

const TILE = 16;
const VIEW_W = 384, VIEW_H = 216;      /* the view at zoom 1, in world pixels */
const STEP = 1 / 60;                    /* the simulation's fixed step */

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const inRect = (x, y, r) => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* a small deterministic hash, for texture noise and anything that must look random but stay put */
function hash2(x, y, s) {
    let h = (x * 374761393 + y * 668265263 + (s || 0) * 1442695041) | 0;
    h = (h ^ (h >>> 13)) * 1274126177 | 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function rng(seed) {
    let s = seed >>> 0 || 1;
    return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
}

const G = {
    t: 0,              /* seconds the game has run (wall clock of the sim) */
    frame: 0,
    state: 'title',    /* title | play | talk | menu | notebook | ending | credits */
    flags: {},         /* story flags */
    debug: false,
};

const DIRS = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] };
function dirOf(dx, dy, prev) {
    if (Math.abs(dx) > Math.abs(dy) + 0.01) return dx < 0 ? 'left' : 'right';
    if (Math.abs(dy) > 0.01) return dy < 0 ? 'up' : 'down';
    if (Math.abs(dx) > 0.01) return dx < 0 ? 'left' : 'right';
    return prev || 'down';
}

function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
}

const MAP_MAKERS = [];                          /* functions that build each map (areas push theirs) */
const START = { map: 'island', x: 50, y: 70 };  /* where a new game begins */

/* ---- 01_input.js ---- */
/* input: keyboard, mouse wheel and drag, gamepad, and on-screen buttons on touch screens.
   Everything is read as named buttons: held (Input.down) and pressed this step (Input.hit). */
const KEYMAP = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'act', Space: 'act', Enter: 'act', KeyJ: 'act',
    KeyX: 'look', ShiftLeft: 'look', ShiftRight: 'look', KeyK: 'look',
    KeyC: 'center', KeyL: 'center',
    KeyQ: 'zout', Minus: 'zout', NumpadSubtract: 'zout',
    KeyE: 'zin', Equal: 'zin', NumpadAdd: 'zin',
    Tab: 'split', KeyP: 'split',
    KeyN: 'notebook', KeyI: 'notebook',
    Escape: 'menu', Backspace: 'back',
    F2: 'debug',
};
const Input = {
    keys: {}, down: {}, hit: {}, prev: {}, wheel: 0, drag: null, pad: null, touch: {}, anyHit: false, lastKind: 'key',
    init(canvas) {
        addEventListener('keydown', e => {
            const b = KEYMAP[e.code];
            if (b) { this.keys[b] = true; e.preventDefault(); }
            this.anyKey = true; this.lastKind = 'key';
            Audio2.unlock();
        });
        addEventListener('keyup', e => { const b = KEYMAP[e.code]; if (b) { this.keys[b] = false; e.preventDefault(); } });
        addEventListener('blur', () => { this.keys = {}; });
        canvas.addEventListener('wheel', e => { this.wheel += Math.sign(e.deltaY); e.preventDefault(); }, { passive: false });
        canvas.addEventListener('mousedown', e => {
            Audio2.unlock(); canvas.focus();
            if (e.button === 2 || e.button === 1) { this.drag = { x: e.clientX, y: e.clientY, dx: 0, dy: 0 }; e.preventDefault(); }
            else this.click = true;
        });
        addEventListener('mousemove', e => { if (this.drag) { this.drag.dx += e.clientX - this.drag.x; this.drag.dy += e.clientY - this.drag.y; this.drag.x = e.clientX; this.drag.y = e.clientY; } });
        addEventListener('mouseup', e => { if (e.button === 2 || e.button === 1) this.drag = null; });
        canvas.addEventListener('contextmenu', e => e.preventDefault());
    },
    /* one step: merge every source into down/hit */
    poll() {
        const d = {};
        for (const k in this.keys) if (this.keys[k]) d[k] = true;
        for (const k in this.touch) if (this.touch[k]) d[k] = true;
        this.padAxes = null;
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (const p of pads) {
            if (!p) continue;
            const ax = p.axes, bt = i => p.buttons[i] && p.buttons[i].pressed;
            const dz = 0.35;
            if (ax[0] < -dz || bt(14)) d.left = true;
            if (ax[0] > dz || bt(15)) d.right = true;
            if (ax[1] < -dz || bt(12)) d.up = true;
            if (ax[1] > dz || bt(13)) d.down = true;
            if (bt(0)) d.act = true;
            if (bt(1)) d.back = true;
            if (bt(2)) d.center = true;
            if (bt(3)) d.notebook = true;
            if (bt(4) || bt(6)) d.zout = true;
            if (bt(5) || bt(7)) d.zin = true;
            if (bt(9)) d.menu = true;
            if (bt(8)) d.split = true;
            if (bt(10)) d.look = true;
            if (Math.hypot(ax[2] || 0, ax[3] || 0) > dz) this.padAxes = [ax[2], ax[3]];
            for (const b of p.buttons) if (b.pressed) this.lastKind = 'pad';
        }
        this.hit = {};
        for (const k in d) if (!this.prev[k]) this.hit[k] = true;
        if (this.wheel) { if (this.wheel > 0) this.hit.zout = true; else this.hit.zin = true; this.wheel = 0; }
        this.anyHit = Object.keys(this.hit).length > 0 || !!this.click;
        this.clicked = !!this.click; this.click = false;
        this.prev = d; this.down = d;
    },
    axis() {
        let x = 0, y = 0;
        if (this.down.left) x -= 1; if (this.down.right) x += 1;
        if (this.down.up) y -= 1; if (this.down.down) y += 1;
        if (x && y) { x *= Math.SQRT1_2; y *= Math.SQRT1_2; }
        return [x, y];
    },
    /* the look vector: right stick or mouse drag (in screen pixels) */
    takeDrag() { if (!this.drag) return null; const r = [this.drag.dx, this.drag.dy]; this.drag.dx = 0; this.drag.dy = 0; return r; },
    consume(b) { delete this.hit[b]; },
};

/* ---- 01b_touch.js ---- */
/* on a touch screen: a pad and buttons drawn over the game (they press the same named buttons as the keys) */
const Touch = {
    on: false, ids: {}, pad: null,
    init(cv) {
        const start = e => { this.on = true; Audio2.unlock(); if (G.state === 'title') Input.click = true; this.handle(e); e.preventDefault(); };
        cv.addEventListener('touchstart', start, { passive: false });
        cv.addEventListener('touchmove', e => { this.handle(e); e.preventDefault(); }, { passive: false });
        cv.addEventListener('touchend', e => { this.handle(e); e.preventDefault(); }, { passive: false });
        cv.addEventListener('touchcancel', e => { this.handle(e); }, { passive: false });
    },
    /* where the controls sit, in canvas pixels */
    layout() {
        const u = Math.min(R.W, R.H) / 9, m = u * 0.4;
        return {
            u, pad: { x: m + u * 1.4, y: R.H - m - u * 1.4, r: u * 1.3 },
            buttons: [
                { b: 'act', label: 'Z', x: R.W - m - u * 0.8, y: R.H - m - u * 1.3, r: u * 0.75 },
                { b: 'look', label: 'X', x: R.W - m - u * 2.4, y: R.H - m - u * 0.8, r: u * 0.6 },
                { b: 'center', label: 'C', x: R.W - m - u * 2.4, y: R.H - m - u * 2.2, r: u * 0.45 },
                { b: 'zout', label: '-', x: R.W - m - u * 0.5, y: m + u * 1.6, r: u * 0.4 },
                { b: 'zin', label: '+', x: R.W - m - u * 1.5, y: m + u * 1.6, r: u * 0.4 },
                { b: 'split', label: 'Tab', x: R.W - m - u * 2.5, y: m + u * 1.6, r: u * 0.4 },
                { b: 'menu', label: 'Esc', x: m + u * 0.5, y: m + u * 1.6, r: u * 0.4 },
                { b: 'notebook', label: 'N', x: m + u * 1.5, y: m + u * 1.6, r: u * 0.4 },
            ],
        };
    },
    handle(e) {
        const L = this.layout(), rc = R.cv.getBoundingClientRect(), dpr = R.W / (rc.width || innerWidth);
        const held = {};
        for (const t of e.touches) {
            const x = (t.clientX - rc.left) * dpr, y = (t.clientY - rc.top) * dpr;
            const dx = x - L.pad.x, dy = y - L.pad.y;
            if (Math.hypot(dx, dy) < L.pad.r * 1.6) {
                const a = Math.atan2(dy, dx), d = Math.hypot(dx, dy);
                if (d > L.pad.r * 0.25) {
                    const s = Math.sin(a), c = Math.cos(a);
                    if (c > 0.38) held.right = true; if (c < -0.38) held.left = true;
                    if (s > 0.38) held.down = true; if (s < -0.38) held.up = true;
                }
                this.pad = [dx, dy];
                continue;
            }
            for (const b of L.buttons) if (Math.hypot(x - b.x, y - b.y) < b.r * 1.25) held[b.b] = true;
        }
        if (!e.touches.length || !Object.keys(held).some(k => ['up', 'down', 'left', 'right'].includes(k))) this.pad = null;
        Input.touch = held;
    },
    draw(ctx) {
        if (!this.on || G.state === 'title') return;
        const L = this.layout();
        ctx.save(); ctx.globalAlpha = 0.35;
        ctx.fillStyle = '#fff8ec'; ctx.beginPath(); ctx.arc(L.pad.x, L.pad.y, L.pad.r, 0, 7); ctx.fill();
        ctx.globalAlpha = 0.6; ctx.fillStyle = '#2a1b2d';
        const p = this.pad || [0, 0], k = Math.min(1, L.pad.r * 0.6 / (Math.hypot(p[0], p[1]) || 1));
        ctx.beginPath(); ctx.arc(L.pad.x + p[0] * k, L.pad.y + p[1] * k, L.pad.r * 0.4, 0, 7); ctx.fill();
        for (const b of L.buttons) {
            if ((b.b === 'look' || b.b === 'center') && !G.flags.spyglass) continue;
            if ((b.b === 'zin' || b.b === 'zout') && !(Cam.zmin < 1 || Cam.zmax > 1)) continue;
            if (b.b === 'split' && !G.flags.prism) continue;
            ctx.globalAlpha = Input.touch[b.b] ? 0.7 : 0.35; ctx.fillStyle = '#fff8ec';
            ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
            ctx.globalAlpha = 0.9;
            const s = Math.max(1, b.r / (b.label.length > 1 ? 14 : 9));
            drawText(ctx, b.label, b.x - textWidth(b.label) * s / 2, b.y - 4 * s, '#2a1b2d', s);
        }
        ctx.restore();
    },
};

const FONT = {};    /* char -> { w, rows[8] of bits } */
(function buildFont() {
    for (const [chars, src] of FONT_SRC) {
        const lines = src.trim().split('\n');
        const glyphs = [...chars];
        glyphs.forEach((ch, gi) => {
            const rows = lines.map(l => l.slice(gi * 6, gi * 6 + 5));
            let w = 1;
            rows.forEach(r => { for (let i = 0; i < 5; i++) if (r[i] === '#') w = Math.max(w, i + 1); });
            FONT[ch] = { w, rows };
        });
    }
    FONT[' '] = { w: 3, rows: Array(8).fill('.....') };
})();
const fontAtlas = {};
function glyphCanvas(ch, color) {
    const key = ch + color;
    if (fontAtlas[key]) return fontAtlas[key];
    const g = FONT[ch] || FONT['?'];
    const c = document.createElement('canvas'); c.width = Math.max(1, g.w); c.height = 8;
    const x = c.getContext('2d'); x.fillStyle = color;
    g.rows.forEach((r, y) => { for (let i = 0; i < 5; i++) if (r[i] === '#') x.fillRect(i, y, 1, 1); });
    return (fontAtlas[key] = c);
}
function textWidth(s) { let w = 0; for (const ch of s) w += (FONT[ch] || FONT['?']).w + 1; return Math.max(0, w - 1); }
/* draw text at (x, y) top-left, s = screen pixels per font pixel; shadow draws a dark copy one pixel down */
function drawText(ctx, s, x, y, color, scale, shadow) {
    scale = scale || 1;
    if (shadow) drawText(ctx, s, x + scale, y + scale, shadow, scale);
    let cx = x;
    for (const ch of s) {
        const g = FONT[ch] || FONT['?'];
        if (ch !== ' ') ctx.drawImage(glyphCanvas(ch, color), Math.round(cx), Math.round(y), g.w * scale, 8 * scale);
        cx += (g.w + 1) * scale;
    }
    return cx - x;
}
/* break text into lines no wider than w font pixels */
function wrapText(s, w) {
    const out = [];
    for (const para of s.split('\n')) {
        let line = '';
        for (const word of para.split(' ')) {
            const t = line ? line + ' ' + word : word;
            if (textWidth(t) > w && line) { out.push(line); line = word; } else line = t;
        }
        out.push(line);
    }
    return out;
}

/* ---- 03_art.js ---- */
/* art: every picture is drawn in code on a little pixel grid, then outlined, then cached as a canvas.
   One outline color and one warm palette keep it all of a piece. */
const P = {
    ink: '#2a1b2d', white: '#fff8ec', cream: '#f6e7c8', black: '#1a1220',

    red: '#e2574c', redS: '#a83a3e', orange: '#f08a3c', yellow: '#f6cf4a', yellowS: '#c99a2e',
    green: '#6cbf5a', greenS: '#3f8a4a', greenD: '#2c6440', teal: '#3fb3a8', tealS: '#2a7d7e',
    blue: '#4f7fd6', blueS: '#35539b', navy: '#2a3566', sky: '#9fd3f0', purple: '#8d5cc2', purpleS: '#5e3c8a',
    pink: '#f59ab7', pinkS: '#c9688c', brown: '#9a6239', brownS: '#6b4128', brownD: '#4a2c1d', tan: '#d8a86a', tanS: '#a87b45',
    grey: '#9a9aae', greyS: '#6c6c82', greyD: '#46465a', stone: '#b9b2a6', stoneS: '#8a8378', stoneD: '#5c574f',
    gold: '#ffd25e', goldS: '#d39a2c', ghost: '#e8f0ff', ghostS: '#a9b9e0',
};

function grid(w, h) { return { w, h, p: new Array(w * h).fill(null) }; }
function px(g, x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < g.w && y < g.h) g.p[y * g.w + x] = c; }
function gpx(g, x, y) { return x >= 0 && y >= 0 && x < g.w && y < g.h ? g.p[y * g.w + x] : null; }
function rect(g, x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) px(g, x + i, y + j, c); }
function ell(g, cx, cy, rx, ry, c) {
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++)
        for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
            const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
            if (dx * dx + dy * dy <= 1) px(g, x, y, c);

/* spec: { skin, hair, style, top, bottom, shoes, tall, round, hat, extra(g, dir) } ; dir: down|up|right ; f: 0 stand, 1/2 walk */
function personGrid(sp, dir, f) {
    const tall = sp.tall ? 4 : 0, round = sp.round ? 1 : 0;
    const H = 20 + tall, g = grid(16, H);
    const base = H - 1;                     /* feet's bottom row */
    const legH = 2 + (sp.tall ? 2 : 0);
    const torsoTop = base - 2 - legH - 5;   /* torso 6 rows */
    const hy = torsoTop - 4;                /* head center y */
    const lift = f === 1 ? -1 : 0, lift2 = f === 2 ? -1 : 0;
    const top = sp.top, topS = sp.topS || mixHex(sp.top, P.ink, 0.3);
    const bot = sp.bottom, shoes = sp.shoes || P.brownD;
    if (dir === 'right') {
        /* legs, one in front of the other while walking */
        const sw = f === 1 ? 1 : f === 2 ? -1 : 0;
        rect(g, 7 - sw, base - 1 - legH, 2, legH, mixHex(bot, P.ink, 0.25)); rect(g, 7 - sw, base - 1, 3, 2, shoes);
        rect(g, 7 + sw, base - 1 - legH, 2, legH, bot); rect(g, 7 + sw, base - 1, 3, 2, shoes);
        rect(g, 5 - round, torsoTop, 6 + round * 2, 6, top);
        if (sp.skirt) rect(g, 4 - round, torsoTop + 4, 8 + round * 2, 3, sp.skirt);
        /* arm swinging */
        const as = f === 1 ? 1 : f === 2 ? -1 : 0;
        rect(g, 7 + as, torsoTop + 1, 2, 4, topS); px(g, 7 + as, torsoTop + 5, sp.skin); px(g, 8 + as, torsoTop + 5, sp.skin);
        ell(g, 8, hy, 4.6, 4.4, sp.skin);
        px(g, 11, hy + 1, sp.skin); px(g, 12, hy + 1, sp.skin);  /* nose */
        px(g, 10, hy, P.ink);                                       /* eye */
        if (sp.blush) px(g, 9, hy + 2, sp.blush);
        hairGrid(g, sp, 'right', hy);
    } else {
        const up = dir === 'up';
        rect(g, 5, base - 1 - legH + lift, 2, legH, bot); rect(g, 5, base - 1 + lift, 2, 2, shoes);
        rect(g, 9, base - 1 - legH + lift2, 2, legH, bot); rect(g, 9, base - 1 + lift2, 2, 2, shoes);
        rect(g, 4 - round, torsoTop, 8 + round * 2, 6, top);
        if (sp.skirt) rect(g, 3 - round, torsoTop + 4, 10 + round * 2, 3, sp.skirt);
        if (sp.apron && !up) rect(g, 5, torsoTop + 1, 6, 5, sp.apron);
        const a1 = f === 1 ? -1 : 0, a2 = f === 2 ? -1 : 0;
        rect(g, 3 - round, torsoTop + 1 + a1, 1, 4, topS); px(g, 3 - round, torsoTop + 5 + a1, sp.skin);
        rect(g, 12 + round, torsoTop + 1 + a2, 1, 4, topS); px(g, 12 + round, torsoTop + 5 + a2, sp.skin);
        shade(g, top, topS, (x) => x >= 11 + round);
        ell(g, 8, hy, 4.8, 4.4, sp.skin);
        if (!up) {
            const ey = f === 3 ? hy - 1 : hy;
            px(g, 6, ey, P.ink); px(g, 9, ey, P.ink);
            if (f === 3) { px(g, 6, ey - 1, P.white); px(g, 9, ey - 1, P.white); }
            if (sp.blush) { px(g, 5, hy + 2, sp.blush); px(g, 10, hy + 2, sp.blush); }
            if (sp.glasses) { px(g, 5, hy, sp.glasses); px(g, 7, hy, sp.glasses); px(g, 8, hy, sp.glasses); px(g, 10, hy, sp.glasses); }
            if (sp.beard) { rect(g, 5, hy + 2, 6, 3, sp.beard); px(g, 4, hy + 1, sp.beard); px(g, 11, hy + 1, sp.beard); }
            if (sp.mouth) px(g, 7, hy + 2, sp.mouth), px(g, 8, hy + 2, sp.mouth);

function hairGrid(g, sp, d, hy) {
    const h = sp.hair, hs = mixHex(sp.hair || '#000000', P.ink, 0.3), st = sp.style;
    if (st === 'bald') { if (d === 'up') ell(g, 8, hy - 1, 4, 2, sp.skinS || P.skinS); return; }
    if (st === 'beanie') {           /* Dot: a red beanie with a white pompom */
        const c = sp.hat || P.red, cs = mixHex(c, P.ink, 0.3);
        ell(g, 8, hy - 2, 5, 3.4, c); rect(g, 3, hy - 1, 10, 2, cs);
        if (d === 'right') { ell(g, 6, hy - 6, 1.6, 1.6, P.white); px(g, 4, hy + 1, h); px(g, 4, hy + 2, h); }

    }
    if (st === 'cap') {
        const c = sp.hat || P.blue;
        ell(g, 8, hy - 2, 4.8, 3, c);

        if (d === 'right') rect(g, 9, hy - 1, 5, 1, mixHex(c, P.ink, 0.3));
        if (d === 'up') rect(g, 4, hy, 8, 3, h);
        return;
    }
    if (st === 'wide') {             /* a wide-brimmed hat */
        const c = sp.hat || P.tan;
        rect(g, 1, hy - 2, 14, 2, mixHex(c, P.ink, 0.2)); ell(g, 8, hy - 4, 4, 2.6, c);
        if (d === 'up') rect(g, 4, hy, 8, 3, h);
        return;
    }
    /* hair over the head */
    ell(g, 8, hy - 2, 5, 3, h);
    if (d === 'up') { ell(g, 8, hy, 5, 4, h); }
    if (d === 'down') { px(g, 3, hy, h); px(g, 12, hy, h); rect(g, 5, hy - 2, 6, 1, h); }
    if (d === 'right') { rect(g, 3, hy - 2, 4, 4, h); }

    if (st === 'bun') { ell(g, 8, hy - 5, 2.4, 2, h); }
    if (st === 'pigtails') { ell(g, 2, hy + 2, 1.6, 2.4, h); ell(g, 14, hy + 2, 1.6, 2.4, h); }
    if (st === 'spiky') { px(g, 5, hy - 6, h); px(g, 8, hy - 7, h); px(g, 11, hy - 6, h); rect(g, 4, hy - 5, 9, 1, h); }
    if (st === 'bob') { rect(g, 3, hy, 2, 3, h); rect(g, 11, hy, 2, 3, h); if (d === 'up') rect(g, 3, hy, 10, 3, h); }

/* a person's frames: SPR['p:<id>:<dir>:<f>'] ; left is right mirrored */
function personFrame(id, sp, dir, f) {
    const d = dir === 'left' ? 'right' : dir;
    const key = 'p:' + id + ':' + d + ':' + f;
    const c = spr(key, () => toCanvas(personGrid(sp, d, f)));

}

/* buildings: drawn from a few numbers (size, colors, where the door and windows go) */
function buildingGrid(b) {
    const W = b.tw * TILE, wallH = b.wallH || 22, H = b.th * TILE + (b.over || 10);
    const g = grid(W, H);
    const wall = b.wall || P.cream, wallS = mixHex(wall, P.ink, 0.25);
    const roof = b.roof || P.red, roofS = mixHex(roof, P.ink, 0.3), roofL = mixHex(roof, P.white, 0.25);
    const wy = H - wallH;
    /* the front wall */
    rect(g, 1, wy, W - 2, wallH - 1, wall);
    rect(g, 1, H - 3, W - 2, 2, wallS);
    if (b.timber) for (let x = 1; x < W - 2; x += 12) rect(g, x, wy, 2, wallH - 1, P.brownS);
    if (b.brick) for (let y = wy + 2; y < H - 3; y += 4) for (let x = ((y / 4) % 2) * 4 + 1; x < W - 2; x += 8) rect(g, x, y, 1, 3, wallS), rect(g, 1, y + 3, W - 2, 0, wallS);
    /* the roof */
    if (b.flat) {
        rect(g, 0, 0, W, wy + 2, roof); rect(g, 0, wy, W, 3, roofS); rect(g, 2, 2, W - 4, 2, roofL);
    } else {

/* talking: a box at the bottom, letters typed out with each speaker's voice, choices.

const VOICES = {};   /* name -> { pitch, wave } */
const Talk = {
    q: [], cur: null, shown: 0, tick: 0, choice: 0,
    open(item) {
        return new Promise(res => { this.q.push(Object.assign(item, { res })); if (!this.cur) this.next(); });
    },
    next() {
        this.cur = this.q.shift() || null; this.shown = 0; this.choice = 0;
        if (this.cur) { G.state = 'talk'; this.cur.lines = wrapText(this.cur.text, 236); }
        else if (G.state === 'talk') { G.state = 'play'; this.closedAt = G.t; }
    },
    full() { return this.cur && this.shown >= this.cur.text.length; },
    update(dt) {
        const c = this.cur; if (!c) return;
        if (!this.full()) {
            this.tick += dt * (Input.down.act ? 90 : 42);
            while (this.tick >= 1 && !this.full()) {
                this.tick -= 1; const ch = c.text[this.shown++];
                if (/[a-z0-9]/i.test(ch) && this.shown % 2) Sfx.voice(c.who);
                if (/[.!?]/.test(ch)) this.tick -= 6;
            }
            if (Input.hit.act && this.shown > 2) this.shown = c.text.length;
            return;
        }
        if (c.options) {
            if (Input.hit.up || Input.hit.left) { this.choice = (this.choice + c.options.length - 1) % c.options.length; Sfx.play('tick'); }
            if (Input.hit.down || Input.hit.right) { this.choice = (this.choice + 1) % c.options.length; Sfx.play('tick'); }
        }
        if (Input.hit.act) {
            Input.consume('act');
            Sfx.play('next');
            const r = c.options ? this.choice : undefined;
            const res = c.res; this.next(); res(r);
        }
    },
    draw(ctx) {
        const c = this.cur; if (!c) return;
        const s = R.s, bw = 256, lineH = 10;
        const n = c.lines.length + (c.options ? c.options.length : 0);
        const bh = Math.max(40, 14 + n * lineH);
        const bx = (VIEW_W - bw) / 2, by = VIEW_H - bh - 6;
        const X = v => R.gx + v * s, Y = v => R.gy + v * s;
        ctx.fillStyle = 'rgba(26,18,32,0.94)'; roundRect(ctx, X(bx), Y(by), bw * s, bh * s, 4 * s); ctx.fill();
        ctx.strokeStyle = P.cream; ctx.lineWidth = s; roundRect(ctx, X(bx + 1.5), Y(by + 1.5), (bw - 3) * s, (bh - 3) * s, 3 * s); ctx.stroke();
        if (c.who && c.name !== false) {
            const nm = c.name || NAMES[c.who] || c.who; const w = textWidth(nm) + 10;
            ctx.fillStyle = P.cream; roundRect(ctx, X(bx + 8), Y(by - 6), w * s, 11 * s, 3 * s); ctx.fill();
            drawText(ctx, nm, X(bx + 13), Y(by - 4), P.ink, s);
        }
        let left = this.shown;
        c.lines.forEach((ln, i) => {
            const part = ln.slice(0, Math.max(0, left)); left -= ln.length + 1;
            drawText(ctx, part, X(bx + 10), Y(by + 8 + i * lineH), P.white, s, '#00000088');
        });
        if (c.options && this.full()) c.options.forEach((o, i) => {
            const y = by + 10 + (c.lines.length + i) * lineH;
            drawText(ctx, (i === this.choice ? '→ ' : '   ') + o, X(bx + 14), Y(y), i === this.choice ? P.yellow : P.cream, s);
        });
        if (this.full() && !c.options) { const more = this.q.length > 0; if (!more || Math.floor(G.t * 3) % 2) drawText(ctx, more ? '↓' : '·', X(bx + bw - 12), Y(by + bh - 11), P.yellow, s); }
    },
};
const NAMES = {};
function say(text, who, o) { return Talk.open(Object.assign({ text, who }, o)); }
function ask(text, options, who) { return Talk.open({ text, who, options }); }
async function sayAll(lines, who) { for (const l of lines) await say(l, who); }
function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

/* talking to a person: their talk() decides what they say (it can be async) */
async function talkTo(e) {
    if (World.talking) return;
    World.talking = e;
    try {
        if (typeof e.talk === 'function') await e.talk(e);
        else if (Array.isArray(e.talk)) await sayAll(e.talk, e.name);
        else if (e.talk) await say(e.talk, e.name);
    } finally { World.talking = null; }
}
/* a scene: the island waits while it runs (the Laws still hold: only what's in view moves) */
async function scene(fn) {
    World.cutscene = (World.cutscene || 0) + 1;
    try { await fn(); } finally { World.cutscene = World.cutscene > 1 ? World.cutscene - 1 : null; if (!World.cutscene) Cam.hold = null; }
}
const wait = s => new Promise(res => { const until = G.t + s; World.triggers.push({ test: () => G.t >= until, run: res }); });
const until = f => new Promise(res => World.triggers.push({ test: f, run: res }));

/* ---- 11_fx.js ---- */
/* little effects drawn in the world (puffs, sparkles, splashes) and over the screen (fades, toasts) */
const Fx = {
    parts: [], fade: 0, fadeV: 0, flash: 0, toasts: [],
    add(p) { this.parts.push(Object.assign({ t: 0, life: 0.6, map: World.map }, p)); },
    puff(x, y, kind) {
        const n = kind === 'pop' ? 8 : 10;
        for (let i = 0; i < n; i++) {
            const a = i / n * Math.PI * 2;
            this.add({ x, y, vx: Math.cos(a) * 30, vy: Math.sin(a) * 18 - 6, life: 0.45, c: kind === 'return' ? P.gold : P.white, r: 1.5, kind });
        }
    },
    sparkle(x, y, c) { for (let i = 0; i < 6; i++) this.add({ x: x + (Math.random() - 0.5) * 10, y: y + (Math.random() - 0.5) * 10, vx: 0, vy: -10, life: 0.6 + Math.random() * 0.4, c: c || P.gold, r: 1, star: true }); },
    splash(x, y) { for (let i = 0; i < 8; i++) this.add({ x, y, vx: (Math.random() - 0.5) * 40, vy: -30 - Math.random() * 20, g: 120, life: 0.5, c: '#bfe6ff', r: 1.2 }); Sfx.play('splash'); },
    pickup(x, y, what) { this.add({ x, y: y - 6, vx: 0, vy: -16, life: 0.9, text: '+1', c: P.yellow }); },
    fadeIn(s) { this.fade = 1; this.fadeV = -1 / s; },
    fadeOut(s) { this.fadeV = 1 / s; return until(() => this.fade >= 1); },
    toast(text, icon) { this.toasts.push({ text, icon, t: 0 }); },
    update(dt) {
        for (const p of this.parts) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.g) p.vy += p.g * dt; }
        this.parts = this.parts.filter(p => p.t < p.life);
        this.fade = clamp(this.fade + this.fadeV * dt, 0, 1); if (this.fade <= 0 || this.fade >= 1) this.fadeV = this.fade >= 1 && this.fadeV > 0 ? 0 : this.fadeV < 0 && this.fade <= 0 ? 0 : this.fadeV;
        this.flash = Math.max(0, this.flash - dt * 2);
        if (this.toasts.length) { this.toasts[0].t += dt; if (this.toasts[0].t > 3) this.toasts.shift(); }
    },
    draw(D) {
        const ctx = D.ctx;
        for (const p of this.parts) {
            if (p.map !== World.map) continue;
            const a = 1 - p.t / p.life;
            ctx.globalAlpha = Math.max(0, a);
            if (p.text) { drawText(ctx, p.text, D.X(p.x) - 4 * D.k, D.Y(p.y), p.c, D.k, P.ink); }
            else { ctx.fillStyle = p.c; const r = (p.r || 1) * D.k * (p.star ? (Math.sin(p.t * 20) > 0 ? 1.4 : 0.8) : 1); ctx.fillRect(D.X(p.x) - r, D.Y(p.y) - r, r * 2, r * 2); }
        }
        ctx.globalAlpha = 1;
    },
};

/* the notebook: Dot writes a law down the first time it happens in front of the player, never before */
const LAWS = [
    { key: 'still', title: 'Still', text: 'Things I can\'t see hold perfectly still. A ball waits in the air; a person waits mid-step. When I look again, they carry on as if nothing happened.' },
    { key: 'return', title: 'Return', text: 'Wild things (eggs, critters, things that grow) that leave my sight are gone. The next time I look where they started, they\'re back there, good as new.' },
    { key: 'hour', title: 'The Hour', text: 'The tower\'s hands only move while someone is looking at them. And the whole island keeps the tower\'s time.' },
    { key: 'bound', title: 'Bound', text: 'Some creatures can\'t bear to be out of sight. They won\'t leave what I can see, so its edge pushes them along wherever it goes.' },
    { key: 'squeeze', title: 'Squeeze', text: 'Squash a Bound thing between the edge and a wall and it pops out somewhere it fits. Even through a fence.' },
    { key: 'wrap', title: 'Turnabout', text: 'In the woods, the edges of what I see meet. Go out one side, come in the other.' },
    { key: 'crowd', title: 'Crowds', text: 'There\'s only room for four of us in a line. The ones farthest from the middle flicker, and flickering, they pass right through each other.' },
    { key: 'tiny', title: 'Tiny', text: 'Things too small to see aren\'t there at all. Look close enough and they are.' },
    { key: 'seam', title: 'Seam', text: 'With the view cut in two, where the halves meet is one place. I can walk from one to the other.' },
    { key: 'away', title: 'Away', text: 'When you looked away from the whole island, all of it waited. Even me.', secret: true },
];
const Notebook = {
    got: {}, open: false, sel: 0, pending: {},
    saw(key, e) {
        /* some keys are steps toward a law, not the law */
        if (key === 'crowd-see') { this.pending.crowd = true; return; }
        if (key === 'seam-split') return;
        if (this.got[key]) return;
        const L = LAWS.find(l => l.key === key); if (!L) return;
        this.got[key] = G.t;
        G.flags.notebook = true;
        Fx.toast((this.count() === 1 ? 'Dot wrote in the notebook (N to read): ' : 'Dot wrote in the notebook: ') + L.title, 'note');
        Sfx.play('write');
        Save.soon();
    },
    count() { return Object.keys(this.got).length; },
};

    draw() {

    /* draw world rect r into the screen rect (sx, sy, sw, sh) */
    drawWorld(r, sx, sy, sw, sh, fi, opts) {

        }

        }

            if (!exists(e)) continue;

            items.push({ y: e.y + e.h + (e.held ? 20 : 0) + (KINDS[e.kind].flat ? -100 : 0), e, draw: () => drawEnt(D, e, r) });
        }

                ctx.fillRect(rx + rw - m - L, ry + m, L, t); ctx.fillRect(rx + rw - m - t, ry + m, t, L);
                ctx.fillRect(rx + m, ry + rh - m - t, L, t); ctx.fillRect(rx + m, ry + rh - m - L, t, L);
                ctx.fillRect(rx + rw - m - L, ry + rh - m - t, L, t); ctx.fillRect(rx + rw - m - t, ry + rh - m - L, t, L);

            });

        }
    },

    Y(wy) { return Math.round(this.sy + (wy - this.r.y) * this.k); },

            case 'step': A.noise(t, 0.03, 0.04, null, 1500); break;
            case 'bell': [523, 1046, 1568].forEach((f, i) => A.tone('sine', f, t, 1.6, 0.18 / (i + 1))); break;

    voice(who) {
        if (!Audio2.ok) return;
        const v = VOICES[who] || { p: 420, w: 'square' };
        const f = v.p * (1 + (Math.random() - 0.5) * (v.wob || 0.12));

/* songs: each part a string of notes, one per step ("-" rest, "." hold). bpm, steps of a 16th */
const SONGS = {};
function song(id, o) { SONGS[id] = o; o.parsed = o.parts.map(p => ({ wave: p.wave, vol: p.vol, oct: p.oct || 0, notes: parseNotes(p.notes) })); o.len = Math.max(...o.parsed.map(p => p.notes.length)); }

    const out = []; const toks = s.trim().split(/\s+/);
    for (const t of toks) {
        if (t === '.') { for (let j = out.length - 1; j >= 0; j--) if (out[j]) { out[j].len++; break; } out.push(null); continue; }
        if (t === '-') { out.push(null); continue; }
        if (t === 'k' || t === 's' || t === 'h') { out.push({ drum: t, len: 1 }); continue; }
        out.push({ f: NOTE[t], len: 1 });

}
const Music = {
    src: null, voices: [], lastStep: -1, quiet: 0,
    mapChanged() { this.cut(); },
    cut() { const t = Audio2.now(); for (const v of this.voices) { try { v.g.gain.cancelScheduledValues(t); v.g.gain.setValueAtTime(v.g.gain.value, t); v.g.gain.linearRampToValueAtTime(0, t + 0.015); v.o.stop(t + 0.03); } catch (e) { } } this.voices = []; },
    /* called every step: the nearest seen source plays; its own clock moved while it was seen (in its update) */
    update() {
        if (!Audio2.ok || !World.map) return;
        let best = null, bd = 1e9;
        const fr = Cam.homeRect(), cx = fr.x + fr.w / 2, cy = fr.y + fr.h / 2;
        for (const e of World.map.ents) {
            if (!e.song || !e.seen || !exists(e)) continue;
            const d = dist(ecx(e), ecy(e), cx, cy) - (e.loud || 0);
            if (d < bd) { bd = d; best = e; }
        }
        if (Cam.eye && !G.flags.lit) best = this.eyeSrc || (this.eyeSrc = { song: 'eye', st: {}, vol: 1 });
        if (this.eyeSrc && best === this.eyeSrc) this.eyeSrc.st.mpos = (this.eyeSrc.st.mpos || 0) + STEP;
        if (G.state === 'title' || G.state === 'ending' && Ending.phase !== 'credits') best = null;
        if (G.state === 'ending' && Ending.phase === 'credits') { best = this.endSrc || (this.endSrc = { song: 'lullaby', st: {}, vol: 1 }); this.endSrc.st.mpos += STEP; }
        if (best !== this.src) { this.cut(); this.src = best; this.lastStep = -1; }
        if (!best) return;
        const S = SONGS[best.song]; if (!S) return;
        const stepLen = 60 / S.bpm / 4;
        const step = Math.floor((best.st.mpos || 0) / stepLen);
        if (step === this.lastStep) return;
        if (this.lastStep >= 0 && step > this.lastStep + 4) { this.lastStep = step - 1; }
        for (let s = Math.max(this.lastStep + 1, step); s <= step; s++) this.playStep(S, s % S.len, stepLen, best.vol || 1);

    },
    playStep(S, i, stepLen, vol) {

            let v;
            if (n.drum) v = Audio2.noise(t, n.drum === 'k' ? 0.12 : n.drum === 's' ? 0.1 : 0.03, (n.drum === 'h' ? 0.05 : 0.18) * p.vol * vol, Audio2.mus, n.drum === 'k' ? 60 : n.drum === 's' ? 1500 : 7000);
            else v = Audio2.tone(p.wave, n.f * Math.pow(2, p.oct), t, n.len * stepLen * 0.95, p.vol * vol, Audio2.mus);

};
/* a source's clock: call from its update (so it only moves while seen) */
function musicStep(e, dt) { e.st.mpos = (e.st.mpos || 0) + dt; }

/* the island's own small sounds, from whatever is in view: the sea, birds by day, crickets at night, wind up high */
const Ambience = {
    next: 0,
    update() {
        if (!Audio2.ok || !World.map || G.state !== 'play' || World.lapse) return;
        if (G.t < this.next) return;
        this.next = G.t + 2.5 + Math.random() * 4;
        const r = Cam.homeRect(), m = World.map;
        if (m.def.indoor) { if (m.id === 'bakery' || m.id === 'home') Ambience.crackle(); return; }
        let water = 0, n = 0, wild = 0, gravel = 0;
        for (let y = Math.floor(r.y / TILE); y < (r.y + r.h) / TILE; y += 2) for (let x = Math.floor(r.x / TILE); x < (r.x + r.w) / TILE; x += 2) {
            const ch = m.t(x, y), t = TT[ch]; n++;
            if (t && t.water) water++; else if (ch === 'p' || ch === '#') gravel++; else if (ch === 'G' || ch === 'P' || ch === '"' || ch === '.' || ch === ',') wild++;
        }
        if (!n) return;
        const t = Audio2.now(), night = Light.night();
        if (water / n > 0.2) Audio2.noise(t, 1.6, 0.05 * (water / n), Audio2.sfx, 300);
        else if (gravel / n > 0.4) Audio2.noise(t, 1.2, 0.025, Audio2.sfx, 900);
        if (wild / n > 0.3) {
            if (night) { for (let i = 0; i < 3; i++) Audio2.tone('sine', 4200 + Math.random() * 300, t + i * 0.09, 0.04, 0.02); }
            else { const f = 2400 + Math.random() * 1200; Audio2.tone('sine', f, t, 0.08, 0.03, null, f * 1.3); Audio2.tone('sine', f * 1.1, t + 0.12, 0.07, 0.025, null, f * 0.9); }
        }
    },
    crackle() { const t = Audio2.now(); for (let i = 0; i < 4; i++) Audio2.noise(t + Math.random() * 0.8, 0.03, 0.03, Audio2.sfx, 2000); },
};

/* ---- 15_save.js ---- */
/* saving: the island in localStorage (one slot), written at moments that matter and every so often.
   Anything that can't be stored (a private window) just isn't, and the game says so once. */
const SAVE_KEY = 'seldom-save-1', SET_KEY = 'seldom-settings';
const Save = {
    pendingAt: 0, warned: false,
    soon() { this.pendingAt = G.t + 1.5; },
    tick() { if (this.pendingAt && G.t >= this.pendingAt) { this.pendingAt = 0; this.write(); } },
    /* everything that matters: flags, the hour, pockets, the notebook, where Dot is, and each map's things */
    snapshot() {
        const maps = {};
        for (const id in MAPS) {
            const m = MAPS[id];
            maps[id] = {
                ents: m.ents.filter(e => e.name && e.kind !== 'dot').map(e => ({ n: e.name, x: Math.round(e.x * 10) / 10, y: Math.round(e.y * 10) / 10, dir: e.dir, gone: e.gone || undefined, rm: e.removed || undefined, st: e.st, hidden: e.hidden || undefined })),
                tiles: m.changed ? Object.fromEntries(Object.entries(m.changed)) : undefined,
                props: m.props.filter(p => p.id).map(p => ({ id: p.id, gone: p.gone || undefined, st: p.st })),
            };
        }
        const d = World.dot;
        return {
            v: 1, at: Date.now(), playT: G.playT || 0, flags: G.flags, hour: World.hour, day: World.day, inv: World.inv, notebook: Notebook.got,
            dot: { map: World.map.id, x: d.x, y: d.y, dir: d.dir }, zmin: Cam.zmin, zmax: Cam.zmax, maps,
        };
    },
    write(force) {
        if (!World.map || World.cutscene && !force || G.state === 'title' || G.noSave) return false;
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.snapshot())); return true; }
        catch (e) { if (!this.warned) { this.warned = true; Fx.toast('This browser won\'t keep a save here.'); } return false; }
    },
    read() { try { const s = localStorage.getItem(SAVE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
    clear() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { } },
    /* lay a save over a freshly built island */
    apply(s) {
        G.flags = s.flags || {}; World.hour = s.hour; World.day = s.day || 1; World.inv = s.inv || {};
        Notebook.got = s.notebook || {}; G.playT = s.playT || 0;
        Cam.zmin = s.zmin || 1; Cam.zmax = s.zmax || 1;
        for (const id in s.maps) {
            const m = MAPS[id], sm = s.maps[id]; if (!m) continue;
            if (sm.tiles) for (const k in sm.tiles) { const [x, y] = k.split(',').map(Number); m.tiles[y * m.w + x] = sm.tiles[k]; m.changed = m.changed || {}; m.changed[k] = sm.tiles[k]; }
            for (const se of sm.ents) {
                const e = m.find(se.n); if (!e) continue;
                e.x = se.x; e.y = se.y; e.dir = se.dir || e.dir; e.gone = !!se.gone; e.st = Object.assign(e.st, se.st || {}); e.hidden = !!se.hidden;
                if (se.rm) { e.removed = true; m.remove(e); }
            }
            for (const sp of sm.props || []) { const p = m.props.find(q => q.id === sp.id); if (p) { p.gone = !!sp.gone; if (sp.st) p.st = sp.st; } }
            m.rebuildSolid();
        }
        Story.restore();
        const d = World.dot;
        World.map = null;
        World.go(s.dot.map, 0, 0, s.dot.dir, { quiet: true });
        d.x = s.dot.x; d.y = s.dot.y; Cam.snap();
        if (World.afterLoad) { const f = World.afterLoad; World.afterLoad = null; f(); }
    },
    settings() { try { localStorage.setItem(SET_KEY, JSON.stringify(Settings)); } catch (e) { } },
    loadSettings() { try { Object.assign(Settings, JSON.parse(localStorage.getItem(SET_KEY) || '{}')); } catch (e) { } },
};
/* change a tile in a way the save remembers */
function setTile(map, x, y, ch) { map.setT(x, y, ch); map.changed = map.changed || {}; map.changed[x + ',' + y] = ch; }

/* the Great Clock: the island's hour moves only while its face is seen (it's an update, so Still does it) */
kind('clock', {
    w: 30, h: 10, ph: 30, fixed: true,
    draw() { },
    update(e, dt) {
        const before = World.hour;
        World.hour += dt * HOUR_RATE * (World.timeScale || 1);
        if (Math.floor(before) !== Math.floor(World.hour)) { Sfx.play('tock'); Story.hourChanged(Math.floor(World.hour)); }
        if (World.hour >= 24) { World.hour -= 24; World.day++; if (typeof midnight === 'function') midnight(); }
    },
    onSeen(e) { if (e.unseenFor > 20 && World.map.id !== 'test') Notebook.saw('hour'); },

function drawTower(D, p) {

/* people's days: where each wants to be at this hour, and finding the way there.
   They only walk while they're seen (an update), so a day nobody watches never happens. */
function findPath(map, sx, sy, tx, ty, self, allSolid) {
    if (sx === tx && sy === ty) return [];
    const W = map.w, key = (x, y) => y * W + x;
    const prev = new Map(); prev.set(key(sx, sy), -1);
    const q = [[sx, sy]]; let n = 0;
    const fixedSolid = new Set();
    for (const e of map.ents) if (e.solid && (e.fixed || allSolid && e !== self) && exists(e)) for (let yy = Math.floor(e.y / TILE); yy <= Math.floor((e.y + e.h - 1) / TILE); yy++) for (let xx = Math.floor(e.x / TILE); xx <= Math.floor((e.x + e.w - 1) / TILE); xx++) fixedSolid.add(yy * map.w + xx);
    const free = (x, y) => (x === tx && y === ty) || (!map.solidAt(x, y) || (map.waterAt(x, y) && deckAt(map, x, y))) && !fixedSolid.has(y * map.w + x);
    while (q.length && n < 12000) {
        const [x, y] = q.shift(); n++;
        if (x === tx && y === ty) break;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {

    const out = []; let k = key(tx, ty);
    while (k !== key(sx, sy)) { out.unshift([k % W, Math.floor(k / W)]); k = prev.get(k); }
    return out;
}

function goTo(e, tx, ty, dt, speed) {
    const g = tx + ',' + ty;
    if (e.goal !== g) { e.goal = g; const [sx, sy] = tileOf(e); e.route = findPath(e.map, sx, sy, tx, ty, e) || [[tx, ty]]; }

    const [nx, ny] = r[0];
    if (walkTo(e, nx * TILE + (TILE - e.w) / 2, ny * TILE + TILE - e.h - 1, dt, speed)) r.shift();

}

function paintIsland() {
    const g = []; for (let y = 0; y < IH; y++) g.push(new Array(IW).fill('d'));
    const ok = (x, y) => x >= 0 && y >= 0 && x < IW && y < IH;

    const get = (x, y) => ok(x, y) ? g[y][x] : 'd';

    const vline = (x, y0, y1, c) => { for (let y = y0; y <= y1; y++) if (get(x, y) !== 'd' && get(x, y) !== '~') set(x, y, c); };

    /* land: a rounded island with a wobbly coast */
    for (let y = 0; y < IH; y++) for (let x = 0; x < IW; x++) {
        const dx = Math.max(4 - x, x - 95, 0), dy = Math.max(3 - y, y - 74, 0);
        const cx = Math.max(0, Math.abs(x - 49.5) - 36), cy = Math.max(0, Math.abs(y - 39) - 26);

        if (dx + dy === 0 && corner < wob) g[y][x] = '.';
    }

    const near = (x, y, r, test) => { for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) if (test(get(x + i, y + j))) return true; return false; };

    rect(27, 36, 8, 9, 'G');                                    /* the clearing at the way in */
    rect(25, 15, 2, 42, 'P');                                   /* wall A: north-south */
    rect(4, 27, 21, 2, '~'); rect(4, 26, 21, 1, 'P'); rect(4, 29, 21, 1, 'P');   /* the stream and its banks */

async function bandTalk() {

};

function bridgetBrain(e, dt) {
    const b = ent('bridgework');
    if (G.flags.bridge) { if (!G.flags.festival || Light.night()) { e.dir = 'down'; return; } goTo(e, 60, 53, dt); return; }
    e.dir = 'right';
    if (World.talking === e) return;
    b.st.p = Math.min(1, (b.st.p || 0) + dt / 22);
    e.anim += dt;
    if (Math.floor(e.t * 2.5) !== Math.floor((e.t - dt) * 2.5)) { Sfx.play('tock'); }
    if (b.st.p >= 1) {
        G.flags.bridge = true;
        for (const [x, y] of [[65, 40], [66, 40], [65, 41], [66, 41]]) setTile(e.map, x, y, 'b');
        bark(e, 'Done!', 3); Sfx.play('chime'); Save.soon();
    }
}

    const d = World.dot;
    d.x = ecx(e) - d.w / 2; d.y = e.y + 2; d.dir = 'up'; d.sitting = true;

const LAPSE = 8;
function lapseDone() {
    const L = World.lapse; if (!L) return true;
    const clock = ent('clock');
    if (L.t > 1 && Input.anyHit && G.t - (Talk.closedAt || 0) > 0.4) return true;
    if (!clock || !clock.seen && L.t > 0.5) return true;
    if (L.until === 'night' && Light.night() && World.hour % 24 >= 20) return true;
    if (L.until === 'day' && World.hour % 24 >= 7.5 && World.hour % 24 < 8) return true;
    return false;
}

/* a stone you stand on (or set something heavy on) */
kind('plate', {
    w: 12, h: 12, ph: 12, fixed: true, flat: true,
    draw(e, D) { box(D, e.x, e.y, 12, 12, e.st.down ? '#6e665b' : '#8a8378'); box(D, e.x + 1, e.y + 1, 10, 10, e.st.down ? '#7d756a' : '#a39a8c'); box(D, e.x + 4, e.y + 4, 4, 4, e.st.down ? P.gold : P.goldS); },
    update(e) {
        let down = false;
        for (const o of e.map.ents) if (o !== e && exists(o) && !o.held && (o.kind === 'dot' || KINDS[o.kind].heavy) && overlap({ x: e.x + 2, y: e.y + 2, w: 8, h: 8 }, o) && !(o.z > 2)) down = true;
        if (down && !e.st.down) Sfx.play('push');
        e.st.down = down;
        if (down) { const g = ent('stonegate'), h = ent('hourglass'); g.st.open = true; h.st.t = HOURGLASS_T; h.st.run = false; }
        else if (e.st.wasDown) { ent('hourglass').st.run = true; }
        e.st.wasDown = down;
    },
});
kind('hourglass', {
    w: 10, h: 6, ph: 22, fixed: true, solid: true,
    init(e) { e.st.t = 0; },
    draw(e, D) {
        box(D, e.x - 2, e.y - 2, 14, 8, P.stone);
        const c = thing('hourglass'); D.img(c, e.x, e.y - 14);
        const f = clamp((e.st.t || 0) / HOURGLASS_T, 0, 1);
        box(D, e.x + 3, e.y - 11 + (1 - f) * 4, 4, f * 4, P.gold);
        box(D, e.x + 3, e.y - 3 - (1 - f) * 4, 4, (1 - f) * 4, P.gold);
        if (e.st.run && e.st.t > 0) box(D, e.x + 4.5, e.y - 7, 1, 4, P.gold);
    },
    update(e, dt) {
        if (!e.st.run || e.st.t <= 0) return;
        e.st.t -= dt;
        if (e.st.t <= 0) { e.st.t = 0; e.st.run = false; const g = ent('stonegate'); if (!G.flags.quarryGate) g.st.closing = true; }
    },
});
kind('stonegate', {
    w: 32, h: 16, ph: 26, solid: true, fixed: true,
    draw(e, D) {
        const o = e.st.o || 0;
        box(D, e.x, e.y - 10, 32, 26, '#5c574f');
        box(D, e.x + 2, e.y - 8 - o * 22, 28, 22 * (1 - o) + 2, '#8a8378');
        for (let i = 0; i < 3; i++) box(D, e.x + 2, e.y - 2 + i * 5 - o * 22, 28, 1, '#6e665b');
    },
    update(e, dt) {
        if (G.flags.quarryGate) e.st.open = true;
        if (e.st.closing) {
            const d = World.dot;
            if (d.map === e.map && overlap(d, { x: e.x, y: e.y - 4, w: e.w, h: e.h + 8 })) return;   /* never on top of Dot */
            e.st.open = false; e.st.closing = false; Sfx.play('thud');
        }
        const t = e.st.open ? 1 : 0;
        e.st.o = clamp((e.st.o || 0) + (t > (e.st.o || 0) ? dt * 4 : -dt * 4), 0, 1);
        e.solid = e.st.o < 0.9;
        if (e.st.o > 0.9 && e.st.open) Notebook.saw('gate', e);
    },
});
kind('lever', {
    w: 8, h: 6, ph: 14, solid: true, fixed: true,
    draw(e, D) { box(D, e.x, e.y, 8, 6, P.stoneS); const on = G.flags.quarryGate; D.ctx.strokeStyle = P.brownS; D.ctx.lineWidth = 2 * D.k; D.ctx.beginPath(); D.ctx.moveTo(D.X(e.x + 4), D.Y(e.y + 2)); D.ctx.lineTo(D.X(e.x + (on ? 8 : 0)), D.Y(e.y - 8)); D.ctx.stroke(); box(D, e.x + (on ? 6 : -2), e.y - 10, 4, 4, P.red); },
    act(e) { if (G.flags.quarryGate) { say('The lever\'s down. The gate stays open.'); return; } G.flags.quarryGate = true; const g = ent('stonegate'); g.st.open = true; Sfx.play('push'); say('Dot pulls the lever. The gate grinds open, and stays open.'); Save.soon(); },
});

/* the spring and the falls: water only comes over while the spring is seen */
kind('spring', {
    w: 32, h: 8, ph: 10, fixed: true, flat: true,
    draw(e, D) { box(D, e.x, e.y, 32, 8, '#4f9fd8'); for (let i = 0; i < 3; i++) box(D, e.x + 4 + i * 10, e.y + 2 + Math.sin(G.t * 6 + i) * 1.5, 4, 2, P.white); },
    update(e, dt) { e.st.flow = (e.st.flow || 0) + dt; },
});
kind('falls', {
    w: 32, h: 80, ph: 80, fixed: true, flat: true,
    init(e) { e.st.drops = []; for (let y = 0; y < 80; y += 4) e.st.drops.push(y); },
    draw(e, D) {
        for (const y of e.st.drops) { box(D, e.x + 2, e.y + y, 28, 5, '#6fb8ea'); box(D, e.x + 4 + (y % 7), e.y + y + 1, 3, 3, '#cdeaff'); }
        if (e.st.drops.length) for (let i = 0; i < 3; i++) box(D, e.x - 2 + i * 13, e.y + 78 + Math.sin(G.t * 8 + i) * 1, 10, 3, P.white);
    },
    update(e, dt) {
        const spring = ent('spring');
        const feeding = spring && Laws.seenBox(visBox(spring));
        e.st.acc = (e.st.acc || 0) + dt;
        if (feeding) while (e.st.acc > 0.05) { e.st.acc -= 0.05; e.st.drops.push(0); }
        else e.st.acc = 0;
        e.st.drops = e.st.drops.map(y => y + 60 * dt).filter(y => y < 80);
        if (!feeding && !e.st.drops.length && !e.st.told) { e.st.told = true; Notebook.saw('still', e); }
        if (feeding) e.st.told = false;
    },
});
function fallsBlocking() { const f = ent('falls'); return f && f.st.drops.some(y => y > 40); }

/* the miners' stone block: push it down the chute; it rolls only while seen, all the way to the cracked wall */
const CHUTE = [[59.5, 7.5], [59.5, 18.5], [64, 18.5]];
kind('block', {
    w: 14, h: 12, ph: 16, solid: true,
    draw(e, D) { const c = thing('crate'); box(D, e.x, e.y - 4, 14, 16, '#8a8378'); box(D, e.x + 1, e.y - 3, 12, 3, '#a39a8c'); box(D, e.x + 3, e.y + 2, 8, 1, '#5c574f'); if (e.st.leg != null) { box(D, e.x + 2, e.y + 9, 10, 2, 'rgba(0,0,0,0.2)'); } },
    push(e, dir) {
        if (e.st.leg != null || e.st.done) return;
        if (dir !== 'down') { say('It won\'t budge that way. The chute\'s just below it.'); return; }
        e.st.leg = 0; e.solid = false; Sfx.play('push');
    },
    update(e, dt) {
        if (e.st.leg == null || e.st.done) return;
        const [tx, ty] = CHUTE[e.st.leg + 1];
        const gx = tx * TILE - e.w / 2, gy = ty * TILE - e.h / 2;
        const dx = gx - e.x, dy = gy - e.y, d = Math.hypot(dx, dy), sp = 70 * dt;
        if (Math.floor(e.t * 6) !== Math.floor((e.t - dt) * 6)) Sfx.play('thud');
        if (d <= sp) { e.x = gx; e.y = gy; e.st.leg++; if (e.st.leg >= CHUTE.length - 1) smashWall(e); }
        else { e.x += dx / d * sp; e.y += dy / d * sp; }
    },
});
function smashWall(e) {
    e.st.done = true; e.removed = true; e.map.remove(e);
    const p = e.map.props.find(q => q.id === 'crackwall'); p.gone = true; e.map.rebuildSolid();
    G.flags.wallBroken = true;
    for (let i = 0; i < 4; i++) Fx.puff(64.5 * TILE, (17.5 + i) * TILE, 'pop');
    Sfx.play('thud'); Sfx.play('push'); Fx.flash = 0.3;
    Save.soon();
}
Story.on('restore', () => { const m = MAPS.island; if (G.flags.wallBroken) { const p = m.props.find(q => q.id === 'crackwall'); if (p) p.gone = true; const b = m.find('block'); if (b) { b.removed = true; m.remove(b); } m.rebuildSolid(); } });
function drawCrackWall(D, p) {
    const x = p.tx * TILE, y = p.ty * TILE;
    box(D, x, y - 6, 16, 70, '#776c62'); for (let i = 0; i < 5; i++) box(D, x, y - 6 + i * 14, 16, 1, '#5c574f');
    D.ctx.strokeStyle = '#2a1b2d'; D.ctx.lineWidth = D.k; D.ctx.beginPath(); D.ctx.moveTo(D.X(x + 3), D.Y(y + 4)); D.ctx.lineTo(D.X(x + 9), D.Y(y + 20)); D.ctx.lineTo(D.X(x + 5), D.Y(y + 34)); D.ctx.lineTo(D.X(x + 11), D.Y(y + 50)); D.ctx.stroke();
}

/* Ruth: lost in the woods, and not fixed to anywhere, so she wraps round the view like everything loose here */
function ruthBrain(e, dt) {
    const d = World.dot;
    e.st.t = (e.st.t || 0) - dt;
    if (e.st.t <= 0) { e.st.t = 2 + hash2(e.t * 3 | 0, 7, 7) * 2; e.st.dx = hash2(e.t * 5 | 0, 1, 8) < 0.5 ? -1 : 1; }
    if (e.st.t > 1) { moveEnt(e, e.st.dx * 18 * dt, 0); e.moving = true; e.dir = e.st.dx < 0 ? 'left' : 'right'; }
    if (e.wrapped && !e.st.joked) { e.st.joked = true; bark(e, 'Not again!', 2); }
}
async function ruthTalk(e) {
    e.st.n = (e.st.n || 0) + 1;
    if (e.st.n === 1) {
        await say('Oh! Hello. I\'m Ruth. I\'ve been trying to walk home for a week. Every time I walk off one side of things, I come right back in the other.', 'ruth');
        await say('In these woods, the edges are doors. Whatever goes out one side comes in at the other. Even me. ESPECIALLY me.', 'ruth');
        return;
    }
    if (G.flags.gateA) { await say('You found the woodcutters\' rope! Now I can... still not get home, because my home is the other way. Never mind.', 'ruth'); return; }
    await say('If you want to get somewhere in here, look the wrong way, then walk the wrong way. That\'s what I\'ve worked out. It\'s not helped me much.', 'ruth');
}
function roverBrain(e, dt) {
    if (!e.st.woke) { e.st.woke = true; e.st.walk = 1.4; bark(e, '...and so I said—', 2); }
    if (e.st.walk > 0) { e.st.walk -= dt; moveEnt(e, 20 * dt, 0); e.moving = true; e.dir = 'right'; }
}
async function roverTalk(e) {
    if (G.flags.curio_sandwich) { await say('Ninety-nine years! And I\'d only meant to nip over to the village for lunch. I think I\'ll sit down for a bit.', 'rover'); return; }
    await say('...and so I said, I\'ll just nip over to the village for lunch— oh! Hello! Didn\'t see you there.', 'rover');
    await say('Strange. It feels like I blinked and the trees grew. What year is it? ...Ninety-nine years?! Nobody\'s looked this way in ninety-nine years?', 'rover');
    await say('Well. My sandwich is still fresh, at least. Here, you have it. I seem to have lost my appetite.', 'rover');
    giveCurio('sandwich');
}

        else if (this.phase === 'credits' && (this.t > CREDITS.length * 1.6 + 6 || Input.hit.act && this.t > 3)) { this.phase = 'after'; this.t = 0; }
        else if (this.phase === 'after' && Input.hit.act && this.t > 1.5) { Game.toTitle(); }

            ctx.save(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.rect(0, 0, R.W, R.H); ctx.arc(this.cx, this.cy, Math.max(0, rad), 0, Math.PI * 2, true); ctx.fill('evenodd'); ctx.restore();

    const n = ['spyglass', 'loupe', 'wideglass', 'prism'].filter(k => F[k]).length;
    if (F.ended) { await say('The light\'s been going all night, every night. I sleep like a baby. First time in years.', 'ansel'); return; }
    if (n >= 4) { await say('All four! Then to the lighthouse with you, Dot. The cape, across the Gap. I\'ll be right behind you.', 'ansel'); return; }
    if (!e.st.told) {
        e.st.told = true;
        await say('Four glasses. The Spyglass, which you have. A loupe, for looking close. A wide glass, for looking far. And a prism, that cut the light in two.', 'ansel');
        await say('Pan\'s family had the loupe. The miners took the wide glass up the quarry. And the prism went south, through the woods, to the Hollow.', 'ansel');
        return;
    }
    await say(`${n} of the four glasses. Your great-great-grandfather would be proud. He was a bit odd about glass.`, 'ansel');
}

/* ---- 40_title.js ---- */
/* the title screen */
const Title = {
    sel: 0, t: 0, has: false,
    enter() { this.t = 0; this.has = !!Save.read(); this.sel = this.has ? 0 : 1; G.state = 'title'; },
    items() { return this.has ? ['Continue', 'New game'] : ['Begin']; },
    update(dt) {
        this.t += dt;
        const items = this.items();
        if (Input.hit.up || Input.hit.down) { this.sel = (this.sel + 1) % items.length; Sfx.play('tick'); }
        if (Input.hit.act || Input.clicked) {
            Audio2.unlock();
            const it = items[this.sel % items.length];
            Sfx.play('next');
            if (it === 'Continue') Game.continueGame();
            else if (it === 'New game') { if (this.confirm) { this.confirm = false; Save.clear(); Game.newGame(); } else { this.confirm = true; } }
            else Game.newGame();
        }
        if (Input.hit.menu || Input.hit.back) this.confirm = false;
    },
    draw(ctx) {
        const s = R.s, X = v => R.gx + v * s, Y = v => R.gy + v * s;
        /* a night sea under a turning beam: the title's picture */
        const g = ctx.createLinearGradient(0, R.gy, 0, R.gy + R.gh);
        g.addColorStop(0, '#1b1838'); g.addColorStop(0.6, '#3a2f5c'); g.addColorStop(1, '#162a44');
        ctx.fillStyle = g; ctx.fillRect(R.gx, R.gy, R.gw, R.gh);
        for (let i = 0; i < 40; i++) { const x = hash2(i, 1, 9) * VIEW_W, y = hash2(i, 2, 9) * 110; ctx.fillStyle = `rgba(255,248,236,${0.3 + 0.5 * Math.abs(Math.sin(this.t * 0.8 + i))})`; ctx.fillRect(X(x), Y(y), s, s); }
        ctx.fillStyle = '#20406a'; ctx.fillRect(X(0), Y(150), R.gw, (VIEW_H - 150) * s);
        for (let i = 0; i < 30; i++) { const x = (hash2(i, 3, 9) * VIEW_W + this.t * 6 * (i % 3 + 1)) % VIEW_W, y = 152 + hash2(i, 4, 9) * 60; ctx.fillStyle = 'rgba(160,200,255,0.35)'; ctx.fillRect(X(x), Y(y), 6 * s, s); }
        ctx.fillStyle = '#2a2440'; ctx.beginPath(); ctx.moveTo(X(250), Y(152)); ctx.lineTo(X(290), Y(128)); ctx.lineTo(X(340), Y(132)); ctx.lineTo(X(384), Y(150)); ctx.lineTo(X(384), Y(156)); ctx.lineTo(X(250), Y(156)); ctx.fill();
        const lh = lighthouseCanvas(false); ctx.drawImage(lh, X(300), Y(132 - lh.height * 0.6), lh.width * 0.6 * s, lh.height * 0.6 * s);
        drawText(ctx, 'SELDOM', X(VIEW_W / 2 - textWidth('SELDOM') * 2.5), Y(54), P.cream, s * 5, '#120c18');
        drawText(ctx, 'a little island, seldom seen', X(VIEW_W / 2 - textWidth('a little island, seldom seen') / 2), Y(98), '#c9b8e8', s);
        const items = this.items();
        if (!document.hasFocus() && !Touch.on && Math.floor(this.t * 2) % 2) drawText(ctx, 'Click the game first, then use the keys', X(VIEW_W / 2 - textWidth('Click the game first, then use the keys') / 2), Y(108), P.yellow, s, '#120c18');
        items.forEach((it, i) => {
            const t = (i === this.sel ? '→ ' : '   ') + (it === 'New game' && this.confirm ? 'New game? (erases the save) Press again' : it);
            drawText(ctx, t, X(VIEW_W / 2 - 40), Y(120 + i * 12), i === this.sel ? P.yellow : P.cream, s, '#120c18');
        });
        drawText(ctx, 'Arrows or WASD: move    Z or Space: choose / talk    Esc: menu', X(6), Y(VIEW_H - 12), '#8a7aa8', s);
        drawText(ctx, 'v1', X(VIEW_W - 14), Y(VIEW_H - 12), '#8a7aa8', s);
    },
};

/* ---- 85_debug.js ---- */
/* debug helpers (only with ?debug): a picture of a whole map, jumping about */
const Debug = {
    /* the whole map drawn small, as a data URL (for checking the layout) */
    mapImage(id, px) {
        const m = MAPS[id || 'island']; px = px || 8;
        const c = document.createElement('canvas'); c.width = m.w * px; c.height = m.h * px;
        const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
        const r = { x: 0, y: 0, w: m.pw, h: m.ph };
        const save = World.map; World.map = m;
        R.drawWorld.call({ ctx, shore: R.shore }, r, 0, 0, c.width, c.height, 0);
        World.map = save;
        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '10px monospace';
        for (let x = 0; x < m.w; x += 10) ctx.fillText(x, x * px + 1, 10);
        for (let y = 10; y < m.h; y += 10) ctx.fillText(y, 1, y * px + 4);
        return c.toDataURL();
    },
    go(tx, ty, mapId) { if (mapId && mapId !== World.map.id) World.go(mapId, tx, ty); const d = World.dot; d.x = tx * TILE + 3; d.y = ty * TILE + 7; Cam.mode = 'follow'; Cam.snap(); },
    give(...flags) { for (const f of flags) G.flags[f] = true; Story.restore(); },
};
/* the bot: plays with the same buttons a person has (used by the playthrough test).
   Async, so the game's scenes (promises) get to run between steps. */
const Bot = {
    log: [],
    keys(o) { Input.keys = Object.assign({}, o || {}); },
    async step(n) { for (let i = 0; i < (n || 1); i++) { tick(STEP); lapseStep(); await null; } },
    async press(b, n) { this.keys({ [b]: true }); await this.step(n || 2); this.keys(); await this.step(2); },
    async talkThrough(max) { let n = 0; while ((G.state === 'talk' || World.cutscene) && n++ < (max || 400)) { if (G.state === 'talk') await this.press('act', 3); await this.step(4); } },
    /* walk Dot to a tile by the grid; returns true when there */
    async walkTo(tx, ty, max) {
        const d = World.dot; max = max || 4000;
        let path = null, guard = 0;
        for (let i = 0; i < max; i++) {
            if (G.state === 'talk' || World.cutscene) await this.talkThrough();
            const [cx, cy] = tileOf(d);
            if (cx === tx && cy === ty) { this.keys(); await this.step(2); return true; }
            if (!path || guard++ > 40) { path = findPath(d.map, cx, cy, tx, ty, d, true) || findPath(d.map, cx, cy, tx, ty) || []; guard = 0; }
            let nx = tx, ny = ty;
            while (path.length && path[0][0] === cx && path[0][1] === cy) path.shift();
            if (path.length) [nx, ny] = path[0];
            const gx = nx * TILE + 8, gy = ny * TILE + 11;
            const dx = gx - ecx(d), dy = gy - (d.y + d.h / 2);
            const k = {};
            if (dx < -1.5) k.left = true; if (dx > 1.5) k.right = true;
            if (dy < -1.5) k.up = true; if (dy > 1.5) k.down = true;
            if (!k.left && !k.right && !k.up && !k.down) { path.shift(); }
            this.keys(k); await this.step(1);
        }
        this.keys(); this.log.push('walkTo failed ' + tx + ',' + ty + ' at ' + tileOf(d)); return false;
    },
    /* hold the look button and pan for some steps */
    async look(k, n) { this.keys(Object.assign({ look: true }, k)); await this.step(n); this.keys(); await this.step(2); },
    async face(dir) { this.keys({ [dir]: true }); await this.step(2); this.keys(); await this.step(1); },
    async act() { await this.press('act'); await this.talkThrough(); },
    /* walk up to someone (from whichever side is free) and talk to them */
    async talkTo(name) {
        const e = ent(name); if (!e) return false;
        for (const [dx, dy, dir] of [[0, -1, 'down'], [0, 1, 'up'], [-1, 0, 'right'], [1, 0, 'left']]) {
            const [x, y] = tileOf(e);
            if (World.map.solidAt(x + dx, y + dy)) continue;
            if (!await this.walkTo(x + dx, y + dy, 1500)) continue;
            await this.face(dir); await this.act(); return true;
        }
        return false;
    },
    async until(f, max) { for (let i = 0; i < (max || 6000); i++) { if (f()) return true; if (G.state === 'talk') await this.talkThrough(); await this.step(1); } return false; },
};

/* a game as it stands right after Lamp Night (for playtesting the second act) */
Debug.afterLampNight = async function () {
    Title.enter(); Game.newGame(); await Bot.talkThrough();
    Object.assign(G.flags, { started: 1, clockSeen: 1, eggsGiven: 1, cakeBaking: 1, cake: 1, bridge: 1, drummer: 1, festival: 1, spyglass: 1, lanterns: 1, ballGame: 1 });
    for (const [x, y] of [[65, 40], [66, 40], [65, 41], [66, 41]]) setTile(MAPS.island, x, y, 'b');
    ent('bridgework').st.p = 1; ent('tilt').hidden = true; ent('ansel').hidden = true; ent('ansel').st.bit = true; ent('flash').hidden = true;
    for (const n of ['still', 'return', 'hour']) Notebook.got[n] = 1;
    World.hour = 21.5; Debug.go(50, 40); World.dot.dir = 'down';
    UI.showHint('Hold X (or Shift) and use the arrows to look around. Let go and the view stays put.', 12);
};

/* ---- 90_main.js ---- */
/* starting, the title, the loop */
const Game = {
    build() {
        for (const k in MAPS) delete MAPS[k];
        entSeq = 1;
        for (const make of MAP_MAKERS) { const m = make(); MAPS[m.id] = m; }
        for (const id in MAPS) MAPS[id].populate();
        World.inv = {}; World.hour = 9; World.day = 1; G.flags = {}; Notebook.got = {}; World.triggers = [];
        World.map = null; World.cutscene = null; World.talking = null;
        Cam.zmin = 1; Cam.zmax = 1; Cam.zoom = Cam.ztarget = 1; Cam.split = false; Cam.mode = 'follow'; Cam.eye = false; Cam.hold = null;
        G.playT = 0; G.hudOff = false;
        const start = MAPS[START.map];
        const d = new GameMap({ id: '_', rows: ['.'] }).add('dot', 0, 0, { name: 'dot', corner: true });
        World.dot = d;
        d.map = null;
        return start;
    },
    newGame() {
        const start = this.build();
        World.dot.map = start; start.ents.push(World.dot);
        World.map = start;
        World.go(START.map, start.startX != null ? start.startX : START.x, start.startY != null ? start.startY : START.y, 'down', { quiet: true });
        G.state = 'play';
        if (START.onNew) START.onNew();
        Fx.fadeIn(1);
    },
    continueGame() {
        const s = Save.read(); if (!s) return this.newGame();
        const start = this.build();
        World.dot.map = start; start.ents.push(World.dot); World.map = start;
        try { Save.apply(s); }
        catch (err) { console.error(err); report('load', err); this.newGame(); return; }
        G.state = 'play';
        Fx.fadeIn(0.8);
        if (START.onContinue) START.onContinue(s);
    },
    toTitle() { Music.cut(); G.state = 'title'; Title.enter(); },
};

function report(where, err) { try { console.warn('[seldom]', where, err && err.stack || err); } catch (e) { } }

let lastT = 0, acc = 0;
function frame(ts) {
    requestAnimationFrame(frame);
    const now = ts / 1000;
    let dt = lastT ? now - lastT : STEP; lastT = now;
    if (dt > 0.25) dt = 0.25;
    acc += dt;
    let n = 0;
    while (acc >= STEP && n < 5) { acc -= STEP; tick(STEP); n++; }
    /* watching the Clock from the bench: everything in view runs faster */
    lapseStep();
    if (n === 5) acc = 0;
    try { R.draw(); } catch (err) { report('draw', err); }
}
function lapseStep() {
    if (!World.lapse || G.state !== 'play') return;
    for (let i = 0; i < LAPSE - 1 && World.lapse; i++) { World.lapse.t += STEP; tick(STEP, true); if (lapseDone()) { World.lapse = null; World.dot.sitting = false; } }
}
function tick(dt, fast) {
    G.t += dt; G.frame++;
    if (!fast) Input.poll(); else { Input.hit = {}; }
    if (Input.hit.debug && G.debug) G.showDebug = !G.showDebug;
    try {
        if (G.state === 'title') { Title.update(dt); return; }
        if (G.state === 'ending' || G.state === 'credits') { Ending.update(dt); Music.update(); return; }
        if (G.state === 'play' || G.state === 'talk') {
            G.playT = (G.playT || 0) + dt;
            if (G.state === 'play' && Input.hit.menu) { UI.openMenu(); return; }
            if (G.state === 'play' && Input.hit.notebook) { G.state = 'notebook'; Sfx.play('open'); return; }
            Cam.update(dt);
            World.update(dt);
            if (G.state === 'talk') Talk.update(dt);
            World.triggers = World.triggers.filter(t => !t.done);
        } else if (G.state === 'notebook') UI.updateNotebook();
        else if (G.state === 'menu') UI.updateMenu();
        Fx.update(dt); UI.update(dt); if (!World.lapse) Music.update(); Ambience.update(); Save.tick();
        if (G.state === 'play' && G.t - (G.lastAuto || 0) > 30) { G.lastAuto = G.t; Save.write(); }
    } catch (err) { report('tick', err); if (G.debug) throw err; }
}

function boot() {
    const cv = document.getElementById('game');
    G.debug = !!window.__DEBUG || /[?&]debug/.test(location.search);
    Save.loadSettings();
    R.init(cv); Input.init(cv); Touch.init(cv);
    cv.focus();
    if (/[?&]test/.test(location.search)) { START.map = 'test'; MAP_MAKERS.length = 0; MAP_MAKERS.push(buildTestMap); START.onNew = () => { G.flags.spyglass = true; G.flags.prism = true; Cam.zmin = 0.5; Cam.zmax = 3; }; G.noSave = true; }
    document.addEventListener('visibilitychange', () => { if (document.hidden) G.hiddenAt = Date.now(); else if (G.hiddenAt) { G.awayFor = Date.now() - G.hiddenAt; G.hiddenAt = 0; Story.hooks.away && Story.hooks.away.forEach(f => f(G.awayFor)); } });
    if (G.debug && /[?&]skip/.test(location.search)) START.onNew = () => { G.flags.started = true; };
    Title.enter();
    requestAnimationFrame(frame);
    if (G.debug) window.__seldom = { G, World, Cam, MAPS, Laws, Game, Notebook, Save, tick, Input, Story, ent, Bot, Debug };
}
window.addEventListener('load', boot);

</script>
