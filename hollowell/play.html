/* The story's machinery: who's who, what they say (TALK, filled by the content files), getting things,
   fainting, the fog, leaving a House with its keys, and conditions on flags. */

const PEOPLE = {};     /* id -> { name, col, voice } */
const TALK = {};       /* id -> function* (npc) : what they say now */
const BUDGE = {};      /* id -> line when pushed off their spot */
const START = { area: 'gran_room', x: 6, y: 3 };

const Story = {
    name(id) { return id === 'wren' ? G.wanderer : (PEOPLE[id] && PEOPLE[id].name) || id; },
    /* {name} in text becomes the Wanderer's name */
    fill(s) { return String(s).replace(/\{name\}/g, G.wanderer || 'Wren'); },
    cond(c) {
        if (typeof c === 'function') return c();
        return c.split('&').every(t => { t = t.trim(); return t[0] === '!' ? !Progress.flag(t.slice(1)) : Progress.flag(t); });
    },
    talk(npc) {
        const f = TALK[npc.who];
        if (f) return () => f(npc);
        return function* () { yield* say(npc.who, '...'); };
    },
    budged(npc) {
        const n = 'budged:' + npc.who;
        const first = !Progress.flag(n);
        Progress.set(n);
        const line = BUDGE[npc.who];
        if (first && line) UI.toast(Story.fill(typeof line === 'function' ? line() : line), 150);
        else if (first) UI.toast(Story.name(npc.who) + ': "Oop."', 120);
        Story.checkBudgedAll && Story.checkBudgedAll();
    },
    /* the fanfare for a found thing */
    getItem(id, srcId) {
        return function* () {
            const p = G.player;
            const I = ITEMS[id] || { name: id, kind: 'quest' };
            const prevState = p.state;
            p.state = 'hold'; p.holding = id;
            Music.duck = true;
            Sfx.play(I.kind === 'tool' || id === 'knot' || id === 'heartstitch' ? 'item' : 'smallitem');
            G.holdUp = { id, t: 0 };
            if (I.kind === 'tool') Inv.giveTool(id);
            else if (id === 'heartpatch') { Inv.patches++; if (srcId) Inv.patchIds.push(srcId); }
            else if (id === 'heartstitch') Inv.addHeart();
            else if (id === 'key') { const h = G.map.def.house; Inv.keyCount[h] = Inv.keys(h) + 1; }
            else if (id === 'pattern') Inv.patterns.push(G.map.def.house);
            else if (id === 'plan') Inv.plans.push(G.map.def.house);
            else if (id.startsWith('b') && /^b\d+$/.test(id)) Inv.buttons += parseInt(id.slice(1));
            else Inv.items[id] = (Inv.items[id] || 0) + 1;
            yield 30;
            const line = ITEM_LINES[id] ? ITEM_LINES[id]() : `You found the {${I.kind === 'tool' ? 'red' : 'blue'}}${I.name}{/}!` + (I.desc ? ' ' + I.desc : '');
            yield* say(null, line);
            if (id === 'heartpatch' && Inv.patches % 4 === 0) { Inv.addHeart(); yield* say(null, 'Four Heart Patches stitch together into a new heart!'); }
            G.holdUp = null;
            p.state = prevState === 'hold' ? 'normal' : 'normal';
            Music.duck = false;
            if (ITEM_AFTER[id]) yield* ITEM_AFTER[id]();
        };
    },
    /* hearts ran out */
    faint() {
        return function* () {
            const p = G.player;
            G.hideHud = false;
            yield 50;
            yield* fadeOut(40);
            Inv.hp = Inv.maxHp;
            const house = G.map.def.house;
            if (house && AREAS[G.map.id].entry) {
                /* in a House, you come to at its door */
                const e = AREAS[G.map.id].entry;
                World.enter(G.map.id, e.x, e.y, { dir: UP });
                Progress.set('fainted_in_house');
                p.state = 'normal';
                yield* fadeIn(30);
                yield* say(null, 'You come to by the door of the House, with no idea how you got here.');
            } else {
                World.enter('gran_room', 4, 3, { dir: DOWN });
                G.player.state = 'sleep';
                yield* fadeIn(40);
                yield 40;
                G.player.state = 'normal';
                yield* Story.wakeAfterFaint();
            }
        };
    },
    *wakeAfterFaint() {
        const n = (Progress.get('faintHome') || 0) + 1; Progress.set('faintHome', n);
        const lines = FAINT_LINES[Math.min(n, FAINT_LINES.length) - 1];
        yield* say(null, lines);
    },
    /* the fog: you can't go further, it pulls you back */
    fogPull(p) {
        Script.run(function* () {
            const n = (Progress.get('fogTries') || 0) + 1; Progress.set('fogTries', n);
            p.flyHome();
            yield () => p.state === 'normal';
            yield* say(null, FOG_LINES[Math.min(n, FOG_LINES.length) - 1]);
        });
    },
    /* small keys fly back into their House */
    leaveHouse(house) {
        const k = Inv.keys(house);
        if (k > 0) {
            Inv.keyCount[house] = 0;
            Progress.set('keys_went_home');
            G.pendingToast = k === 1 ? 'Your small key tugs free and flies back into the House.' : 'Your small keys tug free and fly back into the House.';
            Progress.setAreaFlag('house:' + house, 'keysBack', (Progress.areaFlags['house:' + house] || {}).keysBack + k || k);
        }
    },
};

const ITEM_LINES = {};     /* id -> () => the line when found */
const ITEM_AFTER = {};     /* id -> function* after the fanfare */
const FAINT_LINES = [
    "You wake up in your own bed. There's a cup of warm milk on the stool, and Gran's humming downstairs. You must have walked home in your sleep... somehow.",
    "Home in bed again. Your scarf is folded on the stool. You don't remember the walk at all.",
    "Your bed. Of course. Everything comes home in the end.",
];
const FOG_LINES = [
    "The fog is thick as wool. A few steps in, something tugs you gently back the way you came.",
    "The fog again. It won't let you through: it just turns you round and sends you back.",
    "Everyone knows you can't go into the Drift. The Way always brings you back.",
];

/* The title screen, naming the Wanderer, and the pause menu (Satchel, Map, Journal, Options, Save). */

const Title = {
    sel: 0, t: 0, mode: 'main', slots: [],
    open() { this.sel = 0; this.t = 0; this.mode = 'main'; this.slots = Save.list(); G.scene = 'title'; Music.play('title'); },
    items() {
        const any = this.slots.some(s => s.s);
        return any ? ['Continue', 'New Wander', 'Options'] : ['New Wander', 'Options'];
    },
    update() {
        this.t++;
        if (this.mode === 'slots') return this.updateSlots();
        if (this.mode === 'options') { Options.update(() => { this.mode = 'main'; }); return; }
        const it = this.items();
        if (Input.pressed('up')) { this.sel = (this.sel + it.length - 1) % it.length; Sfx.play('menu'); }
        if (Input.pressed('down')) { this.sel = (this.sel + 1) % it.length; Sfx.play('menu'); }
        if (Input.pressed('act') || Input.pressed('menu')) {
            Sfx.play('select');
            const c = it[this.sel];
            if (c === 'Continue') { this.mode = 'slots'; this.slotSel = 0; this.slotAction = 'load'; }
            else if (c === 'New Wander') { this.mode = 'slots'; this.slotSel = this.slots.findIndex(s => !s.s); if (this.slotSel < 0) this.slotSel = 0; this.slotAction = 'new'; }
            else if (c === 'Options') { this.mode = 'options'; Options.open(); }
        }
    },
    updateSlots() {
        if (Input.pressed('up')) { this.slotSel = (this.slotSel + 2) % 3; Sfx.play('menu'); }
        if (Input.pressed('down')) { this.slotSel = (this.slotSel + 1) % 3; Sfx.play('menu'); }
        if (Input.pressed('atk') || Input.pressed('menu')) { this.mode = 'main'; Sfx.play('cancel'); return; }
        if (Input.pressed('act')) {
            const s = this.slots[this.slotSel];
            if (this.slotAction === 'load') {
                if (!s.s) { Sfx.play('cancel'); return; }
                Sfx.play('select'); Save.slot = s.n; Game.load(s.s);
            } else {
                if (s.s && !this.confirm) { this.confirm = true; Sfx.play('menu'); return; }
                this.confirm = false;
                Sfx.play('select'); Save.slot = s.n; NameEntry.open();

    draw() {
        TitleArt.draw(this.t);

        if (this.mode === 'slots') {
            stitchedBox(60, 70, 200, 96);
            Font.center(this.slotAction === 'load' ? 'Which Wander?' : 'Begin in which slot?', W / 2, 76, PAL.ink);
            this.slots.forEach((s, i) => {

                if (s.s) {

                    Font.draw(`${s.s.name}`, 82, y - 1, PAL.ink);
                    Font.draw(`${(s.s.inv.knots || []).length} Knots  ${h}:${String(m).padStart(2, '0')}`, 82, y + 8, PAL.grey3);
                    Font.draw(Story.placeName(s.s.pos && s.s.pos.area), 252 - Font.width(Story.placeName(s.s.pos && s.s.pos.area)), y + 3, PAL.grey3);
                } else Font.draw('- empty -', 82, y + 3, PAL.grey2);
            });
            if (this.confirm) Font.center('Start over in this slot? Press Z again.', W / 2, 158, PAL.red2);
            return;

        it.forEach((c, i) => {

            if (i === this.sel) { Font.center('\x02 ' + c + '  ', W / 2, y, col); }

/* Debug tools and the test API. play.html?debug turns on F1 (the debug panel); window.HW is how the
   tests (and the autopilot) drive the game: start a game, warp, give tools, set a preset, step frames,
   press buttons, walk to a tile, run a list of commands. */

const Auto = {
    plan: null,
    /* walk Wren to a tile along a path that avoids solid things */
    walk(tx, ty, opts = {}) {
        const p = G.player;
        const path = playerPath(p.area, p.tx, p.ty, tx, ty);
        if (!path) return false;
        this.plan = { kind: 'walk', path, i: 0, stuck: 0, opts };
        return true;
    },
    active() { return !!this.plan; },
    update() {
        const pl = this.plan; if (!pl) return;
        const p = G.player;
        Input.virt = {};
        if (p.state !== 'normal' || Cam.busy || Script.blocking()) return;
        if (pl.kind === 'walk') {
            if (pl.i >= pl.path.length) { this.plan = null; return; }
            const [tx, ty] = pl.path[pl.i];
            const gx = tx * T + 8, gy = ty * T + 10;
            const dx = gx - p.x, dy = gy - p.y;
            if (Math.abs(dx) <= 1.4 && Math.abs(dy) <= 1.4) { pl.i++; pl.stuck = 0; if (pl.i >= pl.path.length) { p.x = gx; p.y = gy; this.plan = null; } return; }
            if (Math.abs(dx) > 1.4) Input.virt[dx < 0 ? 'left' : 'right'] = true;
            if (Math.abs(dy) > 1.4) Input.virt[dy < 0 ? 'up' : 'down'] = true;
            if (++pl.stuck > 240) { this.plan = null; this.failed = 'stuck walking to ' + tx + ',' + ty; }
        }
    },
};
/* a path for Wren: tiles Wren can stand in */
function playerPath(area, sx, sy, gx, gy) {
    const p = G.player;
    const ok = (x, y) => { if (!area.inside(x, y)) return false; const k = area.kind(x, y); if (k.solid || k.pit || k.deep || k.ledge || k.fog) return false; if (area.at(x, y)) return false; return !area.blockers.some(b => b.blocks(x, y, p)); };
    if (sx === gx && sy === gy) return [[gx, gy]];
    const q = [[sx, sy]], prev = new Map([[key2(sx, sy), null]]);
    while (q.length) {
        const [x, y] = q.shift();
        for (let d = 0; d < 4; d++) {
            const nx = x + DX[d], ny = y + DY[d], k = key2(nx, ny);
            if (prev.has(k) || !ok(nx, ny)) continue;
            prev.set(k, [x, y]);
            if (nx === gx && ny === gy) {
                const path = []; let c = [nx, ny];
                while (c) { path.unshift(c); c = prev.get(key2(c[0], c[1])); }
                return path;
            }
            q.push([nx, ny]);
        }
    }
    return null;
}

const PRESETS = {};    /* name -> () => sets up a game state (the content files add these) */

const HW = {
    G, Inv, Progress, Stats, Save, World, Script, Input, Return, AREAS, ERRORS, LOG, PRESETS, Auto, Story, Dialog, Cam,
    newGame(name = 'Wren', opts = {}) { G.noAutosave = !!opts.noAutosave; Game.newGame(name, opts); if (opts.skipIntro) { Script.clear(); Dialog.active = false; UI.fadeA = 0; } return this.state(); },
    warp(id, x, y, dir) { World.enter(id, x, y, { dir }); return this.state(); },
    preset(name) { PRESETS[name](); return this.state(); },
    give(id) { if (ITEMS[id] && ITEMS[id].kind === 'tool') Inv.giveTool(id); else Inv.items[id] = (Inv.items[id] || 0) + 1; },
    step(n = 1) { for (let i = 0; i < n; i++) Game.step(); },
    /* hold buttons for n steps then let go */
    press(btns, n = 2) { btns = [].concat(btns); for (let i = 0; i < n; i++) { Input.virt = {}; for (const b of btns) Input.virt[b] = true; Game.step(); } Input.virt = {}; Game.step(); },
    hold(btns) { Input.virt = {}; for (const b of [].concat(btns)) Input.virt[b] = true; },
    release() { Input.virt = {}; },
    /* talk through any open dialogue (picking choice i when asked) */
    skipTalk(choice = 0, max = 4000) {
        for (let n = 0; n < max && (Dialog.active || Script.blocking()); n++) {
            if (Dialog.active && Dialog.shown >= Dialog.pageLen()) {
                if (Dialog.choices && Dialog.page === Dialog.pages.length - 1) { Dialog.sel = choice; }
                this.press('act', 1);
            } else this.step(1);
        }
        return !Dialog.active;
    },
    walkTo(tx, ty, max = 3000) {
        if (!Auto.walk(tx, ty)) return false;
        for (let n = 0; n < max && Auto.active(); n++) { Auto.update(); Game.step(); }
        Input.virt = {};
        const p = G.player;
        return p.tx === tx && p.ty === ty;
    },
    /* face a direction without moving (a tap) */
    face(d) { G.player.dir = typeof d === 'string' ? dirByName(d) : d; },
    /* push the thing in front n tiles (walk into it) */
    push(d, n = 1) {
        const dn = typeof d === 'string' ? d : DIR_NAME[d], di = dirByName(dn);
        for (let i = 0; i < n; i++) {
            let moved = null, steps = 0;
            this.hold(dn);
            while (steps++ < 160 && !moved) {
                Game.step();
                const p = G.player, f = p.front();
                const o = p.area.at(f.tx, f.ty);
                if (o && o.mv) moved = o;
            }
            while (moved && moved.mv && steps++ < 260) Game.step();
            this.release(); Game.step();
        }
    },
    /* stand-in for aiming in a fight: hit a creature as a thrown pot or a slam would */
    hitEnemy(e) {
        if (!e.alive) return;
        if (e.shoved && e.type === 'housekeeper') { if (e.state !== 'stunned') e.shoved(DOWN, 10, { weight: 3 }); for (let i = 0; i < 12; i++) Game.step(); e.flash = 0; e.struck(G.player, 1, UP); return; }
        e.flash = 0; e.struck({ isGrid: true, weight: 1 }, 1, -1, true);
    },
    state() {
        const p = G.player;
        return { scene: G.scene, area: G.map && G.map.id, tx: p && p.tx, ty: p && p.ty, x: p && p.x, y: p && p.y, hp: Inv.hp, state: p && p.state, errors: ERRORS.length, dialog: Dialog.active };
    },
    player() { return G.player; },
    at(x, y) { return G.map.at(x, y); },
    ents(kind) { return G.map.ents.filter(e => !kind || e.kind === kind); },
    find(id) { return G.map.find(id); },
};

// ---- 31_art_world.js ----
/* Painted art for the outdoors: trees, bushes, rocks, buildings, the Well, fences, and town things.
   Bigger pictures are painted in code (shapes shaded by light from the upper left, with a texture)
   and outlined automatically, so they sit with the pixel sprites. */

function paintSprite(w, h, fn, outline = true) {
    const c = Gfx.makeCanvas(w, h);
    if (HEADLESS) return c;
    const x = c.getContext('2d');
    fn(x, c);
    if (outline) outlineCanvas(c);
    return c;
}
/* fill a disc pixel by pixel with a colour chosen per pixel */
function discPx(x, cx, cy, r, colFn) {
    for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++) {
        if (i * i + j * j > r * r + r * 0.6) continue;
        const col = colFn(cx + i, cy + j, i / r, j / r);
        if (col) { x.fillStyle = col; x.fillRect(cx + i, cy + j, 1, 1); }
    }
}

const ART = {};          /* name -> canvas */

function treeArt(name, pal, seed = 1, opts = {}) {
    const w = opts.w || 32, h = opts.h || 36;
    ART[name] = paintSprite(w, h, x => {
        const [lo, mid, hi, dark] = pal.leaf;
        /* trunk */
        const tx = w / 2;
        x.fillStyle = pal.bark[1]; x.fillRect(tx - 3, h - 12, 6, 12);
        x.fillStyle = pal.bark[0]; x.fillRect(tx - 3, h - 12, 2, 12);
        x.fillStyle = pal.bark[2]; x.fillRect(tx + 2, h - 12, 1, 12);
        x.fillStyle = pal.bark[2]; x.fillRect(tx - 1, h - 9, 1, 3); x.fillRect(tx + 1, h - 5, 1, 2);
        /* roots */
        x.fillStyle = pal.bark[1]; x.fillRect(tx - 5, h - 2, 3, 2); x.fillRect(tx + 2, h - 2, 3, 2);
        /* canopy: overlapping clumps */
        const clumps = opts.clumps || [[16, 13, 11], [9, 16, 7], [23, 16, 7], [12, 8, 7], [21, 8, 7], [16, 20, 8]];
        for (const [cx, cy, r] of clumps) {
            discPx(x, cx, cy, r, (px, py, u, v) => {
                const light = -u * 0.5 - v * 0.8 + (hash2(px, py, seed) - 0.5) * 0.7;
                if (light > 0.55) return hi;
                if (light > 0.05) return mid;
                if (light > -0.6) return lo;
                return dark;
            });
        }
        /* leaf texture: little dark notches */
        for (let n = 0; n < 40; n++) {
            const px = Math.floor(hash2(n, seed, 3) * w), py = Math.floor(hash2(seed, n, 5) * (h - 10));
            const d = x.getImageData(px, py, 1, 1).data;
            if (d[3] > 0) { x.fillStyle = dark; x.fillRect(px, py, 1, 1); x.fillStyle = hi; if (py > 0) x.fillRect(px, py - 1, 1, 1); }
        }
        if (pal.fruit) for (let n = 0; n < 5; n++) {
            const px = 6 + Math.floor(hash2(n, seed, 9) * (w - 12)), py = 5 + Math.floor(hash2(seed, n, 11) * 16);
            const d = x.getImageData(px, py, 1, 1).data;
            if (d[3] > 0) { x.fillStyle = pal.fruit; x.fillRect(px, py, 2, 2); x.fillStyle = '#ffffff'; x.fillRect(px, py, 1, 1); }
        }
    });
}

function pineArt(name, pal, seed = 1) {
    ART[name] = paintSprite(26, 40, x => {
        x.fillStyle = pal.bark[1]; x.fillRect(11, 32, 4, 8);
        x.fillStyle = pal.bark[0]; x.fillRect(11, 32, 1, 8);
        const tiers = [[13, 2, 4, 8], [13, 7, 7, 13], [13, 13, 9, 20], [13, 19, 11, 28], [13, 25, 12, 34]];
        for (const [cx, top, half, bot] of tiers) {
            for (let y = top; y <= bot; y++) {
                const k = (y - top) / (bot - top), hw = Math.round(half * k);
                for (let i = -hw; i <= hw; i++) {
                    const u = i / (hw || 1);
                    const l = -u * 0.6 + (1 - k) * 0.5 + (hash2(cx + i, y, seed) - 0.5) * 0.5;
                    x.fillStyle = l > 0.5 ? pal.leaf[2] : l > -0.1 ? pal.leaf[1] : l > -0.6 ? pal.leaf[0] : pal.leaf[3];
                    x.fillRect(cx + i, y, 1, 1);
                }
            }
        }
    });
}

function bushArt(name, pal, seed = 1, w = 16, h = 14) {
    ART[name] = paintSprite(w, h, x => {
        const clumps = [[w / 2, h / 2 + 1, 6], [w / 2 - 4, h / 2 + 2, 4], [w / 2 + 4, h / 2 + 2, 4], [w / 2 - 2, h / 2 - 2, 4], [w / 2 + 3, h / 2 - 2, 4]];
        for (const [cx, cy, r] of clumps) discPx(x, Math.round(cx), Math.round(cy), r, (px, py, u, v) => {
            const l = -u * 0.5 - v * 0.8 + (hash2(px, py, seed) - 0.5) * 0.8;
            return l > 0.55 ? pal[2] : l > 0 ? pal[1] : l > -0.6 ? pal[0] : pal[3];
        });
        if (pal[4]) for (let n = 0; n < 4; n++) { const px = 3 + Math.floor(hash2(n, seed, 1) * (w - 6)), py = 2 + Math.floor(hash2(seed, n, 2) * (h - 6)); x.fillStyle = pal[4]; x.fillRect(px, py, 2, 2); x.fillStyle = '#fff8e0'; x.fillRect(px, py, 1, 1); }
    });
}

function rockArt(name, pal, seed = 1, w = 16, h = 14) {
    ART[name] = paintSprite(w, h, x => {
        discPx(x, w / 2, h / 2 + 1, Math.min(w, h) / 2 - 1, (px, py, u, v) => {
            if (v < -0.75 && Math.abs(u) > 0.5) return null;
            const l = -u * 0.6 - v * 0.9 + (hash2(px, py, seed) - 0.5) * 0.4;
            return l > 0.6 ? pal[2] : l > 0 ? pal[1] : l > -0.6 ? pal[0] : pal[3];
        });
    });
}

/* buildings: a roof seen from above, a front wall with a door and windows, painted to a style */
const BSTYLE = {
    cottage: { roof: ['#c45a4a', '#9a3a3a', '#e07a64', '#6e2a2a'], wall: ['#f4e6c8', '#d8c49e'], timber: '#7a4e32', trim: '#5a3a26', door: '#8a5a3a', win: '#7ec8f0' },
    blue: { roof: ['#4a7ac4', '#2e5a98', '#6a9ae0', '#1e3a6a'], wall: ['#f0e8d4', '#d4c8ac'], timber: '#6b4128', trim: '#45281c', door: '#6b4128', win: '#bfe8fb' },
    green: { roof: ['#5aa05a', '#3a7a42', '#7cc070', '#245a2e'], wall: ['#f4e6c8', '#d8c49e'], timber: '#7a4e32', trim: '#5a3a26', door: '#9a6438', win: '#7ec8f0' },
    plum: { roof: ['#8a5aa0', '#6a3a80', '#aa7cc4', '#4a2a5a'], wall: ['#f0e4d8', '#d4c4b4'], timber: '#5a3a3a', trim: '#3e2828', door: '#7a4a4a', win: '#c8e8f8' },
    inn: { roof: ['#3fa8a0', '#2a7e78', '#6ad0c4', '#1e5a56'], wall: ['#f6ead0', '#dccaa4'], timber: '#6b4128', trim: '#45281c', door: '#9a3a4a', win: '#ffe8a0' },
    stone: { roof: ['#8a8070', '#6a6050', '#aaa090', '#4a4438'], wall: ['#c8bcac', '#a89c8c'], timber: '#6a6050', trim: '#4a4438', door: '#6b4128', win: '#7ec8f0' },
    ochre: { roof: ['#d98f3a', '#a8642a', '#f0b060', '#7a4420'], wall: ['#f4e6c8', '#d8c49e'], timber: '#7a4e32', trim: '#5a3a26', door: '#6b4128', win: '#7ec8f0' },
    school: { roof: ['#b0434a', '#8a2a32', '#d06a6a', '#5a1a22'], wall: ['#e8d8b8', '#cdb88c'], timber: '#6b4128', trim: '#45281c', door: '#3a5a8a', win: '#bfe8fb' },
};

function buildingArt(name, wT, hT, style, opts = {}) {
    const S = BSTYLE[style] || BSTYLE.cottage;
    const w = wT * T, wallH = opts.wallH || 22, h = hT * T + 6;
    const roofH = h - wallH;
    const doorX = opts.door !== undefined ? opts.door * T + 3 : Math.floor(w / 2 / T) * T + 3;
    ART[name] = paintSprite(w, h, x => {
        /* front wall */
        const wy = roofH;
        x.fillStyle = S.wall[0]; x.fillRect(1, wy, w - 2, wallH);
        for (let j = 0; j < wallH; j++) for (let i = 1; i < w - 1; i++) if (hash2(i, j, 7) < 0.08) { x.fillStyle = S.wall[1]; x.fillRect(i, wy + j, 1, 1); }
        /* timber frame */
        if (!opts.noTimber) {
            x.fillStyle = S.timber;
            x.fillRect(1, wy, w - 2, 2); x.fillRect(1, wy + wallH - 3, w - 2, 3);
            for (let i = 1; i < w; i += T) x.fillRect(i, wy, 2, wallH);
            x.fillRect(w - 3, wy, 2, wallH);
        }
        /* windows */
        const wins = opts.windows || [];
        for (const wx of wins) {
            const px0 = wx * T + 3;
            x.fillStyle = S.trim; x.fillRect(px0 - 1, wy + 4, 12, 11);
            x.fillStyle = S.win; x.fillRect(px0, wy + 5, 10, 9);
            x.fillStyle = shade(S.win, 0.5); x.fillRect(px0 + 1, wy + 6, 3, 3);
            x.fillStyle = S.trim; x.fillRect(px0 + 4, wy + 5, 1, 9); x.fillRect(px0, wy + 9, 10, 1);
            /* flower box */
            x.fillStyle = '#8a5a3a'; x.fillRect(px0 - 1, wy + 15, 12, 3);
            for (let i = 0; i < 5; i++) { x.fillStyle = ['#e8463c', '#f7d64a', '#f59ac0', '#fbf6ea', '#b48ce8'][(i + wx) % 5]; x.fillRect(px0 + i * 2, wy + 13, 2, 2); }
        }
        /* door */
        if (opts.door !== null) {
            x.fillStyle = S.trim; x.fillRect(doorX - 1, wy + 3, 12, wallH - 3);
            x.fillStyle = S.door; x.fillRect(doorX, wy + 4, 10, wallH - 4);
            x.fillStyle = shade(S.door, 0.2); x.fillRect(doorX + 1, wy + 5, 3, wallH - 7); x.fillRect(doorX + 6, wy + 5, 3, wallH - 7);
            x.fillStyle = '#f7d64a'; x.fillRect(doorX + 7, wy + 12, 1, 2);
            x.fillStyle = S.trim; x.fillRect(doorX, wy + 3, 10, 1);
        }
        /* roof: rows of shingles, the ridge on top, eaves overhanging the wall */
        const [r0, r1, r2, r3] = S.roof;
        for (let j = 0; j < roofH + 3; j++) {
            for (let i = 0; i < w; i++) {
                const row = Math.floor(j / 4), off = (row % 2) * 4;
                const edge = (i + off) % 8 === 0;
                let col = j < 3 ? r2 : r0;
                if (j % 4 === 3) col = r1;
                if (edge && j > 2) col = r1;
                if (hash2(i, j, 13) < 0.05) col = r2;
                if (j >= roofH) col = j === roofH + 2 ? r3 : r1;   /* eaves */
                if (i === 0 || i === w - 1) col = r3;
                x.fillStyle = col; x.fillRect(i, j, 1, 1);
            }
        }
        /* the ridge */
        x.fillStyle = r3; x.fillRect(0, 0, w, 1);
        x.fillStyle = r2; x.fillRect(1, 1, w - 2, 1);
        /* chimney */
        if (opts.chimney !== false) {
            const cx = opts.chimneyX !== undefined ? opts.chimneyX : w - 14;
            x.fillStyle = '#9a8a7a'; x.fillRect(cx, 2, 7, 9); x.fillStyle = '#7a6a5a'; x.fillRect(cx + 5, 2, 2, 9);
            x.fillStyle = '#5a4a3a'; x.fillRect(cx - 1, 1, 9, 2);
        }
        if (opts.sign) {
            const sx = opts.sign.x * T + 2;
            x.fillStyle = S.trim; x.fillRect(sx, wy - 1, 14, 9);
            x.fillStyle = opts.sign.col || '#f4e0a8'; x.fillRect(sx + 1, wy, 12, 7);
            x.fillStyle = S.trim; x.fillRect(sx + 3, wy + 2, 8, 1); x.fillRect(sx + 3, wy + 4, 6, 1);
            if (opts.sign.icon) opts.sign.icon(x, sx + 1, wy);
        }
    });
    return { h, roofH };
}

/* a building standing in the world: its picture, the tiles it blocks, and a door you walk into */
SPAWN.building = (tx, ty, p) => {
    const name = 'b_' + (p.style || 'cottage') + '_' + p.w + 'x' + p.h + '_' + (p.door !== undefined ? p.door : 'm') + '_' + (p.windows || []).join('.') + (p.sign ? 's' + p.sign.x : '') + (p.variant || '');
    if (!ART[name]) buildingArt(name, p.w, p.h, p.style, p);
    const im = ART[name];
    const solid = [];
    const doorX = p.door !== undefined ? p.door : Math.floor(p.w / 2);
    for (let j = 0; j < p.h; j++) for (let i = 0; i < p.w; i++) if (!(j === p.h - 1 && i === doorX && p.door !== null)) solid.push([i, j]);
    const prop = new Prop(tx, ty, { im, solid, oy: -6, baseY: im.height });
    prop.isBuilding = true;
    return prop;
};
SPAWN.tree = (tx, ty, p) => {
    const im = ART[p.look || 'tree'];
    const pr = new Prop(tx, ty, { im, solid: p.deco ? [] : p.small ? [[0, 0]] : [[0, 1], [1, 1]], ox: 0, oy: -(im.height - 32), baseY: im.height - 2 });
    if (p.small) pr.solid = [[0, 0]];
    return pr;
};
SPAWN.deco = (tx, ty, p) => {
    const im = ART[p.look];
    const pr = new Prop(tx, ty, { im, solid: p.solid === false ? [] : (p.solid || [[0, 0]]), ox: p.ox !== undefined ? p.ox : Math.round((16 - im.width) / 2), oy: p.oy !== undefined ? p.oy : 16 - im.height, flip: p.flip });
    pr.baseY = p.baseY !== undefined ? p.baseY : im.height;
    if (p.text) { pr.interact = () => { Script.run(function* () { yield* say(null, p.text); }); return true; }; pr.talkBox = (pl, f) => pr.solid.some(([dx, dy]) => tx + dx === f.tx && ty + dy === f.ty); }
    return pr;
};

// ---- 32_overworld.js ----
/* The Hollow: one big outdoor map put together from nine blocks of 64x40 tiles (a region each, the town in
   the middle). Each block has its own theme (palette), music and names; forest ('Y') gets its trees placed
   automatically; unfinished blocks are fog. */

const OW = { bw: 64, bh: 40, cols: 3, rows: 3, blocks: {} };
function defBlock(b) { OW.blocks[b.bx + ',' + b.by] = b; return b; }

const OW_LEGEND = {
    'Y': { k: 'tree', p: 'forest' }, 'X': { k: 'roof', p: 'grass' },
    'T': { k: 'grass', p: 'grass', ent: 'tree', props: { look: 'tree' } },
    'A': { k: 'grass', p: 'grass', ent: 'tree', props: { look: 'tree_apple' } },
    'b': { k: 'grass', p: 'grass', ent: 'deco', props: { look: 'bush' } },
    'B': { k: 'grass', p: 'grass', ent: 'deco', props: { look: 'bush_berry' } },
    'r': { k: 'grass', p: 'grass', ent: 'deco', props: { look: 'rock' } },
    'f': { k: 'grass', p: 'grass', ent: 'deco', props: { look: 'fence' } },
    'l': { k: 'grass', p: 'grass', ent: 'deco', props: { look: 'fence_v' } },
    'h': { k: 'grass', p: 'grass', ent: 'deco', props: { look: 'haybale' } },
    'n': { k: 'grass', p: 'grass', ent: 'rest' },
    'w': { k: 'grass', p: 'flowers', ent: 'deco', props: { look: 'flowerbed', solid: [[0, 0]] } },
    'm': { k: 'path', p: 'cobble', ent: 'deco', props: { look: 'flowerbed', solid: [[0, 0]] } },
};

function buildOverworld() {
    const W2 = OW.bw * OW.cols, H2 = OW.bh * OW.rows;
    const rows = [];
    const themes = [];
    const ents = [], regions = [];
    for (let y = 0; y < H2; y++) rows.push(new Array(W2).fill('%'));
    for (let by = 0; by < OW.rows; by++) for (let bx = 0; bx < OW.cols; bx++) {
        const b = OW.blocks[bx + ',' + by];
        const ox = bx * OW.bw, oy = by * OW.bh;
        themes.push(b ? b.theme : 'town');
        if (!b) continue;
        const br = b.rows;
        for (let y = 0; y < OW.bh; y++) for (let x = 0; x < OW.bw; x++) rows[oy + y][ox + x] = (br[y] && br[y][x]) || '%';
        for (const e of b.ents || []) ents.push(Object.assign({}, e, { x: e.x + ox, y: e.y + oy, block: b.id }));
        regions.push({ name: b.name, sub: b.sub, x: ox, y: oy, w: OW.bw, h: OW.bh, music: b.music, mark: true, id: b.id });
        for (const r of b.regions || []) regions.unshift(Object.assign({}, r, { x: r.x + ox, y: r.y + oy, music: r.music || b.music }));
    }
    /* trees on the forest */
    for (let y = 0; y < H2 - 1; y += 2) for (let x = (y / 2) % 2; x < W2 - 1; x += 2) {
        if (rows[y][x] === 'Y' && rows[y + 1][x] === 'Y' && rows[y][x + 1] === 'Y' && rows[y + 1][x + 1] === 'Y') {
            const b = OW.blocks[Math.floor(x / OW.bw) + ',' + Math.floor(y / OW.bh)];
            const looks = (b && b.forest) || ['tree', 'tree2'];
            const look = looks[Math.floor(hash2(x, y, 5) * looks.length)];
            ents.push({ k: 'tree', x, y, look, deco: true });
        }
    }
    defArea({
        id: 'hollow', name: 'The Hollow', family: 'outdoor', theme: 'town',
        rows: rows.map(r => r.join('')),
        legend: Object.assign({}, OW_LEGEND, ...Object.values(OW.blocks).map(b => b.legend || {})),
        ents, regions,
        themeAt: (tx, ty) => themes[clamp(Math.floor(ty / OW.bh), 0, OW.rows - 1) * OW.cols + clamp(Math.floor(tx / OW.bw), 0, OW.cols - 1)],
        music: 'town', quietName: false,
        tick: a => { for (const b of Object.values(OW.blocks)) if (b.tick) b.tick(a); },
        onEnter: (a, o) => { for (const b of Object.values(OW.blocks)) if (b.onEnter) b.onEnter(a, o); },
    });
}
CONTENT_INIT.push(buildOverworld);

/* rest spots: a stump with a stitched cross. Sit (Z) to tie off your thread here: your mark, and a save */
SPAWN.rest = (tx, ty, p) => {
    const pr = new Prop(tx, ty, { im: ART.stump, solid: [[0, 0]], oy: 2 });
    pr.interact = () => {
        Script.run(function* () {
            const pl = G.player;
            const i = yield* ask(null, 'A stump with a little red cross stitched into the bark. Tie off your thread here?', ['Tie off (save)', 'Not now']);
            if (i === 0) {
                pl.setMark(tx, ty + 1);
                Inv.hp = Math.max(Inv.hp, Math.min(Inv.maxHp, Inv.hp + 2));
                Save.write(); Sfx.play('save');
                UI.toast('Tied off. (Saved.)');
                Progress.set('rested');
            }
        });
        return true;
    };
    pr.talkBox = (pl, f) => f.tx === tx && f.ty === ty;
    return pr;
};

/* animals that go where they like (Biscuit) or chase a ball (Pudding) */
class Critter extends Ent {
    constructor(tx, ty, props = {}) {
        super('critter', props);
        this.x = tx * T + 8; this.y = ty * T + 10; this.dir = RIGHT; this.t = 0; this.anim = 0;
        this.route = props.route || null; this.ri = 0; this.wait = 0;
    }
    get sortY() { return this.y + 1; }
    update() {
        this.t++;
        if (this.follow) {
            const p = G.player, d = dist(p.x, p.y, this.x, this.y);
            if (d > 24) { const dx = p.x - this.x, dy = p.y - this.y; this.x += dx / d * 1.1; this.y += dy / d * 1.1; this.dir = dx < 0 ? LEFT : RIGHT; this.anim++; }
            return;
        }
        if (!this.route) return;
        if (this.wait > 0) { this.wait--; return; }
        const [gx, gy, w] = this.route[this.ri];
        const tx = gx * T + 8, ty = gy * T + 10, dx = tx - this.x, dy = ty - this.y, d = Math.hypot(dx, dy);
        if (d < 1) { this.ri = (this.ri + 1) % this.route.length; this.wait = w || 60; return; }
        const sp = this.speed || 0.6;
        this.x += dx / d * Math.min(sp, d); this.y += dy / d * Math.min(sp, d);
        if (Math.abs(dx) > 0.3) this.dir = dx < 0 ? LEFT : RIGHT;
        this.anim++;
    }
    interact() { const f = CRITTER_TALK[this.who]; if (f) Script.run(f(this)); return true; }
    talkBox(p, f) { return Math.abs(f.tx * T + 8 - this.x) < 12 && Math.abs(f.ty * T + 8 - this.y) < 12; }
    draw(cx, cy) {
        const im = spr(this.look + '_' + (Math.floor(this.anim / 10) % 2));
        Gfx.alpha(0.2); Gfx.rect(this.x - cx - 4, this.y - cy + 1, 8, 2, PAL.ink); Gfx.alpha(1);
        if (im) Gfx.img(im, this.x - cx - 8, this.y - cy - 13, this.dir === LEFT);
    }
}

/* Indoors in Hollowell. interior() lays out a room: the back wall two tiles high, side walls, a doorway
   in the front wall that goes back out to the building's door in town. */

const INTERIOR_DOOR = {};      /* interior id -> [x, y] where you stand coming in */

function interior(def) {
    const w = def.w, h = def.h, dx = def.door;
    const rows = [];
    for (let y = 0; y < h; y++) {
        let r = '';
        for (let x = 0; x < w; x++) {
            if (y <= 1 || x === 0 || x === w - 1) r += '#';
            else if (y === h - 1) r += (x === dx ? '.' : '#');
            else r += def.floor ? def.floor(x, y) : '.';
        }
        rows.push(r);
    }
    if (def.rows) def.rows(rows);
    INTERIOR_DOOR[def.id] = [dx, h - 2];
    const ents = (def.ents || []).slice();
    if (def.out) {
        const b = HUB_BUILDINGS.find(b => b.to === def.id);
        const ox = OW.bw * 1, oy = OW.bh * 1;
        ents.push({ k: 'warp', x: dx, y: h - 1, to: 'hollow', tx2: ox + b.x + b.door, ty2: oy + b.y + b.h, face: 'down', dir: 'down' });
        ents.push({ k: 'deco', x: dx, y: h - 2, look: 'doormat', solid: false, oy: 8, baseY: -100 });
    }
    return defArea(Object.assign({ family: 'interior', theme: 'house', music: 'home', rooms: [{ x: 0, y: 0, w, h }] }, def, { rows, ents, entry: { x: dx, y: h - 2 } }));
}

/* Things every House uses: levers, Knot hoops, House doors to the outside, nudges (the Hints option:
   if Wren is stuck in a room a long while, something in the room shifts a little), and the
   "all home" check for rooms that want everything back in its place. */

class Lever extends GridThing {
    constructor(tx, ty, props = {}) {
        super('lever', tx, ty, Object.assign({ weight: WEIGHT.fixed, fixed: true, marked: false }, props));
        this.on = !!props.on;
    }
    onAdd(area) { super.onAdd(area); if (this.id && Progress.areaFlag(area.id, 'lever:' + this.id)) { this.on = true; this.fired = true; } }
    interact() {
        if (this.once && this.on) return false;
        this.on = !this.on; Sfx.play('click'); Sfx.play('door');
        if (this.id) Progress.setAreaFlag(this.area.id, 'lever:' + this.id, this.on);
        if (this.onPull) this.onPull(this);
        if (this.release) for (const e of this.area.ents) if (e.group === this.release) { e.tiedOff = false; if (e.ret) e.ret.timer = 20; }
        return true;
    }
    tick() { if (this.on && this.sig) Signals.set(this.area, this.sig); }
    sprite() { return spr(this.on ? 'lever_on' : 'lever_off'); }
}
SPAWN.lever = (x, y, p) => new Lever(x, y, p);

/* the Knot hoop: where a House's Knot gets tied */
class Hoop extends Ent {
    constructor(tx, ty, props = {}) { super('hoop', props); this.tx = tx; this.ty = ty; this.x = tx * T - 8; this.y = ty * T - 16; this.t = 0; }
    get sortY() { return this.y + 32; }
    onAdd(area) { area.staticSolid.add(this.ty * 4096 + this.tx); }
    update() { this.t++; }
    interact() { if (this.tied) return false; Script.run(Knots.tie(this)); return true; }
    talkBox(p, f) { return f.tx === this.tx && f.ty === this.ty; }
    draw(cx, cy) {
        const x = this.x - cx, y = this.y - cy;
        /* a big embroidery hoop on a stand, threads of every colour running into the floor */
        Gfx.rect(x + 14, y + 26, 4, 8, '#6b4128');
        for (let a = 0; a < 40; a++) {
            const t = a / 40 * Math.PI * 2;
            Gfx.rect(x + 16 + Math.cos(t) * 13, y + 14 + Math.sin(t) * 13, 2, 2, a % 2 ? '#c9925a' : '#9a6438');
        }
        if (!this.tied) {
            const cols = [THREAD.ives, THREAD.bram, THREAD.ambrose, THREAD.tess, THREAD.mallow, THREAD.jory];
            for (let i = 0; i < 6; i++) {
                const t = this.t / 40 + i;
                Gfx.line(x + 16 + Math.cos(t) * 8, y + 14 + Math.sin(t) * 8, x + 16, y + 34, cols[i]);
            }
            if ((this.t >> 3) % 2) Gfx.img(spr('knot'), x + 8, y + 6);
        }
    }
}
SPAWN.hoop = (x, y, p) => new Hoop(x, y, p);

/* the door out of a House */
SPAWN.exit = (x, y, p) => new Warp(x, y, Object.assign({ to: 'hollow' }, p));

const Knots = {
    tie(hoop) {
        return function* () {
            const p = G.player, a = G.map, house = a.def.house;
            const i = yield* ask(null, "The House's Knot hangs in the hoop, every colour of thread running into it and down through the floor. Tie it?", ['Tie the Knot', 'Not yet']);
            if (i !== 0) return;
            hoop.tied = true;
            G.hideHud = true;
            Music.play('silence');
            Sfx.play('knot');
            /* threads pull taut from every side toward the middle */
            for (let t = 0; t < 120; t++) { G.knotFx = t; if (t % 20 === 0) G.shake = 4; yield 1; }
            G.knotFx = 0;
            Sfx.play('knot');
            UI.fadeA = 1; UI.fade = { from: 1, to: 0, t: 0, dur: 50 };
            yield 30;
            Inv.knots.push(house);
            Progress.set(house + '_knot');
            Music.play('knot');
            G.holdUp = { id: 'knot' };
            p.state = 'hold';
            yield* say(null, `You tied the ${a.def.knotName || 'Knot'}! ` + KNOT_LINES[Inv.knots.length - 1]);
            G.holdUp = null; p.state = 'normal';
            yield* say(null, 'Far away, at the bottom of the Hollow, the Well creaks once, like a winch taking up slack.');
            G.hideHud = false;
            if (a.def.afterKnot) yield* a.def.afterKnot();
            Save.autosave();
        };
    },
    /* every thread in the House streaming into the hoop (drawn over the room) */
    draw(cx, cy) {
        const t = G.knotFx; if (!t) return;
        const p = G.player;
        const tx = p.x - cx, ty = p.y - cy - 20;
        const cols = [THREAD.ives, THREAD.bram, THREAD.ambrose, THREAD.tess, THREAD.mallow, THREAD.jory, '#ffffff'];
        for (let i = 0; i < 28; i++) {
            const a = i / 28 * Math.PI * 2 + t * 0.01, r = 220 * (1 - t / 120);
            Gfx.line(tx + Math.cos(a) * r, ty + Math.sin(a) * r, tx, ty, cols[i % cols.length]);
        }
        Gfx.alpha(Math.min(0.6, t / 160)); Gfx.rect(0, 0, W, H, '#fff6e0'); Gfx.alpha(1);
    },
};
const KNOT_LINES = [
    'One Knot of six. You feel steadier, somehow, as if the ground under you had been pinned down a little tighter.',
    'Two Knots of six.', 'Three Knots of six.', 'Four Knots of six.', 'Five Knots of six.', 'Six Knots! The Wander is nearly done.',
];

/* nudges: the Hints option. A room can say how to tell it's solved and what to nudge */
const Nudges = {
    update(a) {
        if (!Settings.hints || !a.def.house || Progress.flag('noNudges')) return;
        const r = Cam.room; if (!r || !r.nudge) return;
        const n = r.nudge;
        const key = a.id + ':' + r.key;
        if (Progress.areaFlag(a.id, 'nudged:' + r.key)) return;
        if (n.solved && Story.cond(n.solved)) return;
        const st = Stats.rooms[a.id + ':' + r.i];
        if (!st || st.t < (n.after || 60 * 60 * 3)) return;
        Progress.setAreaFlag(a.id, 'nudged:' + r.key);
        st.nudges = (st.nudges || 0) + 1;
        Stats.count('nudges');
        Stats.nudgeLog = Stats.nudgeLog || [];
        (Stats.c.nudgeRooms = Stats.c.nudgeRooms || []).push(key);
        if (n.at) { const [x, y] = n.at; Fx.sparkle((r.x + x) * T + 8, (r.y + y) * T + 4, '#fff6c0'); Fx.ring((r.x + x) * T + 8, (r.y + y) * T + 8, '#fff6c0'); }
        if (n.thing) { const o = a.ents.find(e => e.id === n.thing); if (o) { o.nudgeT = 90; Fx.sparkle(o.tx * T + 8, o.ty * T + 2, '#fff6c0'); } }
        Sfx.play('twang');
        if (n.say) UI.toast(n.say, 240);
    },
};

const TidyLogic = {
    enter(a) {
        /* the lever by the linen door: remember it */
        if (Progress.flag('tidy_shortcut')) { const l = a.find('shortcut'); if (l) l.on = true; }
    },
    tick(a) {
        /* the ballroom: both blocks home */
        if (!Progress.flag('tidy_ballDone')) {
            const ball = a.ents.filter(e => e.group === 'ball');
            if (ball.length && ball.every(b => Return.isHome(b) && !b.tiedOff)) { Progress.set('tidy_ballDone'); Sfx.play('appear'); }
        }
        const sc = a.find('shortcut');
        if (sc && sc.on && !Progress.flag('tidy_shortcut')) Progress.set('tidy_shortcut');
        /* remember doors that stay open as story flags (for nudges and the tracker) */
        for (const d of a.ents) if (d.kind === 'door' && d.id && d.open && (d.openedOnce || d.type !== 'gate')) Progress.set('tidy_' + d.id);
        for (const c of a.ents) if (c.kind === 'chest' && c.opened) Progress.set('tidy_' + c.id);
    },
};

/* the warm pie (S05) */
SPAWN.pie = (tx, ty) => {
    const pr = new Prop(tx, ty, { im: ART.pie, solid: [], oy: -6 });
    pr.live = true;
    pr.interact = () => {
        if (Progress.flag('pie')) { Script.run(function* () { yield* say(null, 'An empty pie dish. Crumbs.'); }); return true; }
        Script.run(function* () {
            yield* say(null, "A pie, still warm, steam curling off it. A note is tucked under the dish: 'For my favourite Wanderer. Don't tell.'");
            Inv.hp = Inv.maxHp; Sfx.play('heart');
            Progress.set('pie'); Stats.count('secret:pie');
            pr.im = ART.pie_empty;
            yield* say(null, 'You eat the whole pie. You feel wonderful. Who on earth bakes pies in a House nobody lives in?');
        });
        return true;
    };
    pr.talkBox = (pl, f) => (f.tx === tx || f.tx === tx - 1) && f.ty === ty;
    if (Progress.flag('pie')) pr.im = ART.pie_empty;
    return pr;
};
/* the Staff Only door behind the cupboard (S04) */
SPAWN.staffonly = (tx, ty) => {
    const pr = new Prop(tx, ty, { im: ART.staffdoor_wall, solid: [], oy: -2 });
    pr.baseY = -50;
    pr.interact = () => {
        Script.run(function* () {
            const p = G.player;
            if (!p.feetOn(tx, ty + 1)) return;
            if (Progress.flag('staffonly')) { yield* say(null, 'STAFF ONLY. Locked tight. Somebody has wedged a chair under the handle on the other side.'); return; }
            Progress.set('staffonly'); Stats.count('secret:staffonly');
            yield* say(null, 'A narrow door behind where the cupboard stood: STAFF ONLY. You try the handle. It opens...');
            G.staffPeek = 1;
            Sfx.play('door');
            yield 40;
            yield* say(null, '...onto a dim little space full of ropes and pulleys, and a woman in a teal apron with her back to you, winding a crank.');
            yield* say('???', 'Nothing to see! Shoo! Shoo!');
            G.staffPeek = 0;
            Sfx.play('doorshut'); G.shake = 8;
            yield 30;
            yield* say(null, 'The door slams. There is a scrape of a chair being wedged under the handle.');
        });
        return true;
    };
    pr.talkBox = (pl, f) => f.tx === tx && f.ty === ty;
    return pr;
};
SPAWN.book = (tx, ty, p) => {
    const pr = new Prop(tx, ty, { im: ART.book, solid: [], oy: 4 });
    pr.baseY = -50;
    pr.interact = () => { Script.run(function* () { yield* say(null, p.text); }); return true; };
    pr.talkBox = (pl, f) => f.tx === tx && f.ty === ty;

/* the Grand Housekeeper: a wardrobe that keeps the hall tidy */
class Housekeeper extends Enemy {
    constructor(tx, ty) {
        super(tx, ty, { type: 'housekeeper', hp: 3 });
        this.state = 'sleep'; this.st = 0; this.cd = 60; this.doors = 0;
        this.weightN = WEIGHT.medium + 0.5;
    }
    hurtBox() { if (!this.alive) return null; return { x0: this.x - 11, x1: this.x + 11, y0: this.y - 30, y1: this.y + 4 }; }
    onTile(x, y) { if (!this.alive) return false; return x * T < this.x + 12 && (x + 1) * T > this.x - 12 && y * T < this.y + 5 && (y + 1) * T > this.y - 10; }
    update() {
        if (!this.alive) return this.updateYarn();
        this.t++; if (this.flash > 0) this.flash--;
        const p = G.player, a = this.area;
        if (this.state === 'sleep') {
            if (p.area === a && Cam.room && Cam.room.key === '1,0' && !Cam.busy) {
                this.state = 'wake'; this.st = 0;
                for (const s of a.ents) if (s.kind === 'door' && s.group === 'boss') s.shut = true;
                Music.play('boss');
                Script.run(Tidy.bossIntro(this));
            }
            return;
        }
        if (Script.blocking()) return;
        this.st++;
        if (this.kx || this.ky) { this.move(this.kx, this.ky); this.kx *= 0.8; this.ky *= 0.8; if (Math.abs(this.kx) + Math.abs(this.ky) < 0.3) this.kx = this.ky = 0; }
        switch (this.state) {
            case 'wake': if (this.st > 30) this.setState('stalk'); break;
            case 'stalk': {
                /* tidy first: anything out of place gets fetched */
                const mess = a.ents.find(e => e.isGrid && e.ret && e.ret.state === 'away' && !e.carried && e.kind !== 'pot' && dist(e.px + 8, e.py + 8, this.x, this.y) < 200);
                const tgt = mess ? { x: mess.px + 8, y: mess.py + 10 } : { x: p.x, y: p.y };
                const dx = tgt.x - this.x, dy = tgt.y - this.y, d = Math.hypot(dx, dy) || 1;
                const sp = this.hp <= 1 ? 0.9 : 0.6;
                if (d > 4) { this.move(dx / d * sp, dy / d * sp); this.dir = dirOf(dx, dy); this.anim++; }
                if (mess && d < 20) { Return.snap(mess); Sfx.play('tug'); }
                /* line up with Wren: charge */
                if (--this.cd <= 0 && !mess) {
                    const ax = Math.abs(p.x - this.x), ay = Math.abs(p.y - this.y);
                    if (ax < 10 || ay < 10) { this.chargeDir = ax < 10 ? (p.y < this.y ? UP : DOWN) : (p.x < this.x ? LEFT : RIGHT); this.setState('windup'); }
                }
                break;
            }
            case 'windup': if (this.st > 32) { this.setState('charge'); Sfx.play('boss'); } break;
            case 'charge': {
                const sp = this.hp <= 1 ? 3.6 : 3;
                if (!this.move(DX[this.chargeDir] * sp, DY[this.chargeDir] * sp) || this.st > 90) { G.shake = 10; Sfx.play('push'); Fx.dust(this.x, this.y); this.setState('recoil'); }
                break;
            }
            case 'recoil': if (this.st > 40) { this.cd = 90; this.setState('stalk'); } break;
            case 'stunned':
                this.doors = Math.min(1, this.st / 10);
                if (this.st > 150) { this.doors = 0; this.cd = 60; this.setState('stalk'); }
                break;
        }
        if (p.state === 'normal' && this.state !== 'stunned' && Math.abs(p.x - this.x) < 14 && Math.abs(p.y - this.y) < 10) p.hurt(2, this.x, this.y);
    }
    setState(s) { this.state = s; this.st = 0; }
    /* a returning heavy thing slammed into it */
    shoved(d, pace, by) {
        if (!this.alive || this.state === 'stunned') return;
        this.kx = DX[d] * 3; this.ky = DY[d] * 3;
        G.shake = 12; G.hitstop = 6; Sfx.play('hitthing'); Sfx.play('boss');
        this.setState('stunned');
        Stats.count('boss:tidy:slam');
    }
    struck(by, dmg, dir, shard) {
        if (!this.alive) return;
        if (shard && this.state !== 'stunned') {
            /* flying shards make its doors pop open for a moment */
            this.setState('stunned'); this.st = 70; Stats.count('boss:tidy:shards'); Sfx.play('hitthing'); return;
        }
        if (this.state !== 'stunned' || this.doors < 1) { Sfx.play('hitthing'); Fx.ring(this.x, this.y - 14); return; }
        if (this.flash > 0) return;
        this.hp--; this.flash = 30; Sfx.play('enemyhit'); G.hitstop = 8; G.shake = 6;
        this.setState('recoil'); this.doors = 0;
        if (this.hp <= 0) this.defeat();
    }
    defeat() {
        this.alive = false; this.yarnT = 0; this.trace = [[this.tx, this.ty]];
        Sfx.play('unravel'); Fx.yarn(this.x, this.y - 16, THREAD.ives); Fx.yarn(this.x, this.y - 8, THREAD.ives);
        Progress.set('tidy_boss');
        Script.run(Tidy.bossDown(this));
    }
    updateYarn() { this.yarnT++; }
    draw(cx, cy) {
        if (!this.alive) {
            /* the last of it drains into a little hole in the floor */
            if (this.yarnT < 120) { const k = 1 - this.yarnT / 120; Gfx.circle(this.x - cx, this.y - cy - 4, Math.round(8 * k), THREAD.ives); Gfx.rect(this.x - cx - 1, this.y - cy, 2, 4, '#1a1018'); }
            return;
        }
        const x = this.x - cx, y = this.y - cy;
        let ox = 0;
        if (this.state === 'windup') ox = (this.st >> 1) % 2 ? 1 : -1;
        Gfx.alpha(0.3); Gfx.rect(x - 12, y + 2, 24, 3, PAL.ink); Gfx.alpha(1);
        const im = spr(this.state === 'stunned' && this.doors >= 1 ? 'keeper_open' : this.state === 'sleep' ? 'keeper_sleep' : 'keeper');
        const img = this.flash > 0 && (this.flash >> 1) % 2 ? tinted(im, '#ffffff') : im;
        Gfx.img(img, x - 16 + ox, y - 38 + (this.state === 'charge' ? Math.sin(this.st) : 0));
    }
}

/* the windmill: a stone tower with sails that turn */
class Windmill extends Ent {
    constructor(tx, ty) { super('windmill'); this.tx = tx; this.ty = ty; this.x = tx * T; this.y = ty * T - 32; this.inert = false; this.solid = [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1], [0, 2], [1, 2], [2, 2]]; this.staticBlock = true; }
    blocks(x, y) { return this.solid.some(([dx, dy]) => this.tx + dx === x && this.ty + dy === y); }
    get sortY() { return this.ty * T + 48; }
    draw(cx, cy) {
        const x = this.tx * T - cx, y = this.ty * T - cy;
        Gfx.img(ART.windmill, x, y - 40);
        /* sails */
        const hx = x + 24, hy = y - 22, a0 = G.t / 90;
        for (let i = 0; i < 4; i++) {
            const a = a0 + i * Math.PI / 2, ex = hx + Math.cos(a) * 28, ey = hy + Math.sin(a) * 28;
            Gfx.line(hx, hy, ex, ey, '#6b4128');
            const px = -Math.sin(a), py = Math.cos(a);
            for (let k = 8; k < 28; k += 2) { const sx = hx + Math.cos(a) * k, sy = hy + Math.sin(a) * k; Gfx.line(sx, sy, sx + px * 6, sy + py * 6, k % 4 ? '#f4e6c8' : '#d8c49e'); }
        }
        Gfx.circle(hx, hy, 3, '#6b4128'); Gfx.rect(hx - 1, hy - 1, 2, 2, '#c9925a');
    }
}
SPAWN.windmill = (x, y) => new Windmill(x, y);

SPAWN.linnetnote = (tx, ty, p) => {
    const pr = new Prop(tx, ty, { im: ART.note, solid: [], oy: 2 });
    pr.baseY = -60; pr.inert = false;
    pr.update = () => { if (pr.under) { const b = pr.area.find(pr.under); pr.hiddenNow = b && b.tx === tx && b.ty === ty; } };
    pr.under = p.under;
    pr.draw = function (cx, cy) { if (!this.hiddenNow && !Progress.flag('linnet' + p.note)) { Gfx.img(ART.carvedL, this.x - cx, this.y - cy - 2); Gfx.img(this.im, this.x - cx + 4, this.y - cy + 2); } };
    pr.interact = () => {
        if (pr.hiddenNow || Progress.flag('linnet' + p.note)) return false;
        Script.run(function* () {
            Progress.set('linnet' + p.note); Progress.addNote('linnet' + p.note);
            Stats.count('secret:linnet');
            yield* say(null, 'Someone has carved a little "L." into the ground here. Tucked into the grass beside it, a folded note, yellow with age.');
            yield* say(null, '"' + LINNET_NOTES[p.note].text + '"');
            const n = Object.keys(LINNET_NOTES).filter(k => Progress.flag('linnet' + k)).length;
            yield* say(null, `(Notes found: ${n}.)`);
        });
        return true;
    };
    pr.talkBox = (pl, f) => f.tx === tx && f.ty === ty;
    return pr;
};

/* the ceremony starts when Wren first steps out of the house after talking to Gran */
const Ceremony = {
    check(area) {
        if (area.id !== 'hollow' || Progress.flag('ceremony') || !Progress.flag('talkedGran')) return;
        Progress.set('ceremony');
        Script.run(Ceremony.run, { name: 'ceremony' });
    },
    *run() {
        const ox = 64, oy = 40;
        const a = G.map, p = G.player;
        /* the town gathers at the Well */
        const crowd = [['ives', 27, 21, 'up'], ['bram', 34, 21, 'up'], ['rosa', 28, 22, 'up'], ['thimble', 33, 22, 'up'], ['seam', 26, 20, 'right'], ['mallow', 35, 20, 'left'], ['mabel', 30, 22, 'up'], ['quill', 31, 22, 'up']];
        const added = [];

        let gran = a.ents.find(e => e.who === 'gran');

        G.hideHud = true;

/* What the townsfolk say. Lines move on with the Wander (flags d1..d6 and the rest). */

function cycle(id, lines) {
    const k = 'talk:' + id;
    const n = Progress.get(k) || 0; Progress.set(k, n + 1);
    return lines[n % lines.length];
}
function* firstThen(id, first, rest) {
    if (!Progress.flag('met:' + id)) { Progress.set('met:' + id); yield* say(id, first); return; }
    yield* say(id, cycle(id, rest));
}

TALK.ives = function* () {
    if (Progress.flag('d1')) { yield* say('ives', cycle('ives1', ["You did it! Was it tidy? Was the pantry— er. Did you like it? The House, I mean. In general.", "I've heard there's a pie in that House. Not that I'd know. Not that anybody bakes in there. Ha.", "Up in the attic I've set out some tidying for anyone who's quick. Trials, I call them. Go on up when you've the time."])); return; }
    yield* firstThen('ives', "Welcome to the Spool & Thimble! Wipe your— oh, it's you, {name}! Off to the Tidyhouse? You'll love it. I mean, I expect you will. It's very clean, I've heard.",
        ["A place for everything and everything in its place, that's what I always say. What everybody says, I suppose.", "Mind the second step in the linen closet. ...So I've heard. People say. About the Tidyhouse.", "If you need a lie-down, the beds upstairs are made. They're always made."]);
};
TALK.bram = function* () {
    if (Progress.flag('d1') && !Progress.flag('d2')) { yield* say('bram', cycle('bram1', ["The Kiln? Hot place, I'd guess. Very hot. Bring water. Not that I've— ha! Go on.", "Smash a pot out there and watch the bits fly home. Prettiest thing in the Hollow.", "Big boulder in the canyon road, west of Meadowfold. Pushing won't do it. You'll want a grip on it."])); return; }
    yield* firstThen('bram', "HA! The Wanderer! Here, smash one of my pots. Go on! It comes back. That's the beauty of the Hollow: nothing's ever really broken.",
        ["Pots, jugs, bowls. All come home to the shelf. Makes the trade a bit slow, I'll grant you.", "Ever notice the bits fly back the way the pot went? Not the short way. The way it WENT.", "My dad made pots. His dad made pots. Same pots, some of them."]);
};
TALK.gundry = function* () {
    yield* firstThen('gundry', "Gundry. I keep the Well. Oil the winch, sweep the step, that sort of thing.",
        ["This old winch turns by itself some nights. Wind, I expect.", "Don't go dropping things down the Well, Wanderer. They come back up, and they're not happy about it.", "Your Gran's the Warden. I just do the oiling. She does... the rest."]);
};
TALK.burr = function* () {
    yield* firstThen('burr', "Halt! Oh, it's the Wanderer. North Road's closed past the posts. Always has been. Warden's orders.",
        ["Nothing up there but fog and trees and more fog.", "Nobody's ever gone past the posts. Nobody's ever wanted to. That's how you know it's a good rule.", "I've stood at this post twenty years. Good post."]);
};
TALK.mallow = function* () {
    if (Inv.hp < Inv.maxHp) { Inv.hp = Inv.maxHp; Sfx.play('heart'); yield* say('mallow', "*yawn* Let's have a look... all better. Off you go. Doctor's orders: a nap, soon as you can."); return; }
    yield* firstThen('mallow', "Doctor Mallow. Hurt? Tired? Both? Come and see me, I'll patch you up. *yaaawn* Long night. Very long night.",
        ["Sleep is the best medicine. Also the second best.", "You look healthy. Disgustingly healthy. Come back when you're not.", "If you ever feel a sort of... tug... behind the ribs? That's normal. Perfectly normal. Everyone has it."]);
};
TALK.mabel = function* () {
    yield* firstThen('mabel', "Lost and Found. Mostly Found. Nothing's ever lost in the Hollow, they say. And yet I keep this shop.",
        ["If you ever find a thing that doesn't go home, bring it here. A stray, we call it. I collect them.", "Strays are turning up more these days. Out by the edges, mostly. Odd little things.", "Everything in its place. Except my things. My things are in MY place."]);
};
TALK.thimble = function* () {
    yield* firstThen('thimble', "Thimble & Things! Wander supplies, bandages, string, things. Mostly things.", ["Buttons spend fine here, Wanderer.", "I'd sell you a map but you don't need one: the House plans are in the Houses. Funny that.", "String's selling well this year. The Guild orders by the mile."]);
    yield* Shop.run('thimble');
};
TALK.rosa = function* () {
    yield* firstThen('rosa', "Hello love! Tuck won't stop talking about you. Eleven drawings. ELEVEN. Here, have a bun for the road.",
        ["Bread's warm, if you want some. A bun puts a bit of heart back in you.", "When Tuck's Wander comes I'll be a mess. Don't tell him.", "I bake the same loaves every morning. Same tins, same shelf. You'd think I'd get bored."]);
    if (!Progress.flag('rosaBun')) { Progress.set('rosaBun'); Inv.heal(4); Sfx.play('heart'); }
};
TALK.seam = function* () {
    yield* firstThen('seam', "Sebastian Seam, tailor. That scarf: red, of course. A Wanderer's colour. You wear it beautifully.",
        ["I'm working on something very big for a client. Very hush-hush. Very... scaly.", "Everyone's thread is a different colour, you know. Figuratively. Mostly figuratively.", "Come back when you've a few buttons and I'll make you something with presence."]);
};
TALK.ambrose = function* () { yield* say('ambrose', "Hello, my Wanderer! Busy, busy. Always busy before a Wander. I'm proud of you."); };
TALK.tess = function* () { yield* say('tess', "There's my bell-ringer's bairn! Listen to the bells when you're out: they'll tell you where you are."); };

CRITTER_TALK.biscuit = () => function* () {
    const n = (Progress.get('biscuitPets') || 0) + 1; Progress.set('biscuitPets', n);
    yield* say(null, n === 1 ? "Biscuit, the town cat. The cat goes wherever it likes. You've never once seen it go back to anywhere." : n === 2 ? "Biscuit purrs and looks at you as if it knows something you don't. Cats always look like that." : "Biscuit. Purring.");
};
CRITTER_TALK.pudding = () => function* () { yield* say(null, "Pudding chases a ball. It rolls back to Pudding every time. Pudding has never once been surprised by this."); };

/* the schoolhouse blackboard: the Rules */
Story.blackboard = function* () {
    const rules = [
        'THE RULES OF THE RETURN',
        '1. Everything has its place.',
        '2. Whatever is moved goes back the way it came.',
        '3. Nothing is ever lost in the Hollow.',
    ];
    if (Progress.flag('d1')) rules.push('4. Heavier shoves lighter.');
    if (Progress.flag('d2')) rules.push('5. Broken things come home in pieces.');
    yield* say(null, rules.join('\n'));
    if (Progress.flag('d4') && !Progress.flag('reveal1')) yield* say(null, "Under the rules, rubbed out but still faintly there: '6. You have a place too.'");
};
Story.cellarDoor = function* () {
    if (Progress.flag('reveal2')) { yield* say(null, "The cellar door. Locked from the inside now."); return; }
    yield* say(null, "The cellar door. Locked. Gran keeps the key on a string round her neck. If you put your ear to it, you can hear something turning, very slowly, far below.");
    Progress.set('heardCellar');
};
Story.sleepInBed = function* () {
    const i = yield* ask(null, 'Your bed. Rest a while?', ['Sleep (heal and save)', 'Not now']);
    if (i !== 0) return;
    const p = G.player;
    yield* fadeOut(30);
    Inv.hp = Inv.maxHp;
    p.setMark();
    Save.write();
    yield 30;
    yield* fadeIn(30);
    Sfx.play('save');
    yield* say(null, 'You feel rested. (Saved.)');
};

/* shops: a few things for buttons */
const SHOPS = {
    thimble: [
        { id: 'bandage', name: 'Bandage (heals 2 hearts)', price: 8, buy: () => { Inv.heal(4); Sfx.play('heart'); } },
        { id: 'shop_patch', name: 'Heart Patch', price: 120, once: true, buy: () => Script.run(Story.getItem('heartpatch', 'shop_patch')) },
        { id: 'string', name: 'A ball of string', price: 3, buy: () => { Inv.items.string = (Inv.items.string || 0) + 1; } },
    ],
};
ITEMS.string = { name: 'Ball of string', kind: 'quest', desc: "Thimble's best. It doesn't do anything. It's string." };
const Shop = {
    *run(id) {
        const list = SHOPS[id].filter(it => !(it.once && Progress.flag('bought:' + it.id)));
        const choices = list.map(it => `${it.name} - ${it.price}`).concat(['Nothing, thanks']);
        const i = yield* ask(id, 'Anything you fancy?', choices);
        if (i < 0 || i >= list.length) return;
        const it = list[i];
        if (Inv.buttons < it.price) { yield* say(id, "Not enough buttons, I'm afraid. Come back with a few more."); return; }
        Inv.buttons -= it.price; Progress.set('bought:' + it.id); Sfx.play('button');
        it.buy();
        yield* say(id, 'Thank you kindly!');
    },
};
SPAWN.staffdoor = (tx, ty) => {
    const pr = new Prop(tx, ty, { im: ART.staffdoor, solid: [[0, 0]], oy: -16 });
    pr.interact = () => { Script.run(function* () { yield* say(null, Progress.flag('reveal1') ? 'STAFF ONLY. The door is open for you now.' : 'A narrow door: STAFF ONLY. Locked. Something hums on the other side.'); }); return true; };
    pr.talkBox = (pl, f) => f.tx === tx && f.ty === ty;
    return pr;
};
SPAWN.shop = () => new Ent('none');

// ---- 80_story_core.js ----
/* Starting a Wander, place names, and the content hook. The prologue and everyone's lines live in the
   content files; this is what ties them together. */

Story.begin = function (opts = {}) {
    if (opts.area) { World.enter(opts.area, opts.x, opts.y); return; }
    if (typeof Prologue !== 'undefined' && !opts.skipIntro) { Prologue.start(); return; }
    World.enter(START.area, START.x, START.y, { dir: DOWN });
};
Story.placeName = function (id) {
    if (!id || !AREAS[id]) return '';
    return AREAS[id].place || AREAS[id].name || '';
};

function initContent() {
    for (const f of CONTENT_INIT) f();
}

// ---- 90_main.js ----
/* The game: scenes (title, naming, play), the step (60 a second, fixed) and the picture. */

const Game = {
    newGame(name, opts = {}) {
        G.wanderer = name;
        G.seed = opts.seed || 20261109;
        G.rng = mulberry(G.seed);
        Inv.reset(); Progress.reset(); Stats.reset();
        G.player = null;
        Script.clear(); Dialog.active = false; UI.menu = null;
        G.scene = 'play';
        Story.begin(opts);
    },
    load(s) {
        Script.clear(); Dialog.active = false; UI.menu = null;
        G.scene = 'play';
        Save.apply(s);
        UI.fadeA = 1; UI.fade = { from: 1, to: 0, t: 0, dur: 30 };
        if (Story.afterLoad) Story.afterLoad();
    },
    step() {
        G.t++;
        TileDraw.frame = G.t;
        Input.update();
        try {
            if (G.debug && Debug.open) { Debug.update(); return; }
            if (G.scene === 'title') { Title.update(); Music.tick(); return; }
            if (G.scene === 'name') { NameEntry.update(); return; }
            if (G.scene !== 'play') return;
            UI.update();
            if (UI.menu) { UI.menu.update(); Music.tick(); return; }
            Dialog.update();
            const p = G.player;
            if (!Script.blocking() && !Dialog.active && !Cam.busy && p && p.state === 'normal') {
                if (Input.pressed('menu')) { PauseMenu.open(); return; }
                if (Input.pressed('map')) { PauseMenu.open(); PauseMenu.tab = 1; return; }
                if (Input.pressed('prev')) Inv.cycleTool(-1);
                if (Input.pressed('next')) Inv.cycleTool(1);
            }
            Script.update();
            if (G.pendingToast) { UI.toast(G.pendingToast, 180); G.pendingToast = null; }
            Stats.tick();
            Music.tick();
            if (G.hitstop > 0) { G.hitstop--; return; }
            const a = G.map;
            if (!a) return;
            if (Cam.busy) { Cam.update(p); return; }
            Signals.begin(a);
            for (const e of a.ents.slice()) if (!e.floor && !e.removed && !e.inert) e.update();
            if (p) p.update();
            for (const e of a.ents.slice()) if (e.floor && !e.removed) e.update();
            Thrown.update(a); Shards.update(a); Tools.update(a);
            Fx.update();
            if (a.def.tick) a.def.tick(a);
            if (Story.tick) Story.tick(a);
            Nudges.update(a);
            Cam.update(p);
            World.checkRegion();
            if (G.shake > 0) G.shake--;
        } catch (e) { reportError(e); }
    },
    render() {
        try {
            const c = Gfx.ctx;
            Gfx.rect(0, 0, W, H, PAL.night);
            if (G.scene === 'title') { Title.draw(); Debug.draw(); return; }
            if (G.scene === 'name') { NameEntry.draw(); return; }
            const a = G.map, p = G.player;
            if (!a || !p) return;
            let cx = Cam.x, cy = Cam.y;
            if (G.shake > 0 && Settings.shake) { cx += Math.round((Math.random() - 0.5) * 3); cy += Math.round((Math.random() - 0.5) * 3); }
            /* ground */
            const x0 = Math.floor(cx / T), y0 = Math.floor(cy / T);
            for (let ty = y0; ty <= y0 + Math.ceil(H / T); ty++) for (let tx = x0; tx <= x0 + Math.ceil(W / T); tx++) {
                TileDraw.draw(a, tx, ty, tx * T - cx, ty * T - cy);
            }
            if (G.cheats.grid) for (let tx = x0; tx <= x0 + 21; tx++) { Gfx.alpha(0.15); Gfx.rect(tx * T - cx, 0, 1, H, PAL.white); for (let ty = y0; ty <= y0 + 12; ty++) Gfx.rect(0, ty * T - cy, W, 1, PAL.white); Gfx.alpha(1); }
            if (a.def.drawGround) a.def.drawGround(a, cx, cy);
            /* things lying on the floor, then threads, then everything standing, sorted by depth */
            const floor = a.ents.filter(e => e.floor && e.x > cx - 40 && e.x < cx + W + 40 && e.y > cy - 40 && e.y < cy + H + 40);
            for (const e of floor) e.draw(cx, cy);
            Threads.draw(a, cx, cy);
            const stand = a.ents.filter(e => !e.floor && e.x > cx - 80 && e.x < cx + W + 40 && e.y > cy - 80 && e.y < cy + H + 80);
            stand.push(p);
            stand.sort((m, n) => m.sortY - n.sortY);
            for (const e of stand) e.draw(cx, cy);
            if (p.state === 'flight' && p.flight) {
                /* Wren's own thread, red, during the flight home */
                const f = p.flight, pts = f.pts;
                const i0 = f.seg || 1;
                Gfx.line(p.x - cx, p.y - cy - 6, pts[i0][0] - cx, pts[i0][1] - cy, THREAD.wren);
                for (let i = i0; i + 1 < pts.length; i++) Gfx.line(pts[i][0] - cx, pts[i][1] - cy, pts[i + 1][0] - cx, pts[i + 1][1] - cy, THREAD.wren);
                const m = p.mark; Marks.draw(m.tx * T - cx, m.ty * T - cy, THREAD.wren, true);
            }
            Thrown.draw(cx, cy); Shards.draw(cx, cy); Tools.draw(cx, cy);
            if (a.def.drawOver) a.def.drawOver(a, cx, cy);
            Fx.draw(cx, cy);
            Knots.draw(cx, cy);
            if (G.holdUp) {
                const im = spr(ITEM_ICON[G.holdUp.id] || ('icon_' + G.holdUp.id)) || spr(G.holdUp.id);
                if (im) Gfx.img(im, p.x - cx - im.width / 2, p.y - cy - 30);
            }
            if (a.def.dark) Lighting.draw(a, cx, cy);
            UI.drawHUD();
            UI.draw();
            Debug.draw();
        } catch (e) { reportError(e); }
    },
};
const ITEM_ICON = { heartpatch: 'heartpatch', key: 'key', knot: 'knot', heartstitch: 'heart', pattern: 'hud_pattern' };
const Lighting = { draw() { } };

function boot() {
    Gfx.init();
    Input.init();
    Settings.load();
    initWrenSprites(); initThingSprites(); initUISprites(); initToolIcons(); initEnemySprites();
    if (typeof initContent === 'function') initContent();
    if (!HEADLESS) {
        G.debug = /[?&]debug/.test(location.search);
        if (location.search.includes('notitle') && G.debug) { Game.newGame('Wren', { skipIntro: true }); }
        else Title.open();
        let last = performance.now(), acc = 0;
        const loop = now => {
            acc += Math.min(100, now - last); last = now;
            let n = 0;
            while (acc >= 1000 / FPS && n < 4) { if (!HW._paused) Game.step(); acc -= 1000 / FPS; n++; }
            Game.render();
            requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
        setTimeout(() => { const h = document.getElementById('hint'); if (h) h.style.opacity = '0'; }, 9000);
        addEventListener('beforeunload', () => { if (G.scene === 'play') Save.autosave(); });
    } else {
        G.scene = 'title';
    }
}
boot();
