// ---- 00_core.js ----
'use strict';
/* Hollowell. One script, joined from src/*.js in file-name order. Everything is global: a top-level
   const in one file is used by others. The simulation never touches the page, so the same code runs
   headless in the tests (HEADLESS: no document). */

const HEADLESS = typeof document === 'undefined';
const VERSION = '0.1.0';
const W = 320, H = 180, T = 16;          /* the screen in pixels, the tile size */
const FPS = 60;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v > 0 ? 1 : v < 0 ? -1 : 0;
const approach = (v, to, d) => v < to ? Math.min(v + d, to) : Math.max(v - d, to);
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const tileOf = px => Math.floor(px / T);
const key2 = (x, y) => x + ',' + y;

/* directions: 0 down, 1 left, 2 right, 3 up (the order sprite sheets use) */
const DOWN = 0, LEFT = 1, RIGHT = 2, UP = 3;
const DX = [0, -1, 1, 0], DY = [1, 0, 0, -1];
const DIR_NAME = ['down', 'left', 'right', 'up'];
const OPP = [UP, RIGHT, LEFT, DOWN];
function dirOf(dx, dy) {
    if (Math.abs(dx) >= Math.abs(dy)) return dx < 0 ? LEFT : dx > 0 ? RIGHT : (dy < 0 ? UP : DOWN);
    return dy < 0 ? UP : DOWN;
}
function dirByName(n) { const i = DIR_NAME.indexOf(n); return i < 0 ? DOWN : i; }

/* a small seeded random: the game's own (G.rng) is reseeded per new game so scripted play replays exactly */
function mulberry(seed) {
    let a = seed >>> 0;
    return function () {
        a = (a + 0x6D2B79F5) >>> 0;
        let t = a;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
/* a stable hash for decoration: the same tile always gets the same flower */
function hash2(x, y, s = 0) {
    let h = (x * 374761393 + y * 668265263 + s * 2246822519) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

/* G holds the running game: the map, the player, the scene, the frame count */
const G = {
    t: 0,                /* frames since the page started */
    rng: mulberry(1),
    map: null,           /* the current Area */
    player: null,
    scene: null,         /* 'title' | 'play' ... (see 90_main.js) */
    paused: false,
    shake: 0,
    hitstop: 0,
    debug: false,
};

const LOG = [];
function log(...a) { LOG.push(a.join(' ')); if (LOG.length > 200) LOG.shift(); if (G.debug && !HEADLESS) console.log(...a); }

/* every thrown error in a frame is kept so the browser tests can fail on it */
const ERRORS = [];
function reportError(e) {
    ERRORS.push(String(e && e.stack || e));
    if (!HEADLESS) console.error(e);
}

/* content files push their set-up functions here; boot runs them once the art helpers exist */
const CONTENT_INIT = [];

// ---- 01_input.js ----
/* Input: the keyboard, a gamepad, and a virtual pad the tests and the autopilot press.
   Buttons: up down left right act atk tool prev next menu map. Input.down(b) while held,
   Input.pressed(b) on the step it went down, Input.released(b) on the step it came up. */

const BUTTONS = ['up', 'down', 'left', 'right', 'act', 'atk', 'tool', 'prev', 'next', 'menu', 'map'];
const KEYMAP_DEFAULT = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    KeyW: 'up', KeyS: 'down', KeyA: 'left', KeyD: 'right',
    KeyZ: 'act', KeyJ: 'act', Space: 'act',
    KeyX: 'atk', KeyK: 'atk',
    KeyC: 'tool', KeyL: 'tool',
    KeyQ: 'prev', KeyE: 'next',
    Enter: 'menu', Escape: 'menu',
    Tab: 'map', KeyM: 'map',
};

const Input = {
    keys: {},            /* physical keys held (by button) */
    pad: {},             /* gamepad buttons held */
    virt: {},            /* virtual buttons held (tests, autopilot) */
    cur: {}, prev: {},
    keymap: Object.assign({}, KEYMAP_DEFAULT),
    lastKind: 'key',
    anyPressed: false,
    textHandler: null,   /* name entry takes raw characters */

    init() {
        if (HEADLESS) return;
        addEventListener('keydown', e => {
            if (e.code === 'F11') return;
            if (this.textHandler && this.textHandler(e)) { e.preventDefault(); return; }
            const b = this.keymap[e.code];
            if (b) { this.keys[b] = (this.keys[b] || 0) + (this.keys['_' + e.code] ? 0 : 1); this.keys['_' + e.code] = 1; e.preventDefault(); }
            if (e.code === 'F1' && G.debug) { Debug.toggle(); e.preventDefault(); }
            this.lastKind = 'key';
            Audio.unlock();
        });
        addEventListener('keyup', e => {
            const b = this.keymap[e.code];
            if (b && this.keys['_' + e.code]) { this.keys[b] = Math.max(0, (this.keys[b] || 1) - 1); this.keys['_' + e.code] = 0; e.preventDefault(); }
        });
        addEventListener('blur', () => { this.keys = {}; });
        addEventListener('mousedown', () => Audio.unlock());
    },

    pollPad() {
        this.pad = {};
        if (HEADLESS || !navigator.getGamepads) return;
        const pads = navigator.getGamepads();
        for (const p of pads) {
            if (!p) continue;
            const bt = i => p.buttons[i] && p.buttons[i].pressed;
            const ax = p.axes || [];
            const set = (b, v) => { if (v) { this.pad[b] = 1; this.lastKind = 'pad'; } };
            set('up', bt(12) || ax[1] < -0.5); set('down', bt(13) || ax[1] > 0.5);
            set('left', bt(14) || ax[0] < -0.5); set('right', bt(15) || ax[0] > 0.5);
            set('act', bt(0)); set('atk', bt(2)); set('tool', bt(1) || bt(3));
            set('prev', bt(4)); set('next', bt(5)); set('menu', bt(9)); set('map', bt(8));
        }
    },

    /* once per step, before the game reads anything */
    update() {
        this.pollPad();
        this.prev = this.cur;
        this.cur = {};
        this.anyPressed = false;
        for (const b of BUTTONS) {
            this.cur[b] = !!(this.keys[b] || this.pad[b] || this.virt[b]);
            if (this.cur[b] && !this.prev[b]) this.anyPressed = true;
        }
    },
    down(b) { return !!this.cur[b]; },
    pressed(b) { return !!this.cur[b] && !this.prev[b]; },
    released(b) { return !this.cur[b] && !!this.prev[b]; },
    /* the d-pad as a vector (8 ways) */
    axis() {
        return { x: (this.cur.right ? 1 : 0) - (this.cur.left ? 1 : 0), y: (this.cur.down ? 1 : 0) - (this.cur.up ? 1 : 0) };
    },
    clearVirtual() { this.virt = {}; },
    /* forget what's held so a menu closing doesn't fire the button again */
    swallow() { for (const b of BUTTONS) this.prev[b] = this.cur[b]; },
};

// ---- 02_gfx.js ----
/* The screen: one 320x180 canvas scaled up by whole numbers with crisp pixels. Off-screen canvases for
   sprites and tiles. Headless, every canvas is a stub that draws nothing. */

const NULL_CTX = new Proxy({}, {
    get(t, k) {
        if (k === 'canvas') return t.canvas;
        if (k === 'getImageData') return (x, y, w, h) => ({ data: new Uint8ClampedArray(w * h * 4), width: w, height: h });
        if (k === 'createImageData') return (w, h) => ({ data: new Uint8ClampedArray(w * h * 4), width: w, height: h });
        if (k === 'measureText') return () => ({ width: 0 });
        if (k in t) return t[k];
        return () => {};
    },
    set(t, k, v) { t[k] = v; return true; },
});
function nullCanvas(w, h) { return { width: w, height: h, getContext: () => NULL_CTX, isNull: true }; }

const Gfx = {
    canvas: null, ctx: null, scale: 1,

    init() {
        if (HEADLESS) { this.canvas = nullCanvas(W, H); this.ctx = NULL_CTX; return; }
        this.canvas = document.getElementById('game');
        this.canvas.width = W; this.canvas.height = H;
        this.ctx = this.canvas.getContext('2d');
        this.ctx.imageSmoothingEnabled = false;
        const fit = () => {
            const s = Math.max(1, Math.floor(Math.min(innerWidth / W, innerHeight / H)));
            const fs = Math.min(innerWidth / W, innerHeight / H);
            /* whole-number scale when it fills most of the window, else fill it */
            this.scale = (s / fs > 0.86) ? s : fs;
            this.canvas.style.width = Math.floor(W * this.scale) + 'px';
            this.canvas.style.height = Math.floor(H * this.scale) + 'px';
        };
        addEventListener('resize', fit); fit();
        this.canvas.focus();
    },

    makeCanvas(w, h) {
        if (HEADLESS) return nullCanvas(w, h);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
        return c;
    },

    rect(x, y, w, h, col) { const c = this.ctx; c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), w, h); },
    frame(x, y, w, h, col) {
        this.rect(x, y, w, 1, col); this.rect(x, y + h - 1, w, 1, col);
        this.rect(x, y, 1, h, col); this.rect(x + w - 1, y, 1, h, col);
    },
    /* draw a canvas (sprite) at a pixel spot, optionally mirrored */
    img(im, x, y, flip = false, alpha = 1) {
        if (!im) return;
        const c = this.ctx;
        if (alpha !== 1) c.globalAlpha = alpha;
        if (flip) {
            c.save(); c.translate(Math.round(x) + im.width, Math.round(y)); c.scale(-1, 1);
            c.drawImage(im, 0, 0); c.restore();
        } else c.drawImage(im, Math.round(x), Math.round(y));
        if (alpha !== 1) c.globalAlpha = 1;
    },
    /* part of a canvas */
    sub(im, sx, sy, sw, sh, x, y) { if (im) this.ctx.drawImage(im, sx, sy, sw, sh, Math.round(x), Math.round(y), sw, sh); },
    line(x0, y0, x1, y1, col) {
        /* pixel line (Bresenham), for threads */
        x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
        const c = this.ctx; c.fillStyle = col;
        let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, e = dx + dy;
        for (let n = 0; n < 2000; n++) {
            c.fillRect(x0, y0, 1, 1);
            if (x0 === x1 && y0 === y1) break;
            const e2 = 2 * e;
            if (e2 >= dy) { e += dy; x0 += sx; }
            if (e2 <= dx) { e += dx; y0 += sy; }
        }
    },
    circle(cx, cy, r, col) {
        const c = this.ctx; c.fillStyle = col;
        for (let y = -r; y <= r; y++) {
            const w = Math.floor(Math.sqrt(r * r - y * y));
            c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
        }
    },
    alpha(a) { this.ctx.globalAlpha = a; },
};

function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgbHex(r, g, b) { return '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1); }
function shade(h, f) { const [r, g, b] = hexRGB(h); return f >= 0 ? rgbHex(r + (255 - r) * f, g + (255 - g) * f, b + (255 - b) * f) : rgbHex(r * (1 + f), g * (1 + f), b * (1 + f)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return rgbHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }

const TEXT_COLORS = {
    '': PAL.ink, ink: PAL.ink, white: PAL.white, cream: PAL.cream, red: PAL.red2, blue: PAL.blue3, green: PAL.green3,
    gold: PAL.gold2, purple: PAL.purple2, grey: PAL.grey3, teal: PAL.teal3, yellow: PAL.yellow, pink: PAL.pink2,
};

const Font = {
    cache: {},
    glyph(ch, col) {
        const k = col + ch;
        let c = this.cache[k];
        if (c) return c;
        const g = FONT[ch] || FONT['?'];
        c = Gfx.makeCanvas(g.w || 1, 8);
        const x = c.getContext('2d');
        x.fillStyle = col;
        g.rows.forEach((r, y) => { for (let i = 0; i < r.length; i++) if (r[i] === '#') x.fillRect(i, y, 1, 1); });
        this.cache[k] = c;
        return c;
    },
    charW(ch) { const g = FONT[ch] || FONT['?']; return g.w + 1; },
    /* width of plain text (markup stripped) */
    width(s) { let w = 0; s = stripMarkup(s); for (const ch of s) w += this.charW(ch); return Math.max(0, w - 1); },
    /* draw text with {colour} markup; returns the x it ended at. limit: draw only the first n visible chars */
    draw(s, x, y, col = PAL.ink, limit = Infinity, shadow = null) {
        let cx = x, cur = col, n = 0;
        for (let i = 0; i < s.length; i++) {
            if (s[i] === '{') {
                const j = s.indexOf('}', i);
                if (j > i) { const name = s.slice(i + 1, j); cur = name === '/' ? col : (TEXT_COLORS[name] || PAL[name] || col); i = j; continue; }
            }
            if (n >= limit) break;
            const ch = s[i];
            if (ch !== ' ') {
                if (shadow) Gfx.img(this.glyph(ch, shadow), cx + 1, y + 1);
                Gfx.img(this.glyph(ch, cur), cx, y);
            }
            cx += this.charW(ch); n++;
        }
        return cx;
    },
    center(s, cx, y, col, shadow) { this.draw(s, Math.round(cx - this.width(s) / 2), y, col, Infinity, shadow); },
    /* break text into lines of at most maxW pixels (keeps markup) */
    wrap(s, maxW) {
        const out = [];
        for (const para of s.split('\n')) {
            let line = '', lw = 0;
            for (const word of para.split(' ')) {
                const ww = this.width(word), sp = line ? this.charW(' ') : 0;
                if (line && lw + sp + ww > maxW) { out.push(line); line = word; lw = ww; }
                else { line = line ? line + ' ' + word : word; lw += sp + ww; }
            }
            out.push(line);
        }
        return out;
    },
};
function stripMarkup(s) { return s.replace(/\{[^}]*\}/g, ''); }

// ---- 04_sprites.js ----
/* Sprites: pixel grids in the source, compiled once to canvases. A grid is rows of characters; a legend
   maps each character to a colour ('.' is clear). Helpers make walk frames, mirror, recolour, outline. */

const SPR = {};                    /* name -> canvas */
const SPR_SRC = {};                /* name -> { rows, legend } kept for recolouring */

/* the common legend: per sprite a legend can add or override characters */
const LEGEND = {
    k: PAL.ink, K: PAL.ink2, w: PAL.white, W: PAL.cream, g: PAL.grey1, G: PAL.grey2, x: PAL.grey3, X: PAL.grey4,
    s: PAL.skin, S: PAL.skin2, e: PAL.ink, c: PAL.rose,
    r: PAL.red, R: PAL.red2, o: PAL.orange, O: PAL.orange2, y: PAL.yellow, Y: PAL.gold,
    v: PAL.green, V: PAL.green2, n: PAL.green3, N: PAL.green4,
    b: PAL.brown2, B: PAL.brown3, u: PAL.brown, U: PAL.brown4,
    a: PAL.blue, A: PAL.blue2, z: PAL.blue3, Z: PAL.blue4,
    q: PAL.teal, Q: PAL.teal2, m: PAL.purple, M: PAL.purple2, i: PAL.pink, I: PAL.pink2,
};

function compileGrid(rows, legend) {
    const h = rows.length, w = Math.max(...rows.map(r => r.length));
    const c = Gfx.makeCanvas(w, h);
    const x = c.getContext('2d');
    for (let y = 0; y < h; y++) {
        const r = rows[y];
        for (let i = 0; i < r.length; i++) {
            const ch = r[i];
            if (ch === '.' || ch === ' ') continue;
            const col = legend[ch] || LEGEND[ch];
            if (!col) continue;
            x.fillStyle = col; x.fillRect(i, y, 1, 1);
        }
    }
    return c;
}

function defSprite(name, rows, legend = {}) {
    if (typeof rows === 'string') rows = rows.trim().split('\n').map(s => s.trim());
    SPR_SRC[name] = { rows, legend };
    SPR[name] = compileGrid(rows, Object.assign({}, LEGEND, legend));
    return SPR[name];
}
function spr(name) { return SPR[name]; }

/* walking: lift one leg (the columns given) by a pixel */
function liftLeg(rows, cols, from) {
    const out = rows.map(r => r.split(''));
    const h = rows.length;
    for (const c of cols) {
        for (let y = from; y < h; y++) out[y][c] = (y + 1 < h) ? rows[y + 1][c] : '.';
    }
    return out.map(r => r.join(''));
}
/* the same grid with some characters swapped (a palette swap at the source) */
function swapChars(rows, map) { return rows.map(r => r.replace(/./g, ch => map[ch] !== undefined ? map[ch] : ch)); }
function shiftRows(rows, dy) {
    const w = rows[0].length, blank = '.'.repeat(w);
    if (dy > 0) return Array(dy).fill(blank).concat(rows.slice(0, rows.length - dy));
    return rows.slice(-dy).concat(Array(-dy).fill(blank));
}

/* a canvas tinted to one colour (for hit flashes and silhouettes) */
const _tintCache = new Map();
function tinted(im, col) {
    if (!im || HEADLESS) return im;
    let m = _tintCache.get(im);
    if (!m) { m = {}; _tintCache.set(im, m); }
    if (m[col]) return m[col];
    const c = Gfx.makeCanvas(im.width, im.height), x = c.getContext('2d');
    x.drawImage(im, 0, 0);
    x.globalCompositeOperation = 'source-in';
    x.fillStyle = col; x.fillRect(0, 0, c.width, c.height);
    m[col] = c;
    return c;
}

/* draw a list of filled pixels then outline it automatically (for generated sprites) */
function outlineCanvas(c, col = PAL.ink) {
    if (HEADLESS) return c;
    const x = c.getContext('2d');
    const d = x.getImageData(0, 0, c.width, c.height), p = d.data, w = c.width, h = c.height;
    const solid = (i, j) => i >= 0 && j >= 0 && i < w && j < h && p[(j * w + i) * 4 + 3] > 0;
    const add = [];
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
        if (solid(i, j)) continue;
        if (solid(i - 1, j) || solid(i + 1, j) || solid(i, j - 1) || solid(i, j + 1)) add.push([i, j]);
    }
    x.fillStyle = col;
    for (const [i, j] of add) x.fillRect(i, j, 1, 1);
    return c;
}

/* arms up (lifting, carrying, holding a found thing up) */
function armsUp(rows, front) {
    const r = rows.slice();
    const set = (y, x, ch) => { r[y] = r[y].slice(0, x) + ch + r[y].slice(x + 1); };
    /* hands beside the head, arms along it */
    set(2, 1, 'k'); set(3, 1, 'k'); set(2, 2, 's'); set(3, 2, 'k');
    set(2, 14, 'k'); set(3, 14, 'k'); set(2, 13, 's'); set(3, 13, 'k');
    for (let y = 4; y <= 11; y++) { set(y, 2, 'k'); set(y, 13, 'k'); }
    for (let y = 4; y <= 10; y++) { set(y, 2, y < 9 ? 'k' : 'k'); }
    if (front) { set(12, 2, '.'); set(12, 3, 'k'); set(12, 12, 'k'); set(12, 13, '.'); }
    return r;
}

function buildPerson(prefix, down, right, up, legend, legCols = { down: [[5, 6], [9, 10]], right: [[5, 6], [8, 9]], up: [[5, 6], [9, 10]] }) {
    const L = legend;
    const make = (dir, rows, cols) => {
        defSprite(`${prefix}_${dir}_0`, rows, L);
        defSprite(`${prefix}_${dir}_1`, liftLeg(rows, cols[0], rows.length - 3), L);
        defSprite(`${prefix}_${dir}_2`, liftLeg(rows, cols[1], rows.length - 3), L);
    };
    make('down', down, legCols.down);
    make('right', right, legCols.right);
    make('up', up, legCols.up);
}

function initWrenSprites() {
    buildPerson('wren', WREN_DOWN, WREN_RIGHT, WREN_UP, WREN_LEGEND);
    defSprite('wren_lift_down', armsUp(WREN_DOWN, true), WREN_LEGEND);
    defSprite('wren_lift_up', armsUp(WREN_UP, true), WREN_LEGEND);
    defSprite('wren_lift_right', armsUp(WREN_RIGHT, false), WREN_LEGEND);
    /* asleep: lying down, eyes shut */
    defSprite('wren_sleep', swapChars(WREN_DOWN, { e: 'S', c: 's' }), WREN_LEGEND);
}

function personFrame(prefix, dir, frame) {

}

/* the painted tile canvases: key -> canvas; painted on first use */
const TILE_CACHE = {};

function tileCanvas(key, paint) {
    let c = TILE_CACHE[key];
    if (!c) { c = Gfx.makeCanvas(T, T); if (!HEADLESS) paint(c.getContext('2d'), c); TILE_CACHE[key] = c; }
    return c;
}

/* tiny pixel helpers for painters */
function px(x, X, Y, col) { x.fillStyle = col; x.fillRect(X, Y, 1, 1); }
function fill(x, col, X = 0, Y = 0, w = T, h = T) { x.fillStyle = col; x.fillRect(X, Y, w, h); }
function speckle(x, cols, seed, density, X = 0, Y = 0, w = T, h = T) {
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
        const r = hash2(X + i, Y + j, seed);
        if (r < density) px(x, X + i, Y + j, cols[Math.floor(hash2(i, j, seed + 7) * cols.length)]);
    }
}

/* ---------- painters ---------- */
const Paint = {
    grass(x, th, v) {
        const [g0, g1, g2, g3] = th.grass;
        fill(x, g0);
        speckle(x, [g1], 11 + v * 13, 0.10);
        speckle(x, [g2], 23 + v * 7, 0.035);
        /* a few blades */
        for (let n = 0; n < 3; n++) {
            const bx = Math.floor(hash2(v, n, 3) * 14) + 1, by = Math.floor(hash2(n, v, 5) * 13) + 2;
            px(x, bx, by, g3); px(x, bx, by - 1, g1); px(x, bx + 1, by - 1, g3);
        }
    },
    flowers(x, th, v) {
        Paint.grass(x, th, v);
        const cols = [['#fbf6ea', '#f7d64a'], ['#f59ac0', '#fbf6ea'], ['#f7d64a', '#e8463c'], ['#b48ce8', '#fbf6ea']];
        for (let n = 0; n < 2; n++) {
            const [petal, mid] = cols[Math.floor(hash2(v, n, 9) * cols.length)];
            const fx = 3 + Math.floor(hash2(n, v, 1) * 9), fy = 3 + Math.floor(hash2(v + 3, n, 2) * 9);
            px(x, fx, fy - 1, petal); px(x, fx - 1, fy, petal); px(x, fx + 1, fy, petal); px(x, fx, fy + 1, petal);
            px(x, fx, fy, mid); px(x, fx, fy + 2, th.grass[3]);
        }
    },
    tallgrass(x, th, v) {
        const [g0, g1, g2, g3] = th.grass;
        fill(x, g0);
        for (let i = 0; i < 6; i++) {
            const bx = 1 + i * 2 + (i % 2), h = 6 + Math.floor(hash2(i, v, 4) * 5);
            for (let j = 0; j < h; j++) px(x, bx + (j > h - 3 ? 1 : 0), 15 - j, j > h - 3 ? g2 : g1);
            px(x, bx, 15, g3);
        }
    },
    path(x, th, v) {
        const [p0, p1, p2] = th.path;
        fill(x, p0);
        speckle(x, [p1], 31 + v, 0.14);
        speckle(x, [p2], 41 + v, 0.06);
        for (let n = 0; n < 2; n++) {
            const sx = Math.floor(hash2(v, n, 12) * 13) + 1, sy = Math.floor(hash2(n, v, 13) * 13) + 1;
            px(x, sx, sy, p1); px(x, sx + 1, sy, p1); px(x, sx, sy + 1, p2);
        }
    },
    cobble(x, th, v) {
        const [s0, s1, s2, s3] = th.stone;
        fill(x, s1);
        /* stones in a loose grid */
        const rows = [[0, 5], [5, 5], [10, 6]];
        rows.forEach(([y0, hh], ri) => {
            let xx = (ri % 2) * -3;
            while (xx < 16) {
                const ww = 5 + Math.floor(hash2(xx + 20, ri + v * 3, 8) * 3);
                const tone = hash2(xx, ri, v + 5) < 0.5 ? s0 : mix(s0, s2, 0.4);
                fill(x, tone, Math.max(0, xx + 1), y0 + 1, Math.min(ww - 1, 16 - Math.max(0, xx + 1)), hh - 1);
                px(x, Math.max(0, xx + 1), y0 + 1, s2);
                if (xx + ww - 1 < 16) fill(x, s3, Math.max(0, xx + 1), y0 + hh - 1, Math.min(ww - 1, 16 - Math.max(0, xx + 1)), 1);
                xx += ww;
            }
        });
    },
    sand(x, th, v) {
        const [p0, p1, p2] = th.path;
        fill(x, p2); speckle(x, [p0], 51 + v, 0.18); speckle(x, [p1], 61 + v, 0.05);
    },
    water(x, th, v, f) {
        const [w0, w1, w2, w3] = th.water;
        fill(x, w0);
        speckle(x, [w1], 71 + v, 0.12);
        /* moving glints */
        for (let n = 0; n < 2; n++) {
            const gx = (Math.floor(hash2(v, n, 17) * 16) + f * 2) % 16, gy = Math.floor(hash2(n, v, 19) * 14) + 1;
            px(x, gx, gy, w2); px(x, (gx + 1) % 16, gy, w2); px(x, (gx + 2) % 16, gy, w2);
            px(x, (gx + 1) % 16, gy + 1, w1);
        }
    },
    deep(x, th, v, f) {
        Paint.water(x, th, v, f);
        x.globalAlpha = 0.25; fill(x, th.water[3]); x.globalAlpha = 1;
    },
    pit(x, th) {
        fill(x, '#120c14');
        speckle(x, ['#21162a'], 81, 0.08);
    },
    bricks(x, cols, v) {
        const [b0, b1, b2, b3] = cols;
        fill(x, b1);
        for (let row = 0; row < 4; row++) {
            const y0 = row * 4, off = (row % 2) * 4;
            for (let bx = -off; bx < 16; bx += 8) {
                const tone = hash2(bx + 30, row + v * 5, 2) < 0.5 ? b0 : mix(b0, b2, 0.3);
                fill(x, tone, Math.max(0, bx), y0, Math.min(7, 16 - Math.max(0, bx), bx + 7), 3);
                px(x, Math.max(0, bx), y0, b2);
            }
            fill(x, b3, 0, y0 + 3, 16, 1);
        }
    },
    planks(x, cols, v, vertical) {
        const [p0, p1, p2, p3] = cols;
        fill(x, p0);
        for (let i = 0; i < 4; i++) {
            const o = i * 4;
            if (vertical) { fill(x, p3, o + 3, 0, 1, 16); fill(x, p2, o, 0, 1, 16); }
            else { fill(x, p3, 0, o + 3, 16, 1); fill(x, p2, 0, o, 16, 1); }
            const knot = Math.floor(hash2(i, v, 33) * 12) + 2;
            if (vertical) px(x, o + 1, knot, p1); else px(x, knot, o + 1, p1);
        }
        speckle(x, [p1], 90 + v, 0.05);
    },
    checker(x, a, b) {
        for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) fill(x, (i + j) % 2 ? b : a, i * 8, j * 8, 8, 8);
        x.globalAlpha = 0.15; fill(x, '#ffffff', 0, 0, 16, 1); fill(x, '#ffffff', 0, 8, 16, 1); x.globalAlpha = 1;
    },
    carpet(x, a, b, c) {
        fill(x, a);
        for (let j = 0; j < 16; j += 4) for (let i = (j / 4) % 2 * 2; i < 16; i += 4) px(x, i + 1, j + 1, b);
        speckle(x, [c], 5, 0.03);
    },
};

/* tile kinds by map character, per map family. The map code (10_map.js) uses these legends. */

// ---- 06_area.js ----
/* Areas (maps): a grid of tiles from an ASCII layout and a legend, the things in it, its rooms (the
   camera keeps to the room Wren is in) and its regions (names and music). Tiles are drawn by kind with
   the area's theme; walls, cliffs, water edges and pit lips look at their neighbours. */

/* legends shared by families of maps; a map's own legend adds to (or overrides) its family's */
const LEGENDS = {
    outdoor: {
        '.': { k: 'grass', p: 'grass' }, ',': { k: 'grass', p: 'flowers' }, '"': { k: 'grass', p: 'tallgrass' },
        ':': { k: 'path', p: 'path' }, '=': { k: 'path', p: 'cobble' }, ';': { k: 'sand', p: 'sand' },
        '~': { k: 'water', p: 'deep' }, '-': { k: 'shallow', p: 'water' }, '#': { k: 'cliff', p: 'cliff' },
        '^': { k: 'rock', p: 'cliff' }, 'o': { k: 'pit', p: 'pit' }, 'v': { k: 'ledge', p: 'ledge' },
        '_': { k: 'bridge', p: 'bridgeH' }, '|': { k: 'bridge', p: 'bridgeV' }, '%': { k: 'fog', p: 'fog' },
        'H': { k: 'stairs', p: 'stairs' }, ' ': { k: 'void', p: 'void' },
    },
    dungeon: {
        '.': { k: 'floor', p: 'floor' }, ',': { k: 'floor', p: 'floor2' }, ':': { k: 'floor', p: 'floor3' },
        '#': { k: 'wall', p: 'wall' }, 'o': { k: 'pit', p: 'pit' }, '~': { k: 'water', p: 'deep' },
        '-': { k: 'shallow', p: 'water' }, 'H': { k: 'stairs', p: 'stairs' }, '^': { k: 'spikes', p: 'spikes' },
        ' ': { k: 'void', p: 'void' }, '_': { k: 'bridge', p: 'bridgeH' }, '|': { k: 'bridge', p: 'bridgeV' },
        'v': { k: 'ledge', p: 'ledge' },
    },
    interior: {
        '.': { k: 'floor', p: 'floor' }, ',': { k: 'floor', p: 'floor2' }, ':': { k: 'floor', p: 'floor3' },
        '#': { k: 'wall', p: 'wall' }, ' ': { k: 'void', p: 'void' }, 'H': { k: 'stairs', p: 'stairs' },
        'o': { k: 'pit', p: 'pit' },
    },
};

const AREAS = {};            /* id -> definition (data files fill this) */
function defArea(def) { AREAS[def.id] = def; return def; }

class Area {
    constructor(def) {
        this.def = def;
        this.id = def.id;
        this.name = def.name || '';
        this.theme = THEMES[def.theme] || THEMES.town;
        this.themeName = def.theme;
        this.family = def.family || 'outdoor';
        const rows = Array.isArray(def.rows) ? def.rows : def.rows.split('\n').filter(r => r.length);
        this.h = rows.length;
        this.w = Math.max(...rows.map(r => r.length));
        this.legend = Object.assign({}, LEGENDS[this.family], def.legend || {});
        this.cells = new Array(this.w * this.h);
        this.chars = new Array(this.w * this.h);
        this.ents = [];
        this.occ = new Map();               /* "x,y" -> the grid thing standing there */
        this.rooms = (def.rooms || [{ x: 0, y: 0, w: this.w, h: this.h }]).map((r, i) => Object.assign({ i }, r));
        this.regions = def.regions || [];
        this.flow = new Map();              /* "x,y" -> direction of a current */
        this.overlays = [];
        this.staticSolid = new Set();       /* tiles blocked by buildings, trees and other props */
        const spawns = [];
        for (let y = 0; y < this.h; y++) {
            for (let x = 0; x < this.w; x++) {
                const ch = rows[y][x] === undefined ? ' ' : rows[y][x];
                let L = this.legend[ch];
                if (!L) { L = this.legend['.']; }
                this.chars[y * this.w + x] = ch;
                this.cells[y * this.w + x] = L;
                if (L.ent) spawns.push({ x, y, L });
                if (L.flow !== undefined) this.flow.set(key2(x, y), L.flow);
            }
        }
        this._spawns = spawns;
    }

    inside(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
    cell(x, y) { return this.inside(x, y) ? this.cells[y * this.w + x] : this.legend[' '] || { k: 'void' }; }
    kind(x, y) {
        if (this.staticSolid.size && this.staticSolid.has(y * 4096 + x)) return TK.prop;
        return TK[this.cell(x, y).k] || TK.void;
    }
    kindName(x, y) { return this.cell(x, y).k; }
    setCell(x, y, ch) { if (this.inside(x, y)) { this.cells[y * this.w + x] = this.legend[ch]; this.chars[y * this.w + x] = ch; this._dirty = true; } }

    /* who is standing on a tile (grid things only) */
    at(x, y) { return this.occ.get(key2(x, y)) || null; }
    place(e, x, y) { this.occ.set(key2(x, y), e); }
    unplace(e, x, y) { if (this.occ.get(key2(x, y)) === e) this.occ.delete(key2(x, y)); }

    /* can a grid thing of this weight move onto the tile? (pits and water are allowed: it falls or floats) */
    freeForThing(x, y, e) {
        if (!this.inside(x, y)) return false;
        const k = this.kind(x, y);
        if (k.solid || k.ledge) return false;
        if (k.fog) return false;
        const o = this.at(x, y);
        if (o && o !== e) return false;
        /* gates and other blockers that aren't grid things */
        for (const b of this.blockers) if (b.blocks(x, y, e)) return false;
        /* the player and walkers occupy tiles too */
        if (e && e.isGrid && G.player && G.player.area === this && !G.player.dead && G.player.onTile(x, y) && e !== G.player) return false;
        for (const m of this.walkers) if (m !== e && m.alive !== false && m.onTile && m.onTile(x, y)) return false;
        return true;
    }

    roomAt(tx, ty) {
        for (const r of this.rooms) if (tx >= r.x && ty >= r.y && tx < r.x + r.w && ty < r.y + r.h) return r;
        return null;
    }
    regionAt(tx, ty) {
        for (const r of this.regions) if (tx >= r.x && ty >= r.y && tx < r.x + r.w && ty < r.y + r.h) return r;
        return null;
    }

    get blockers() { return this._blockers || (this._blockers = []); }
    get walkers() { return this._walkers || (this._walkers = []); }
    add(e) {
        e.area = this;
        this.ents.push(e);
        if (e.blocks && e.staticBlock) { for (const [dx, dy] of e.solid) this.staticSolid.add((e.ty + dy) * 4096 + (e.tx + dx)); }
        else if (e.blocks) this.blockers.push(e);
        if (e.isWalker) this.walkers.push(e);
        if (e.onAdd) e.onAdd(this);
        return e;
    }
    remove(e) {
        e.removed = true;
        const i = this.ents.indexOf(e); if (i >= 0) this.ents.splice(i, 1);
        const j = this.blockers.indexOf(e); if (j >= 0) this.blockers.splice(j, 1);
        const k = this.walkers.indexOf(e); if (k >= 0) this.walkers.splice(k, 1);
        if (e.isGrid) this.unplace(e, e.tx, e.ty);
    }
    find(id) { return this.ents.find(e => e.id === id); }
    all(kind) { return this.ents.filter(e => e.kind === kind); }
}

/* ---------- drawing the ground ---------- */
const TileDraw = {
    frame: 0,
    draw(area, tx, ty, sx, sy) {
        const L = area.cell(tx, ty);
        const tn = area.def.themeAt ? area.def.themeAt(tx, ty) : area.themeName, th = THEMES[tn] || area.theme;
        const v = Math.floor(hash2(tx, ty, 99) * 4);
        let c;
        const p = L.p;
        const same = (dx, dy, kinds) => { const k = area.cell(tx + dx, ty + dy).k; return kinds.includes(k); };
        switch (p) {
            case 'grass': c = tileCanvas(`${tn}:grass:${v}`, x => Paint.grass(x, th, v)); break;
            case 'flowers': c = tileCanvas(`${tn}:flowers:${v}`, x => Paint.flowers(x, th, v + 4)); break;
            case 'tallgrass': c = tileCanvas(`${tn}:tall:${v % 2}`, x => Paint.tallgrass(x, th, v)); break;
            case 'path': c = tileCanvas(`${tn}:path:${v}`, x => Paint.path(x, th, v)); break;
            case 'cobble': c = tileCanvas(`${tn}:cobble:${v % 2}`, x => Paint.cobble(x, th, v)); break;
            case 'sand': c = tileCanvas(`${tn}:sand:${v}`, x => Paint.sand(x, th, v)); break;
            case 'water': case 'deep': {
                const f = Math.floor(this.frame / 20) % 8;
                const land = k => !['water', 'shallow', 'current', 'void', 'bridge'].includes(k);
                const n = land(area.cell(tx, ty - 1).k) ? 1 : 0, s = land(area.cell(tx, ty + 1).k) ? 1 : 0;
                const w = land(area.cell(tx - 1, ty).k) ? 1 : 0, e = land(area.cell(tx + 1, ty).k) ? 1 : 0;
                const mask = n | s << 1 | w << 2 | e << 3;
                c = tileCanvas(`${tn}:${p}:${v}:${f}:${mask}`, x => {
                    (p === 'deep' ? Paint.deep : Paint.water)(x, th, v, f);
                    const foam = th.water[2], edge = shade(th.water[3], -0.1);
                    const wob = i => (Math.floor(hash2(i, f, 3) * 2));
                    if (n) { fill(x, edge, 0, 0, 16, 2); for (let i = 0; i < 16; i++) px(x, i, 2 + wob(i), foam); }
                    if (s) { for (let i = 0; i < 16; i++) px(x, i, 14 - wob(i + 5), foam); }
                    if (w) { fill(x, edge, 0, 0, 2, 16); for (let i = 0; i < 16; i++) px(x, 2 + wob(i + 9), i, foam); }
                    if (e) { for (let i = 0; i < 16; i++) px(x, 14 - wob(i + 2), i, foam); }
                });
                break;
            }
            case 'pit': {
                const lipN = !['pit', 'void'].includes(area.cell(tx, ty - 1).k);
                c = tileCanvas(`pit:${lipN}`, x => {
                    Paint.pit(x, th);
                    if (lipN) { fill(x, '#3a2a34', 0, 0, 16, 3); fill(x, '#221722', 0, 3, 16, 2); }
                });
                break;
            }
            case 'cliff': {
                const cl = k => k === 'cliff' || k === 'rock';
                const below = cl(area.cell(tx, ty + 1).k), above = cl(area.cell(tx, ty - 1).k);
                const left = cl(area.cell(tx - 1, ty).k), right = cl(area.cell(tx + 1, ty).k);
                const mask = (below ? 1 : 0) | (above ? 2 : 0) | (left ? 4 : 0) | (right ? 8 : 0);
                c = tileCanvas(`${tn}:cliff:${v}:${mask}`, x => this.cliff(x, th, v, below, above, left, right));
                break;
            }
            case 'ledge': c = tileCanvas(`${tn}:ledge:${v}`, x => {
                Paint.grass(x, th, v);
                fill(x, th.stone[3], 0, 10, 16, 2); fill(x, th.stone[1], 0, 12, 16, 3); fill(x, th.stone[2], 0, 12, 16, 1);
                fill(x, shade(th.stone[3], -0.3), 0, 15, 16, 1);
            }); break;
            case 'bridgeH': case 'bridgeV': c = tileCanvas(`bridge:${p}:${v}`, x => {
                const cols = ['#c9925a', '#9a6438', '#e6c08a', '#6b4128'];
                Paint.planks(x, cols, v, p === 'bridgeH');
                if (p === 'bridgeH') { fill(x, '#45281c', 0, 0, 16, 1); fill(x, '#45281c', 0, 15, 16, 1); }
                else { fill(x, '#45281c', 0, 0, 1, 16); fill(x, '#45281c', 15, 0, 1, 16); }
            }); break;
            case 'stairs': c = tileCanvas(`${tn}:stairs`, x => {
                const s = th.stone || th.wall;
                for (let i = 0; i < 4; i++) { fill(x, s[2], 0, i * 4, 16, 1); fill(x, s[0], 0, i * 4 + 1, 16, 2); fill(x, s[3], 0, i * 4 + 3, 16, 1); }
            }); break;
            case 'fog': {
                const f = Math.floor(this.frame / 12) % 8;
                c = tileCanvas(`fog:${v}:${f}`, x => {
                    fill(x, '#d8d4dc');
                    for (let j = 0; j < 16; j++) for (let i = 0; i < 16; i++) {
                        const r = hash2(i + f * 2, j, v + 40);
                        if (r < 0.25) px(x, i, j, '#eeeaf2'); else if (r > 0.85) px(x, i, j, '#c4bfcc');
                    }
                    /* the fine lines no one looks at closely */
                    x.globalAlpha = 0.18; for (let i = 0; i < 16; i += 3) fill(x, '#ffffff', (i + f) % 16, 0, 1, 16); x.globalAlpha = 1;
                });
                break;
            }
            case 'void': c = tileCanvas('void', x => fill(x, PAL.night)); break;
            case 'forest': c = tileCanvas(`${tn}:forest:${v}`, x => { fill(x, shade(th.grass[3], -0.35)); speckle(x, [shade(th.grass[3], -0.2)], v + 9, 0.15); }); break;
            case 'spikes': c = tileCanvas(`${tn}:spikes`, x => {
                this.floor(x, area, 'floor', v);
                for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) {
                    const bx = 2 + i * 8, by = 3 + j * 8;
                    fill(x, '#5a5060', bx, by + 3, 5, 2);
                    px(x, bx + 2, by, '#e4e0ea'); fill(x, '#b8b2c4', bx + 1, by + 1, 3, 1); fill(x, '#8a8296', bx, by + 2, 5, 1);
                }
            }); break;
            case 'wall': {
                const isW = k => k === 'wall' || k === 'void';
                const below = isW(area.cell(tx, ty + 1).k);
                const mask = (below ? 1 : 0) | (isW(area.cell(tx, ty - 1).k) ? 2 : 0) | (isW(area.cell(tx - 1, ty).k) ? 4 : 0) | (isW(area.cell(tx + 1, ty).k) ? 8 : 0);
                c = tileCanvas(`${tn}:wall:${v}:${mask}`, x => Walls.draw(x, area, tn, th, v, mask));
                break;
            }
            default: {
                /* floors, by theme */
                c = tileCanvas(`${tn}:${p}:${v}`, x => this.floor(x, area, p, v));
            }
        }
        Gfx.img(c, sx, sy);
    },

    cliff(x, th, v, below, above, left, right) {
        const [s0, s1, s2, s3] = th.stone;
        fill(x, s1);
        /* rock strata */
        for (let j = 0; j < 16; j += 4) {
            const off = Math.floor(hash2(v, j, 6) * 6);
            fill(x, s0, 0, j + 1, 16, 2);
            for (let i = off; i < 16; i += 7) { fill(x, s3, i, j, 1, 4); px(x, i + 1, j + 1, s2); }
            fill(x, mix(s1, s3, 0.5), 0, j + 3, 16, 1);
        }
        if (!above) { fill(x, th.grass ? th.grass[0] : s2, 0, 0, 16, 3); fill(x, th.grass ? th.grass[3] : s3, 0, 3, 16, 1); }
        if (!left) fill(x, s3, 0, 0, 1, 16);
        if (!right) fill(x, s3, 15, 0, 1, 16);
        if (!below) { fill(x, shade(s3, -0.35), 0, 14, 16, 2); }
    },

    floor(x, area, p, v) {
        const tn = area.themeName, th = area.theme;
        const F = FLOORS[tn] && FLOORS[tn][p];
        if (F) return F(x, th, v);
        if (th.floor) { fill(x, th.floor[0]); speckle(x, [th.floor[2]], v + 3, 0.06); return; }
        Paint.grass(x, th, v);
    },
};

/* floor painters for interiors and Houses, by theme then legend painter name */
const FLOORS = {
    tidy: {
        floor: (x, th) => Paint.checker(x, '#efe4cc', '#3a4656'),
        floor2: (x, th, v) => Paint.carpet(x, '#9a3a4a', '#c45a6a', '#6e2232'),
        floor3: (x, th, v) => Paint.planks(x, ['#c9925a', '#9a6438', '#e6c08a', '#6b4128'], v, true),
    },
    house: {
        floor: (x, th, v) => Paint.planks(x, ['#c9925a', '#9a6438', '#e6c08a', '#7b4a2c'], v, false),
        floor2: (x, th, v) => Paint.carpet(x, '#b0434a', '#d06a6a', '#7a2a32'),
        floor3: (x, th) => Paint.checker(x, '#efe4cc', '#c9b896'),
    },
};

/* walls seen from above at a slant: the face shows where the tile below is open floor */
const Walls = {
    draw(x, area, tn, th, v, mask) {
        const below = mask & 1, above = mask & 2, left = mask & 4, right = mask & 8;
        const W = WALLS[tn] || WALLS.default;
        if (!below) W.face(x, th, v);
        else W.top(x, th, v);
        const edge = W.edge || '#1a1418';
        /* outline the wall's top where it meets floor */
        if (below) {
            if (!left) fill(x, edge, 0, 0, 1, 16);
            if (!right) fill(x, edge, 15, 0, 1, 16);
            if (!above) fill(x, edge, 0, 0, 16, 1);
        } else {
            if (!above) fill(x, edge, 0, 0, 16, 1);
            if (!left) fill(x, edge, 0, 0, 1, 16);
            if (!right) fill(x, edge, 15, 0, 1, 16);
        }
    },
};
const WALLS = {
    default: {
        top: (x, th) => { const c = th.wall || th.stone; fill(x, c[3]); speckle(x, [shade(c[3], 0.1)], 4, 0.1); },
        face: (x, th, v) => { const c = th.wall || th.stone; Paint.bricks(x, c, v); fill(x, shade(c[3], -0.3), 0, 15, 16, 1); },
    },
    tidy: {
        edge: '#142424',
        top: (x, th) => { fill(x, '#245a54'); speckle(x, ['#2c6a63'], 4, 0.12); },
        face: (x, th, v) => {
            /* teal damask paper over a wooden wainscot */
            fill(x, '#5fb7a8');
            for (let j = 1; j < 10; j += 4) for (let i = (j % 8 === 1 ? 2 : 6); i < 16; i += 8) {
                px(x, i, j, '#8fd6c8'); px(x, i - 1, j + 1, '#8fd6c8'); px(x, i + 1, j + 1, '#8fd6c8'); px(x, i, j + 2, '#8fd6c8');
                px(x, i, j + 1, '#3c8a80');
            }
            fill(x, '#9a3a4a', 0, 10, 16, 1);
            fill(x, '#b0785a', 0, 11, 16, 4); fill(x, '#d09a74', 0, 11, 16, 1);
            for (let i = 3; i < 16; i += 5) fill(x, '#7a4e38', i, 12, 1, 3);
            fill(x, '#4a2e22', 0, 15, 16, 1);
        },
    },
    house: {
        edge: '#2a1a14',
        top: (x) => { fill(x, '#5a3a28'); speckle(x, ['#6a4632'], 4, 0.12); },
        face: (x, th, v) => {
            fill(x, '#e9d9b4'); speckle(x, ['#dccaa2'], 8 + v, 0.2);
            for (let i = 0; i < 16; i += 8) fill(x, '#cdb88c', i, 0, 1, 11);
            fill(x, '#8a5a3c', 0, 11, 16, 1); fill(x, '#b07a50', 0, 12, 16, 3); fill(x, '#5a3a28', 0, 15, 16, 1);
        },
    },
};

// ---- 07_return.js ----
/* The Return: everything with a mark goes back the way it came.
   A marked thing remembers its mark (where it belongs) and its trace (the tiles it went through since it
   left, loops erased: stepping back onto a tile cuts the trace back to it). Left alone for its patience it
   returns along the trace, one tile at a time, shoving lighter things aside and waiting behind heavier
   ones (a heavy thing shoves the player). Falling or sinking sends it home at once; breaking sends its
   pieces home along the trace. Strays (no mark) stay where they are. */

const WEIGHT = { light: 1, medium: 2, heavy: 3, fixed: 9 };
const RET = { patience: { 1: 90, 2: 120, 3: 150, 9: 150 }, pace: 10, snapPace: 3 };

const Return = {
    /* give a thing a mark at its tile */
    mark(e, opts = {}) {
        e.ret = {
            mx: e.tx, my: e.ty, area: e.area ? e.area.id : null,
            trace: [[e.tx, e.ty]],
            patience: opts.patience || RET.patience[e.weight] || 120,
            timer: 0,
            state: 'home',
            pace: opts.pace || RET.pace,
            color: opts.color || (e.area && e.area.def.thread) || THREAD.town,
            snap: false,
            strain: 0,
        };
    },
    isStray(e) { return !e.ret; },
    isHome(e) { return e.ret && e.ret.state === 'home'; },
    away(e) { return e.ret && e.ret.state !== 'home'; },

    /* the thing moved onto a tile: grow or cut its trace */
    moved(e, x, y) {
        const r = e.ret; if (!r) return;
        const tr = r.trace;
        const last = tr[tr.length - 1];
        if (last && last[0] === x && last[1] === y) return;
        let cut = -1;
        for (let i = tr.length - 1; i >= 0; i--) if (tr[i][0] === x && tr[i][1] === y) { cut = i; break; }
        if (cut >= 0) tr.length = cut + 1;
        else tr.push([x, y]);
        if (tr.length === 1 && x === r.mx && y === r.my) {
            if (r.state !== 'home') this.arrive(e);
        } else if (r.state === 'home') {
            r.state = 'away';
            r.timer = r.patience;
        }
    },
    /* something touched it: it waits its full patience again */
    disturb(e) {
        const r = e.ret; if (!r || r.state === 'home') return;
        if (r.state === 'returning' && !r.snap) r.state = 'away';
        if (!r.snap) r.timer = r.patience;
    },
    arrive(e) {
        const r = e.ret;
        r.state = 'home'; r.trace = [[r.mx, r.my]]; r.snap = false; r.strain = 0;
        if (e.area === G.map && e.onHome) e.onHome();
        if (e.area === G.map && !e.quietHome) { Fx.sparkle(e.tx * T + 8, e.ty * T + 8, r.color); Sfx.play('home'); }
        Stats.count('homecomings');
    },
    /* ring a bell / yank: go home now, fast */
    snap(e) {
        const r = e.ret; if (!r || r.state === 'home') return false;
        r.state = 'returning'; r.snap = true; r.timer = 0;
        return true;
    },
    /* fell into a pit or sank: reappear at the mark */
    sendHome(e) {
        const r = e.ret; if (!r) return;
        if (e.isGrid) { e.area.unplace(e, e.tx, e.ty); if (e.mv) e.area.unplace(e, e.mv.fx, e.mv.fy); }
        e.tx = r.mx; e.ty = r.my; e.mv = null;
        e.x = e.tx * T; e.y = e.ty * T;
        e.pendingHome = true;   /* placed when the mark is free */
        r.trace = [[r.mx, r.my]]; r.state = 'home'; r.snap = false;
    },
    held(e) {
        return !!(e.heldBy || e.carried || e.tiedOff || e.flying || e.shattered || (e.isHeld && e.isHeld()));
    },

    /* one step for a grid thing */
    update(e) {
        const r = e.ret; if (!r || e.removed) return;
        if (e.pendingHome) {
            if (e.area.freeForThing(e.tx, e.ty, e) || e.area.at(e.tx, e.ty) === e) {
                e.pendingHome = false; e.area.place(e, e.tx, e.ty);
                Fx.poof(e.tx * T + 8, e.ty * T + 8); if (e.area === G.map) Sfx.play('pop');
                if (e.onHome) e.onHome();
            }
            return;
        }
        if (r.state === 'home') return;
        if (this.held(e)) { if (!r.snap) r.timer = r.patience; return; }
        if (e.mv) return;
        if (r.state === 'away') {
            if (--r.timer <= 0) { r.state = 'returning'; }
            return;
        }
        /* returning: step to the previous tile of the trace */
        const tr = r.trace;
        if (tr.length < 2) { this.arrive(e); return; }
        const [nx, ny] = tr[tr.length - 2];
        const d = dirOf(nx - e.tx, ny - e.ty);
        const pace = r.snap ? RET.snapPace : r.pace;
        if (Math.abs(nx - e.tx) + Math.abs(ny - e.ty) !== 1) {
            /* the trace jumps (a throw, a flight): fly straight to it */
            e.startMove(nx, ny, pace * 2, true);
            return;
        }
        if (e.area.freeForThing(nx, ny, e)) { e.startMove(nx, ny, pace, true); r.strain = 0; return; }
        /* something's in the way */
        const o = e.area.at(nx, ny);
        const force = e.weight + (r.snap ? 1 : 0);
        if (o && o.isGrid && !o.fixed && o.weight < force && o.canBeShoved && o.canBeShoved(d)) {
            o.shove(d, pace, e);
            e.startMove(nx, ny, pace, true);
            return;
        }
        const p = G.player;
        if (p && p.area === e.area && p.onTile(nx, ny) && force >= WEIGHT.heavy && p.canBeShoved(d)) {
            p.shoved(d, pace);
            e.startMove(nx, ny, pace, true);
            return;
        }
        let pushedOne = false;
        for (const m of e.area.walkers) {
            if (m.onTile && m.onTile(nx, ny) && m.weightN !== undefined && m.weightN < force && m.shoved) { m.shoved(d, pace, e); pushedOne = true; }
        }
        if (pushedOne) return;
        r.strain++;
    },
};

/* ---------- things on the grid ---------- */
let _entSeq = 0;
class Ent {
    constructor(kind, props = {}) {
        this.kind = kind;
        this.uid = ++_entSeq;
        Object.assign(this, props);
    }
    update() {}
    draw() {}
    get sortY() { return this.y + 16; }
}

/* a thing that stands on one tile and moves a tile at a time (blocks, pots, crates, chests, townsfolk) */
class GridThing extends Ent {
    constructor(kind, tx, ty, props = {}) {
        super(kind, props);
        this.tx = tx; this.ty = ty; this.x = tx * T; this.y = ty * T;
        this.isGrid = true;
        this.weight = this.weight || WEIGHT.medium;
        this.mv = null;
        this.z = 0;
    }
    onAdd(area) {
        area.place(this, this.tx, this.ty);
        if (this.marked !== false && !this.ret) Return.mark(this, { color: this.thread, patience: this.patience });
        /* things that start away from home (already displaced along a given trace) */
        if (this.startAt && this.ret) {
            area.unplace(this, this.tx, this.ty);
            this.tx = this.startAt[0]; this.ty = this.startAt[1]; this.x = this.tx * T; this.y = this.ty * T;
            area.place(this, this.tx, this.ty);
            this.ret.trace = (this.trace || [[this.ret.mx, this.ret.my], this.startAt]).map(p => p.slice());
            this.ret.state = 'away'; this.ret.timer = this.ret.patience;
        }
    }
    get px() { return this.mv ? lerp(this.mv.fx, this.mv.tx, this.mv.t / this.mv.dur) * T : this.tx * T; }
    get py() { return this.mv ? lerp(this.mv.fy, this.mv.ty, this.mv.t / this.mv.dur) * T : this.ty * T; }
    get sortY() { return this.py + 15; }
    canBeShoved(d) { return !this.mv && !this.fixed && this.area.freeForThing(this.tx + DX[d], this.ty + DY[d], this); }
    /* pushed by the player (or shoved by a returning thing) */
    canPush(d) { return !this.mv && !this.fixed && !this.noPush && this.area.freeForThing(this.tx + DX[d], this.ty + DY[d], this); }
    push(d, dur = 16) {
        if (!this.canPush(d)) return false;
        this.startMove(this.tx + DX[d], this.ty + DY[d], dur);
        Sfx.play('push');
        Fx.dust(this.tx * T + 8 - DX[d] * 8, this.ty * T + 14);
        return true;
    }
    shove(d, dur, by) { this.startMove(this.tx + DX[d], this.ty + DY[d], dur); }
    startMove(nx, ny, dur, returning = false) {
        const a = this.area;
        /* the source tile stays held until the move ends */
        a.place(this, nx, ny);
        /* during the move it holds both tiles (so plates feel it in passing) */
        this.mv = { fx: this.tx, fy: this.ty, tx: nx, ty: ny, t: 0, dur, returning };
        this.tx = nx; this.ty = ny;
        if (!returning && this.ret) Return.disturb(this);
    }
    stepMove() {
        const m = this.mv; if (!m) return;
        m.t++;
        if (m.t >= m.dur) {
            this.mv = null;
            this.area.unplace(this, m.fx, m.fy);
            this.area.place(this, this.tx, this.ty);
            this.x = this.tx * T; this.y = this.ty * T;
            if (this.ret) {
                if (m.returning) {
                    const tr = this.ret.trace;
                    if (tr.length >= 2) tr.pop();
                    if (tr.length === 1) Return.arrive(this);
                } else Return.moved(this, this.tx, this.ty);
            }
            this.landed(m.returning);
        }
    }
    /* arrived on a tile: pits, water */
    landed(returning) {
        const k = this.area.kind(this.tx, this.ty);
        /* a returning thing hangs on its thread over pits and water */
        if (returning || (this.ret && this.ret.state === 'returning')) { if (this.onLanded) this.onLanded(); return; }
        if (k.pit) this.fall();
        else if (k.deep && !this.floats) this.sink();
        if (this.onLanded) this.onLanded();
    }
    fall() {
        Fx.fallAt(this.tx * T, this.ty * T, this.sprite());
        Sfx.play('fall');
        if (this.ret) Return.sendHome(this);
        else this.onLost ? this.onLost('pit') : this.fillPit();
    }
    /* a stray in a pit fills it for good */
    fillPit() {
        this.area.unplace(this, this.tx, this.ty);
        this.area.remove(this);
        this.area.setCell(this.tx, this.ty, this.area.family === 'outdoor' ? ':' : ',');
        Progress.setAreaFlag(this.area.id, `fill:${this.tx},${this.ty}`);
    }
    sink() {
        Fx.splash(this.tx * T + 8, this.ty * T + 8);
        Sfx.play('splash');
        if (this.ret) Return.sendHome(this);
        else { this.area.remove(this); }
    }
    update() {
        this.stepMove();
        if (this.ret) Return.update(this);
        if (this.tick) this.tick();
    }
    sprite() { return null; }
    draw(cx, cy) {
        const im = this.sprite();
        if (!im) return;
        const sx = this.px - cx, sy = this.py - cy - (im.height - T) - this.z;
        let shake = 0;
        const r = this.ret;
        if (r && r.state === 'away' && !Return.held(this) && r.timer < 30) shake = (G.t >> 1) % 2 ? 1 : -1;
        if (r && r.strain > 0 && G.t % 8 < 4) shake = 1;
        Gfx.img(im, sx + shake + (this.ox || 0), sy + (this.oy || 0));
    }
}

/* draw every displaced thing's trace and its empty mark (under the things) */
const Threads = {
    draw(area, cx, cy) {
        const c = Gfx.ctx;
        for (const e of area.ents) {
            const r = e.ret;
            if (!r || r.state === 'home' || e.hideThread) continue;
            if (r.area && r.area !== area.id) continue;
            const pts = r.trace.map(([x, y]) => [x * T + 8 - cx, y * T + 9 - cy]);
            /* to where the thing is now (mid-move) */
            const ex = (e.carried ? e.cx : e.px + 8) - cx, ey = (e.carried ? e.cy : e.py + 9) - cy;
            if (pts.length) pts[pts.length - 1] = [ex, ey];
            const col = r.color;
            const tight = r.state === 'returning' || (r.timer < 30 && !Return.held(e));
            for (let i = 0; i + 1 < pts.length; i++) {
                Gfx.line(pts[i][0], pts[i][1] + 1, pts[i + 1][0], pts[i + 1][1] + 1, 'rgba(20,10,20,0.35)');
                Gfx.line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1], tight ? shade(col, 0.4) : col);
            }
            Marks.draw(r.mx * T - cx, r.my * T - cy, col, true);
        }
    },
};
/* the little stitched cross that is a thing's place */
const Marks = {
    draw(sx, sy, col, empty) {
        const x0 = sx + 4, y0 = sy + 4;
        const dark = shade(col, -0.45);
        for (let i = 0; i < 8; i++) {
            if (i === 3 || i === 4) continue;
            Gfx.rect(x0 + i, y0 + i + 1, 1, 1, dark); Gfx.rect(x0 + 7 - i, y0 + i + 1, 1, 1, dark);
            Gfx.rect(x0 + i, y0 + i, 1, 1, col); Gfx.rect(x0 + 7 - i, y0 + i, 1, 1, col);
        }
        Gfx.rect(x0 + 3, y0 + 3, 2, 2, empty ? '#1a1018' : col);
    },
};

        return h + r;

}

class Block extends GridThing {

        super('block', tx, ty, props);
        this.style = props.style || 'stone';
        this.weight = props.weight || (this.style === 'wood' ? WEIGHT.medium : WEIGHT.heavy);
        if (props.stray) this.marked = false;
        this.floats = this.style === 'wood';
    }
    sprite() { return spr(this.look || (this.marked === false ? 'block_stray' : 'block_' + this.style)); }
}

/* liftable things: pots and crates */
class Liftable extends GridThing {

    }

class Pot extends Liftable {
    constructor(tx, ty, props = {}) { super('pot', tx, ty, props); this.breaks = true; this.style = props.style || 'pot'; }

class Crate extends Liftable {

class Bust extends GridThing {

/* ---------- floor things (not on the grid: things stand on them) ---------- */
class FloorThing extends Ent {
    constructor(kind, tx, ty, props = {}) { super(kind, props); this.tx = tx; this.ty = ty; this.x = tx * T; this.y = ty * T; this.floor = true; }
    get sortY() { return -1000 + this.y; }
    /* is anything weighing on this tile? */
    weighed() {
        const a = this.area, o = a.at(this.tx, this.ty);
        if (o && !o.carried && !o.flying && o.weight >= (this.minWeight || 1)) return true;
        const p = G.player;
        if (p && p.area === a && !p.flying && !p.dead && p.feetOn(this.tx, this.ty) && (this.minWeight || 1) <= WEIGHT.medium) return true;
        for (const m of a.walkers) if (m.alive !== false && m.feetOn && m.feetOn(this.tx, this.ty) && (m.weightN || 2) >= (this.minWeight || 1)) return true;
        return false;
    }
}
class Plate extends FloorThing {
    constructor(tx, ty, props = {}) {
        super('plate', tx, ty, props);
        this.sig = props.sig || 'plate';
        this.mode = props.mode || 'hold';     /* hold | toggle | timed */
        this.on = false; this.down = false; this.timer = 0;
    }
    update() {
        const w = this.weighed();
        if (w && !this.down) { Sfx.play('click'); if (this.mode === 'toggle') this.on = !this.on; if (this.mode === 'timed' || this.mode === 'pulse') this.timer = this.time || 300; }
        if (!w && this.down) Sfx.play('unclick');
        this.down = w;
        if (this.mode === 'hold') this.on = w;
        if (this.mode === 'timed') { if (this.timer > 0) this.timer--; this.on = w || this.timer > 0; }
        if (this.mode === 'pulse') { if (this.timer > 0) this.timer--; this.on = this.timer > 0; }
        if (this.on) Signals.set(this.area, this.sig);
    }
    draw(cx, cy) {
        Gfx.img(spr(this.down ? 'plate_down' : 'plate'), this.x - cx, this.y - cy);
        if ((this.mode === 'timed' || this.mode === 'pulse') && this.timer > 0 && (!this.down || this.mode === 'pulse')) {
            const n = Math.ceil(this.timer / 60);
            for (let i = 0; i < n && i < 8; i++) Gfx.rect(this.x - cx + 3 + i * 2, this.y - cy + 2, 1, 2, PAL.yellow);
        }
    }
}

/* crystal switches flip when struck (the stick, a throw, flying shards) */
class Crystal extends GridThing {
    constructor(tx, ty, props = {}) {
        super('crystal', tx, ty, Object.assign({ weight: WEIGHT.fixed, fixed: true, marked: false }, props));
        this.sig = props.sig || 'crystal';
        this.on = !!props.on;
        this.cool = 0;
    }
    hit() {
        if (this.cool > 0) return;
        this.on = !this.on; this.cool = 20;
        Sfx.play('crystal'); Fx.ring(this.tx * T + 8, this.ty * T + 6, this.on ? '#f0608e' : '#5ab0f0');
    }
    tick() { if (this.cool > 0) this.cool--; if (this.on) Signals.set(this.area, this.sig); }
    sprite() { return spr(this.on ? 'crystal_b' : 'crystal_a'); }
}

/* ---------- signals: plates and crystals set names, doors read expressions ---------- */
const Signals = {
    begin(area) { area.sigPrev = area.sig || {}; area.sig = {}; },
    set(area, name) { area.sig[name] = true; },
    get(area, name) { return !!(area.sigPrev && area.sigPrev[name]); },
    /* "a&b", "a|b", "!a", "a&!b|c" */
    eval(area, expr) {
        if (!expr) return false;
        return expr.split('|').some(term => term.split('&').every(t => {
            t = t.trim(); const neg = t[0] === '!'; const n = neg ? t.slice(1) : t;
            const v = n.startsWith('flag:') ? Progress.flag(n.slice(5)) : this.get(area, n);
            return neg ? !v : v;
        }));
    },
};

/* ---------- doors: gates that open on a signal, locked doors, the Pattern door, shutters ---------- */
class Door extends Ent {
    constructor(tx, ty, props = {}) {
        super('door', props);
        this.tx = tx; this.ty = ty; this.x = tx * T; this.y = ty * T;
        this.type = props.type || 'gate';    /* gate (signal) | lock (small key) | big (Pattern) | shutter (room clear) */
        this.open = false; this.anim = 0;
        this.dir = props.dir || 'h';          /* h: in a horizontal wall (you pass up/down), v: in a vertical wall */
    }
    onAdd(area) {
        if (this.id && Progress.areaFlag(area.id, 'door:' + this.id)) { this.open = true; this.anim = 8; this.locked = false; this.openedOnce = true; this.keep = true; }
    }
    blocks(x, y) { return !this.open && x === this.tx && y === this.ty; }
    update() {
        if (this.type === 'gate' || this.type === 'shutter') {
            let want = this.type === 'gate' ? Signals.eval(this.area, this.when) : !this.shut;
            if (this.keep && this.openedOnce) want = true;
            if (this.open && this.passed && !this.openedOnce) {
                const p = G.player, d = dirByName(this.passed);
                if (p && p.area === this.area && (d === UP ? p.ty < this.ty : d === DOWN ? p.ty > this.ty : d === LEFT ? p.tx < this.tx : p.tx > this.tx) && Math.abs((d === UP || d === DOWN ? p.tx - this.tx : p.ty - this.ty)) < 3) {
                    this.openedOnce = true; this.keep = true; if (this.id) Progress.setAreaFlag(this.area.id, 'door:' + this.id);
                }
            }
            if (want && !this.open) {
                /* don't close on someone; open */
                this.open = true; Sfx.play('door');
                if (this.keep) { this.openedOnce = true; if (this.id) Progress.setAreaFlag(this.area.id, 'door:' + this.id); }
            } else if (!want && this.open) {
                const p = G.player;
                const blocked = (p && p.onTile(this.tx, this.ty)) || this.area.at(this.tx, this.ty);
                if (!blocked) { this.open = false; Sfx.play('doorshut'); }
            }
        }
        this.anim = approach(this.anim, this.open ? 8 : 0, 1);
    }
    /* walking into a locked door with a key */
    tryUnlock(p) {
        if (this.open) return false;
        if (this.type === 'lock') {
            if (Inv.keys(this.area.def.house) > 0) {
                Inv.useKey(this.area.def.house);
                this.openDoor(); return true;
            }
            UI.toast('Locked. A small key would fit.'); return false;
        }
        if (this.type === 'big') {
            if (Inv.hasPattern(this.area.def.house)) { this.openDoor(); return true; }
            UI.toast("A big lock, stitched with the House's pattern."); return false;
        }
        return false;
    }
    openDoor() {
        this.open = true; Sfx.play('unlock');
        if (this.id) Progress.setAreaFlag(this.area.id, 'door:' + this.id);
    }
    get sortY() { return this.y + (this.dir === 'h' ? 15 : 15); }
    draw(cx, cy) {
        const sx = this.x - cx, sy = this.y - cy;
        const a = this.anim;
        if (a >= 8) return;
        const th = this.area.theme;
        const bar = this.type === 'lock' ? '#8a5a2a' : this.type === 'big' ? '#2e5a98' : (th.wall ? th.wall[3] : '#5a4a4a');
        const hi = this.type === 'lock' ? '#c89050' : this.type === 'big' ? '#6ab0e0' : (th.wall ? th.wall[2] : '#9a8a8a');
        if (this.dir === 'h') {
            const hgt = 16 - a * 2;
            Gfx.rect(sx, sy, 16, hgt, PAL.ink);
            Gfx.rect(sx + 1, sy + 1, 14, Math.max(0, hgt - 2), bar);
            for (let i = 2; i < 14; i += 4) Gfx.rect(sx + i, sy + 1, 2, Math.max(0, hgt - 2), hi);
        } else {
            const wd = 16 - a * 2;
            Gfx.rect(sx, sy, wd, 16, PAL.ink);
            Gfx.rect(sx + 1, sy + 1, Math.max(0, wd - 2), 14, bar);
            for (let i = 2; i < 14; i += 4) Gfx.rect(sx + 1, sy + i, Math.max(0, wd - 2), 2, hi);
        }
        if ((this.type === 'lock' || this.type === 'big') && a === 0) {
            Gfx.rect(sx + 5, sy + 5, 6, 6, PAL.ink); Gfx.rect(sx + 6, sy + 6, 4, 4, this.type === 'big' ? '#f7d64a' : '#e8b04a');
            Gfx.rect(sx + 7, sy + 7, 2, 3, PAL.ink);
        }
    }
}

/* ---------- chests ---------- */
class Chest extends GridThing {
    constructor(tx, ty, props = {}) {
        super('chest', tx, ty, Object.assign({ weight: WEIGHT.fixed, fixed: true, marked: false }, props));
        this.item = props.item; this.opened = false;
        this.big = !!props.big;
        this.hidden = !!props.hidden;     /* appears on a signal */
    }
    onAdd(area) {
        super.onAdd(area);
        if (Progress.areaFlag(area.id, 'chest:' + this.id)) { this.opened = true; this.hidden = false; }
        if (this.hidden) area.unplace(this, this.tx, this.ty);
    }
    tick() {
        if (this.hidden && this.when && Signals.eval(this.area, this.when)) {
            this.hidden = false; this.area.place(this, this.tx, this.ty);
            Sfx.play('appear'); Fx.poof(this.tx * T + 8, this.ty * T + 8); Fx.sparkle(this.tx * T + 8, this.ty * T + 4, PAL.yellow);
        }
    }
    interact(p) {
        if (this.opened || this.hidden) return false;
        this.opened = true;
        Progress.setAreaFlag(this.area.id, 'chest:' + this.id);
        Sfx.play('chest');
        Script.run(Story.getItem(this.item));
        return true;
    }
    sprite() { return this.hidden ? null : spr(this.opened ? 'chest_open' : this.big ? 'chest_big' : 'chest'); }
}

/* ---------- signs and other things you read ---------- */
class Sign extends GridThing {
    constructor(tx, ty, props = {}) { super('sign', tx, ty, Object.assign({ weight: WEIGHT.fixed, fixed: true, marked: false }, props)); }
    interact() { Script.run(function* () { yield* say(null, this.text); }.bind(this)); return true; }
    sprite() { return this.look === 'none' ? null : spr(this.look || 'sign'); }
}

/* ---------- pickups lying about (hearts, buttons, keys, heart patches) ---------- */
class Pickup extends Ent {
    constructor(x, y, props = {}) {
        super('pickup', props);
        this.x = x; this.y = y; this.t = 0; this.z = props.z || 0; this.vz = props.vz || 0;
        this.what = props.what || 'heart';
        this.life = props.life || 0;   /* 0: stays */
    }
    onAdd(area) { if (this.id && Progress.areaFlag(area.id, 'got:' + this.id)) area.remove(this); }
    update() {
        this.t++;
        if (this.vz || this.z > 0) { this.z += this.vz; this.vz -= 0.25; if (this.z <= 0) { this.z = 0; this.vz = this.vz < -1.5 ? -this.vz * 0.4 : 0; } }
        if (this.life && this.t > this.life) { this.area.remove(this); return; }
        const p = G.player;
        if (p && p.area === this.area && !p.dead && this.t > 10 && dist(p.x, p.y - 4, this.x + 8, this.y + 8) < 11) this.collect(p);
    }
    collect(p) {
        this.area.remove(this);
        if (this.id) Progress.setAreaFlag(this.area.id, 'got:' + this.id);
        Inv.pickup(this.what, this);
    }
    get sortY() { return this.y + 12; }
    draw(cx, cy) {
        if (this.life && this.t > this.life - 60 && (this.t >> 2) % 2) return;
        const im = spr(PICKUP_SPRITE[this.what] || this.what);
        const bob = this.what === 'heartpatch' || this.what === 'key' ? Math.sin(this.t / 12) * 1.5 : 0;
        if (this.z > 0 || bob) Gfx.rect(this.x - cx + 5, this.y - cy + 13, 6, 2, 'rgba(0,0,0,0.25)');
        Gfx.img(im, this.x - cx, this.y - cy - this.z + bob - 2);
    }
}
const PICKUP_SPRITE = { heart: 'heart', b1: 'button1', b5: 'button5', b20: 'button20', key: 'key', heartpatch: 'heartpatch', heartstitch: 'heart' };

/* plain props that just stand there (a decoration with an optional collision box) */
class Prop extends Ent {
    constructor(tx, ty, props = {}) {
        super('prop', props);
        this.tx = tx; this.ty = ty; this.x = tx * T + (props.ox || 0); this.y = ty * T + (props.oy || 0);
        this.solid = props.solid || [];     /* tiles it blocks, relative [dx,dy] */
        this.staticBlock = !props.moves;    /* fixed props block through the area's tile map, not a list */
        this.inert = !props.live;
    }
    blocks(x, y) { return this.solid.some(([dx, dy]) => this.tx + dx === x && this.ty + dy === y); }
    get sortY() { return this.y + (this.baseY !== undefined ? this.baseY : (this.im ? this.im.height : 16)); }
    draw(cx, cy) {
        const im = this.im || spr(this.look);
        if (im) Gfx.img(im, this.x - cx, this.y - cy, this.flip);
    }
}

// ---- 09_audio.js ----
/* Sound: a little chiptune synthesizer. Two pulse voices, a triangle, noise. Songs are written in a
   tracker shorthand (one token a step: "C4", "-" hold, "." rest; drums "k" kick, "s" snare, "h" hat).
   Sound effects are small recipes. Everything is silent headless and until the first key press. */

const Audio = {
    ctx: null, master: null, music: null, sfx: null, ok: false,
    vol: { music: 0.6, sfx: 0.8 },
    waves: {},
    unlock() {
        if (HEADLESS) return;
        if (!this.ctx) {
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AC();
                this.master = this.ctx.createGain(); this.master.gain.value = 0.5; this.master.connect(this.ctx.destination);
                this.music = this.ctx.createGain(); this.music.connect(this.master);
                this.sfx = this.ctx.createGain(); this.sfx.connect(this.master);
                this.setVolumes();
                /* pulse waves with narrow duty */
                for (const [name, duty] of [['p12', 0.125], ['p25', 0.25], ['p50', 0.5]]) {
                    const n = 64, re = new Float32Array(n), im = new Float32Array(n);
                    for (let i = 1; i < n; i++) im[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * duty);
                    this.waves[name] = this.ctx.createPeriodicWave(re, im);
                }
                const len = this.ctx.sampleRate;
                this.noise = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
                const d = this.noise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
                this.ok = true;
            } catch (e) { this.ok = false; }
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },
    setVolumes() {
        if (!this.ctx) return;
        this.music.gain.value = this.vol.music * 0.55;
        this.sfx.gain.value = this.vol.sfx * 0.7;
    },
    /* one tone */
    tone(out, t, f, dur, wave = 'p50', v = 0.2, opts = {}) {
        const c = this.ctx;
        const o = c.createOscillator(), g = c.createGain();
        if (this.waves[wave]) o.setPeriodicWave(this.waves[wave]); else o.type = wave;
        o.frequency.setValueAtTime(f, t);
        if (opts.slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.slide), t + dur);
        if (opts.vib) { const l = c.createOscillator(), lg = c.createGain(); l.frequency.value = 5.5; lg.gain.value = f * 0.012; l.connect(lg); lg.connect(o.frequency); l.start(t + 0.08); l.stop(t + dur + 0.05); }
        const a = opts.a || 0.005, rel = opts.r !== undefined ? opts.r : Math.min(0.08, dur * 0.4);
        g.gain.setValueAtTime(0, t);
        g.gain.linearRampToValueAtTime(v, t + a);
        g.gain.setValueAtTime(v * (opts.sus || 0.85), t + Math.max(a, dur - rel));
        g.gain.linearRampToValueAtTime(0, t + dur);
        o.connect(g); g.connect(out);
        o.start(t); o.stop(t + dur + 0.02);
    },
    hit(out, t, dur, v, hp = 1000, lp = 8000) {
        const c = this.ctx, s = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter(), f2 = c.createBiquadFilter();
        s.buffer = this.noise; f.type = 'highpass'; f.frequency.value = hp; f2.type = 'lowpass'; f2.frequency.value = lp;
        g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
        s.connect(f); f.connect(f2); f2.connect(g); g.connect(out);
        s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
    },
};

const NOTE_I = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
function noteFreq(tok) {
    const m = /^([A-G][#b]?)(\d)$/.exec(tok);
    if (!m) return 0;
    const n = NOTE_I[m[1]] + (parseInt(m[2]) + 1) * 12;
    return 440 * Math.pow(2, (n - 69) / 12);
}
