const Sfx = {
    last: {},
    play(name, vol = 1) {
        if (!Audio.ok || !SFX[name]) return;
        const now = Audio.ctx.currentTime;
        if (this.last[name] && now - this.last[name] < 0.03) return;
        this.last[name] = now;
        try { SFX[name](Audio.sfx, now); } catch (e) { }
    },
};

/* ---------- music ---------- */
const SONGS = {};
const Music = {
    cur: null, next: 0, step: 0, timer: null, fade: 1, playing: null,
    play(id) {
        if (this.playing === id) return;
        this.playing = id;
        this.cur = SONGS[id] || null;
        this.step = 0;
        if (!Audio.ok) return;
        this.next = Audio.ctx.currentTime + 0.1;
        if (this.cur && !this.cur._parsed) parseSong(this.cur);
    },
    stop() { this.playing = null; this.cur = null; },
    /* called every frame: schedule what's due in the next 0.15 s */
    tick() {
        if (!Audio.ok || !this.cur) return;
        const s = this.cur;
        if (!s._parsed) parseSong(s);
        const stepDur = 60 / s.bpm / (s.div || 4);
        const ctx = Audio.ctx;
        if (this.next < ctx.currentTime - 0.5) this.next = ctx.currentTime + 0.05;
        while (this.next < ctx.currentTime + 0.15) {
            const i = this.step % s.len;
            for (const ch of s._ch) {
                const ev = ch.ev[i % ch.ev.length];
                if (!ev) continue;
                if (ch.drum) {
                    const o = Audio.music;
                    if (ev === 'k') Audio.tone(o, this.next, 150, 0.12, 'triangle', ch.vol * 1.6, { slide: 45 });
                    else if (ev === 's') { Audio.hit(o, this.next, 0.12, ch.vol, 1200, 7000); Audio.tone(o, this.next, 220, 0.05, 'triangle', ch.vol * 0.6); }
                    else if (ev === 'h') Audio.hit(o, this.next, 0.03, ch.vol * 0.5, 6000, 12000);
                    else if (ev === 'H') Audio.hit(o, this.next, 0.12, ch.vol * 0.4, 5000, 12000);
                } else {
                    Audio.tone(Audio.music, this.next, ev.f, ev.n * stepDur * (ch.legato || 0.92), ch.wave, ch.vol, { vib: ch.vib && ev.n >= 4, a: ch.attack || 0.006, r: ch.rel });
                }
            }
            this.step++;
            this.next += stepDur;
        }
    },
};
function parseSong(s) {
    s._ch = s.ch.map(c => {
        const toks = c.n.replace(/\|/g, ' ').trim().split(/\s+/);
        const ev = new Array(toks.length).fill(null);
        if (c.drum) { toks.forEach((t, i) => { if (t !== '.' && t !== '-') ev[i] = t; }); }
        else {
            for (let i = 0; i < toks.length; i++) {
                const t = toks[i];
                if (t === '.' || t === '-') continue;
                let n = 1; while (toks[i + n] === '-') n++;
                const tr = c.tr || 0;
                const f = noteFreq(t) * Math.pow(2, tr / 12);
                if (f) ev[i] = { f, n };
            }
        }
        return Object.assign({}, c, { ev });
    });
    s.len = s.len || Math.max(...s._ch.map(c => c.ev.length));
    s._parsed = true;
}

// ---- 10_fx.js ----
/* Little effects: dust, sparkles, poofs, splashes, rings, floating text. Cheap particles in world space. */

const Fx = {
    list: [],
    clear() { this.list = []; },
    add(p) { if (!HEADLESS) this.list.push(p); return p; },
    dust(x, y) {
        for (let i = 0; i < 4; i++) this.add({ x: x + (Math.random() - 0.5) * 8, y: y + (Math.random() - 0.5) * 3, vx: (Math.random() - 0.5) * 0.6, vy: -Math.random() * 0.4, life: 18 + Math.random() * 8, col: 'rgba(240,230,210,0.8)', r: 1.5 });
    },
    sparkle(x, y, col = '#fff6c0') {
        for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; this.add({ x, y, vx: Math.cos(a) * 0.9, vy: Math.sin(a) * 0.9, life: 16, col, r: 1, star: true }); }
    },
    poof(x, y) {
        for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; this.add({ x, y, vx: Math.cos(a) * 0.7, vy: Math.sin(a) * 0.5, life: 20, col: 'rgba(250,245,235,0.9)', r: 2.5, grow: -0.08 }); }
    },
    splash(x, y) {
        for (let i = 0; i < 8; i++) this.add({ x, y, vx: (Math.random() - 0.5) * 1.6, vy: -Math.random() * 1.8, g: 0.12, life: 24, col: '#bfe8fb', r: 1.2 });
        this.add({ x, y, life: 20, ring: 2, col: '#e4f6ff' });
    },
    ring(x, y, col = '#ffffff') { this.add({ x, y, life: 16, ring: 1, col }); },
    burst(x, y, col) {
        for (let i = 0; i < 10; i++) { const a = Math.random() * Math.PI * 2, s = 0.6 + Math.random() * 1.4; this.add({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 22, col, r: 1.5, grow: -0.05 }); }
    },
    yarn(x, y, col) {
        for (let i = 0; i < 12; i++) { const a = Math.random() * Math.PI * 2; this.add({ x, y, vx: Math.cos(a) * 1.2, vy: Math.sin(a) * 1.2 - 0.5, g: 0.05, life: 26, col, r: 1, curl: true }); }
    },
    text(x, y, s, col = PAL.white) { this.add({ x, y, vy: -0.5, life: 50, text: s, col }); },
    /* a sprite shrinking into a pit */
    fallAt(x, y, im) { if (im) this.add({ x, y, life: 24, im, fall: true }); },
    update() {
        for (const p of this.list) {
            p.life--;
            if (p.vx) p.x += p.vx;
            if (p.vy) p.y += p.vy;
            if (p.g) p.vy += p.g;
            if (p.grow && p.r) p.r = Math.max(0.3, p.r + p.grow);
        }
        this.list = this.list.filter(p => p.life > 0);
    },
    draw(cx, cy) {
        for (const p of this.list) {
            const x = p.x - cx, y = p.y - cy;
            if (p.text) { Font.center(p.text, x, y, p.col, PAL.ink); continue; }
            if (p.fall) {
                const k = p.life / 24, im = p.im;
                if (HEADLESS || !im) continue;
                const w = Math.max(1, Math.round(im.width * k)), h = Math.max(1, Math.round(im.height * k));
                Gfx.ctx.globalAlpha = k;
                Gfx.ctx.drawImage(im, Math.round(x + (im.width - w) / 2), Math.round(y + (im.height - h) / 2 + (1 - k) * 4), w, h);
                Gfx.ctx.globalAlpha = 1;
                continue;
            }
            if (p.ring) {
                const r = (20 - p.life) * (p.ring === 2 ? 0.6 : 0.9) + 2;
                Gfx.alpha(Math.max(0, p.life / 20));
                for (let a = 0; a < 16; a++) { const t = a / 16 * Math.PI * 2; Gfx.rect(x + Math.cos(t) * r, y + Math.sin(t) * r * 0.6, 1, 1, p.col); }
                Gfx.alpha(1);
                continue;
            }
            if (p.star) {
                Gfx.rect(x, y, 1, 1, p.col);
                if (p.life > 8) { Gfx.rect(x - 1, y, 3, 1, p.col); Gfx.rect(x, y - 1, 1, 3, p.col); }
                continue;
            }
            const r = p.r || 1;
            if (r <= 1.2) Gfx.rect(x, y, 1, 1, p.col);
            else Gfx.circle(x, y, Math.round(r), p.col);
        }
    },
};

// ---- 11_player.js ----
/* Wren: walking, pushing, pulling, lifting and throwing, the stick, tools, getting hurt, and Wren's own
   thread: Wren has a mark too, and falls, sinking and the fog send Wren flying back along their trace. */

const PSPEED = 1.3;
const PBOX = { hw: 5, hh: 4 };          /* half the hitbox at Wren's feet */

class Player extends Ent {
    constructor(x, y) {
        super('player');
        this.x = x; this.y = y;
        this.dir = DOWN; this.anim = 0; this.walking = false;
        this.state = 'normal'; this.stateT = 0;
        this.pushT = 0; this.pushDir = -1;
        this.carry = null; this.grip = null;
        this.inv = 0;                 /* invulnerable frames */
        this.kx = 0; this.ky = 0;     /* knockback */
        this.mark = null; this.trace = [];
        this.weightN = WEIGHT.medium;
        this.swingT = 0; this.flight = null; this.fogT = 0; this.stillT = 0;
        this.shove = null;
        this.hop = null;
    }
    get sortY() { return this.y + 2; }
    get tx() { return tileOf(this.x); }
    get ty() { return tileOf(this.y); }
    /* does the hitbox overlap a tile? */
    onTile(x, y) {
        if (this.flying || this.dead) return false;
        const x0 = this.x - PBOX.hw, x1 = this.x + PBOX.hw - 0.01, y0 = this.y - PBOX.hh, y1 = this.y + PBOX.hh - 0.01;
        return x * T < x1 && (x + 1) * T > x0 && y * T < y1 && (y + 1) * T > y0;
    }
    feetOn(x, y) { return !this.flying && tileOf(this.x) === x && tileOf(this.y) === y; }
    get flying() { return this.state === 'flight' || this.state === 'hop'; }
    get busy() { return this.state !== 'normal' || Script.blocking(); }

    /* ----- marks and traces ----- */
    setMark(tx = this.tx, ty = this.ty, area = this.area) {
        this.mark = { area: area.id, tx, ty };
        this.trace = [[tx, ty]];
    }
    traceStep() {
        const tx = this.tx, ty = this.ty, tr = this.trace;
        const last = tr[tr.length - 1];
        if (last && last[0] === tx && last[1] === ty) return;
        let cut = -1;
        for (let i = tr.length - 1; i >= 0; i--) if (tr[i][0] === tx && tr[i][1] === ty) { cut = i; break; }
        if (cut >= 0) tr.length = cut + 1; else tr.push([tx, ty]);
        if (tr.length > 600) tr.splice(1, tr.length - 600);
        /* what Wren carries goes the same way */
        if (this.carry) Return.moved(this.carry, tx, ty);
        Stats.stepped(this.area, tx, ty);
    }

    /* ----- collision ----- */
    solidAt(tx, ty, forMove) {
        const a = this.area;
        if (!a.inside(tx, ty)) return true;
        const k = a.kind(tx, ty);
        if (k.solid) return true;
        if (k.ledge) return true;
        if (k.deep && !this.canSwim()) {
            const o = a.at(tx, ty);
            if (!(o && o.floats && o.rideable)) return true;
        }
        const o = a.at(tx, ty);
        if (o && o !== this.carry && !o.walkOn) return true;
        for (const b of a.blockers) if (b.blocks(tx, ty, this)) return true;
        return false;
    }
    canSwim() { return false; }
    boxFree(x, y) {
        const x0 = tileOf(x - PBOX.hw), x1 = tileOf(x + PBOX.hw - 0.01), y0 = tileOf(y - PBOX.hh), y1 = tileOf(y + PBOX.hh - 0.01);
        for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (this.solidAt(tx, ty)) return false;
        return true;
    }
    moveAxis(dx, dy) {
        const nx = this.x + dx, ny = this.y + dy;
        if (this.boxFree(nx, ny)) { this.x = nx; this.y = ny; return true; }
        /* slide round corners */
        if (dx !== 0 && dy === 0) {
            for (const s of [1, -1]) for (let o = 1; o <= 6; o++) if (this.boxFree(nx, this.y + s * o) && this.boxFree(this.x, this.y + s * Math.min(o, 1))) { this.y += s * Math.min(1, Math.abs(dx)); return false; }
        } else if (dy !== 0 && dx === 0) {
            for (const s of [1, -1]) for (let o = 1; o <= 6; o++) if (this.boxFree(this.x + s * o, ny) && this.boxFree(this.x + s * Math.min(o, 1), this.y)) { this.x += s * Math.min(1, Math.abs(dy)); return false; }
        }
        /* a ledge below: hop down */
        if (dy > 0 && dx === 0) {
            const tx = tileOf(this.x), ty = tileOf(this.y + PBOX.hh + dy);
            if (this.area.kind(tx, ty).ledge && Math.abs(this.x - (tx * T + 8)) < 6) this.startHop(tx, ty);
        }
        return false;
    }
    /* the thing (grid) right in front of Wren */
    front(dist = 1) {
        const tx = tileOf(this.x + DX[this.dir] * (PBOX.hw + 3)), ty = tileOf(this.y + DY[this.dir] * (PBOX.hh + 4));
        return { tx: tx + DX[this.dir] * (dist - 1), ty: ty + DY[this.dir] * (dist - 1) };
    }
    thingInFront() {
        const f = this.front();
        return this.area.at(f.tx, f.ty);
    }

    /* ----- each step ----- */
    update() {
        if (this.inv > 0) this.inv--;
        this.stateT++;
        switch (this.state) {
            case 'flight': return this.updateFlight();
            case 'fall': return this.updateFall();
            case 'hop': return this.updateHop();
            case 'faint': return;
        }
        if (this.shove) return this.updateShove();
        if (this.kx || this.ky) {
            this.moveAxis(this.kx, 0); this.moveAxis(0, this.ky);
            this.kx *= 0.78; this.ky *= 0.78;
            if (Math.abs(this.kx) < 0.15) this.kx = 0; if (Math.abs(this.ky) < 0.15) this.ky = 0;
        }
        const cut = Script.blocking() || UI.modal();
        const ax = cut ? { x: 0, y: 0 } : Input.axis();
        if (this.swingT > 0) this.updateSwing();
        if (this.toolT > 0) { this.toolT--; if (Tools.busy(this)) { this.afterMove(); return; } }

        /* grip (Gloves): hold the action button against a thing */
        if (!cut && this.grip) {
            if (!Input.down('act') || this.grip.removed || !this.adjacentTo(this.grip)) this.release();
        }
        let moving = false;
        if (this.state === 'normal' && this.swingT <= 0 && (ax.x || ax.y)) {
            if (this.grip) {
                moving = this.gripMove(ax);
            } else {
                /* facing: keep it if one of the pressed directions matches */
                const dirs = [];
                if (ax.x < 0) dirs.push(LEFT); if (ax.x > 0) dirs.push(RIGHT); if (ax.y < 0) dirs.push(UP); if (ax.y > 0) dirs.push(DOWN);
                if (!dirs.includes(this.dir)) this.dir = dirs[0];
                let sp = PSPEED * (this.carry ? 0.92 : 1) * (this.area.kind(this.tx, this.ty).slow ? 0.6 : 1);
                if (ax.x && ax.y) sp *= 0.7071;
                const bx = this.x, by = this.y;
                this.moveAxis(ax.x * sp, 0);
                this.moveAxis(0, ax.y * sp);
                moving = Math.abs(this.x - bx) + Math.abs(this.y - by) > 0.05;
                /* pushing: walking straight into a thing */
                const card = (ax.x === 0) !== (ax.y === 0);
                if (card && !moving && !this.carry) this.tryPush(this.dir);
                else { this.pushT = 0; }
            }
        } else this.pushT = 0;
        this.walking = moving;
        if (moving) { this.anim++; this.stillT = 0; } else { this.anim = 0; this.stillT++; }

        if (!cut && this.state === 'normal') {
            if (Input.pressed('act')) this.action();
            else if (Input.down('act') && !this.grip && !this.carry && Inv.has('gloves')) this.tryGrip();
            if (Input.pressed('atk') && !this.carry && this.swingT <= 0 && !this.grip) this.startSwing();
            if (Input.pressed('tool') && !this.grip) Tools.use(this);
            if (Input.down('tool')) Tools.hold(this); else Tools.unhold(this);
        }
        this.afterMove();
    }
    afterMove() {
        if (this.state !== 'normal') return;
        this.traceStep();
        const k = this.area.kind(tileOf(this.x), tileOf(this.y));
        /* standing over a pit: fall */
        if (k.pit && this.overPit()) this.startFall('pit');
        else if (k.deep && !this.onRaft()) this.startFall('water');
        if (k.hurt && this.inv <= 0) this.hurt(1, this.x - DX[this.dir] * 8, this.y - DY[this.dir] * 8);
        /* the fog at the edge of the valley */
        if (k.fog && !Progress.flag('cut_self')) {
            this.fogT++;
            if (this.fogT === 1) Sfx.play('tug');
            if (this.fogT > 40) { this.fogT = 0; Story.fogPull(this); }
        } else this.fogT = 0;
        if (this.carry) { this.carry.cx = this.x; this.carry.cy = this.y - 14; }
    }
    overPit() {
        /* most of the feet over a pit */
        const pts = [[-3, -2], [3, -2], [-3, 3], [3, 3]];
        let n = 0; for (const [dx, dy] of pts) if (this.area.kind(tileOf(this.x + dx), tileOf(this.y + dy)).pit) n++;
        return n >= 3;
    }
    onRaft() { const o = this.area.at(this.tx, this.ty); return o && o.floats && o.rideable; }

    tryPush(d) {
        const f = this.front();
        const o = this.area.at(f.tx, f.ty);
        if (!o || o.fixed || !o.isGrid) {
            this.pushT = 0;
            /* a locked door */
            for (const b of this.area.blockers) if (b.tryUnlock && b.blocks(f.tx, f.ty)) { if (!this._knock || G.t - this._knock > 40) { this._knock = G.t; b.tryUnlock(this); } }
            return;
        }
        /* roughly lined up with it */
        const off = (d === LEFT || d === RIGHT) ? Math.abs(this.y - (o.ty * T + 8)) : Math.abs(this.x - (o.tx * T + 8));
        if (off > 7) { this.pushT = 0; return; }
        if (this.pushDir !== d) { this.pushT = 0; this.pushDir = d; }
        this.pushT++;
        this.pushing = true;
        const need = o.weight >= WEIGHT.heavy ? 18 : 12;
        if (this.pushT >= need) {
            this.pushT = 0;
            if (o.onPushed && o.onPushed(this, d) === false) return;
            if (o.noPush) { if (o.pushLine) UI.toast(o.pushLine); return; }
            if (!o.push(d, o.weight >= WEIGHT.heavy ? 20 : 16)) { if (o.ret) Sfx.play('push'); }
            else Stats.count('pushes');
        }
    }

    adjacentTo(o) { const f = this.front(); return o.tx === f.tx && o.ty === f.ty; }
    tryGrip() {
        const o = this.thingInFront();
        if (!o || o.fixed || o.noGrip) return;
        this.grip = o; o.heldBy = this;
        Sfx.play('click');
    }
    release() { if (this.grip) { this.grip.heldBy = null; if (this.grip.ret) Return.disturb(this.grip); } this.grip = null; }
    /* while gripping: back away to pull it, push into it to push it */
    gripMove(ax) {
        const o = this.grip;
        const back = OPP[this.dir];
        const want = ax.x < 0 ? LEFT : ax.x > 0 ? RIGHT : ax.y < 0 ? UP : DOWN;
        if (want === back && !o.mv && !this.pullT) {
            /* step back a tile, the thing follows */
            const bx = this.x + DX[back] * T, by = this.y + DY[back] * T;
            const tx = tileOf(this.x), ty = tileOf(this.y);
            if (!this.solidAt(tx + DX[back], ty + DY[back]) && !o.fixed && !o.noPull) {
                const dest = { x: o.tx + DX[back], y: o.ty + DY[back] };
                /* the thing moves into where Wren stands */
                const a = this.area;
                if (!a.kind(dest.x, dest.y).solid) {
                    this.pullT = 18;
                    this.pullFrom = { x: this.x, y: this.y, tx: tileOf(this.x) * T + 8 + DX[back] * T, ty: tileOf(this.y) * T + 8 + DY[back] * T };
                    o.startMove(dest.x, dest.y, 18);
                    Sfx.play('push'); Stats.count('pulls');
                }
            }
        }
        if (this.pullT) {
            this.pullT--;
            const k = 1 - this.pullT / 18;
            this.x = lerp(this.pullFrom.x, this.pullFrom.tx, k); this.y = lerp(this.pullFrom.y, this.pullFrom.ty, k);
            if (this.pullT === 0) { this.x = this.pullFrom.tx; this.y = this.pullFrom.ty; }
            return true;
        }
        if (want === this.dir) { this.tryPush(this.dir); }
        return false;
    }

    action() {
        if (this.carry) return this.throwCarry();
        const f = this.front();
        const a = this.area;
        /* townsfolk, signs, chests, anything that talks or opens */
        const cand = [];
        const o = a.at(f.tx, f.ty);
        if (o) cand.push(o);
        for (const e of a.ents) if (e !== o && e.interact && e.talkBox && e.talkBox(this, f)) cand.push(e);
        for (const e of cand) {
            if (e.interact && e.interact(this) !== false) { Stats.count('interactions'); return; }
        }
        if (o && o.liftable && !o.mv) return this.lift(o);
        if (o && Inv.has('gloves')) this.tryGrip();
    }
    lift(o) {
        const a = this.area;
        a.unplace(o, o.tx, o.ty);
        o.carried = true; o.heldBy = this;
        this.carry = o;
        o.cx = this.x; o.cy = this.y - 14;
        Return.moved(o, this.tx, this.ty);
        Sfx.play('lift');
        this.liftT = 8;
        if (o.onLift) o.onLift(this);
    }
    throwCarry() {
        const o = this.carry; this.carry = null;
        o.carried = false; o.heldBy = null;
        Thrown.start(o, this, this.dir);
        Sfx.play('throw');
    }
    /* drop what's carried (cutscenes, falls) */
    dropCarry() {
        const o = this.carry; if (!o) return;
        this.carry = null; o.carried = false; o.heldBy = null;
        if (o.ret) { Return.sendHome(o); }
        else { o.tx = this.tx; o.ty = this.ty; this.area.place(o, o.tx, o.ty); }
    }

    /* ----- the stick ----- */
    startSwing() {
        this.swingT = 16; Sfx.play('swing'); this.swingHit = new Set();
        Stats.count('swings');
    }
    swingBox() {
        const d = this.dir, cx = this.x + DX[d] * 12, cy = this.y - 3 + DY[d] * 11;
        return { x0: cx - 8, y0: cy - 8, x1: cx + 8, y1: cy + 8 };
    }
    updateSwing() {
        this.swingT--;
        if (this.swingT > 12 || this.swingT < 4) return;
        const b = this.swingBox(), a = this.area;
        /* things on the grid */
        for (let ty = tileOf(b.y0); ty <= tileOf(b.y1); ty++) for (let tx = tileOf(b.x0); tx <= tileOf(b.x1); tx++) {
            const o = a.at(tx, ty);
            if (o && !this.swingHit.has(o)) {
                const cx = tx * T + 8, cy = ty * T + 8;
                if (cx < b.x0 || cx > b.x1 || cy < b.y0 || cy > b.y1) continue;
                this.swingHit.add(o);
                if (o.hit) o.hit(this, this.dir);
                else if (o.weight <= WEIGHT.light && !o.fixed && !o.mv) { o.push(this.dir, 8); Sfx.play('hitthing'); }
                else if (o.onStruck) o.onStruck(this);
                else if (o.ret || o.fixed) { Sfx.play('hitthing'); Fx.dust(cx, cy); }
            }
        }
        for (const e of a.ents) {
            if (this.swingHit.has(e) || !e.hurtBox) continue;
            const h = e.hurtBox();
            if (h && h.x0 < b.x1 && h.x1 > b.x0 && h.y0 < b.y1 && h.y1 > b.y0) { this.swingHit.add(e); e.struck(this, 1, this.dir); }
        }
    }

    /* ----- being hurt, falling, flying home ----- */
    hurt(n, fx, fy) {
        if (this.inv > 0 || this.flying || this.state === 'faint' || G.cheats.god) return;
        Inv.hp = Math.max(0, Inv.hp - n);
        this.inv = 70;
        const d = Math.hypot(this.x - fx, this.y - fy) || 1;
        this.kx = (this.x - fx) / d * 3.2; this.ky = (this.y - fy) / d * 3.2;
        Sfx.play('hurt'); G.shake = 6; G.hitstop = 4;
        Stats.count('hits');
        if (this.grip) this.release();
        if (Inv.hp <= 0) this.faint();
    }
    faint() {
        if (this.carry) this.dropCarry();
        this.state = 'faint'; this.stateT = 0;
        Stats.count('faints');
        Script.run(Story.faint());
    }
    startFall(why) {
        if (this.state !== 'normal') return;
        if (this.carry) this.dropCarry();
        if (this.grip) this.release();
        this.state = 'fall'; this.stateT = 0; this.fallWhy = why;
        Sfx.play(why === 'water' ? 'splash' : 'fall');
        if (why === 'water') Fx.splash(this.x, this.y);
        Stats.count(why === 'water' ? 'sinks' : 'falls');
    }
    updateFall() {
        if (this.stateT >= 26) {
            Inv.hp = Math.max(0, Inv.hp - 1);
            if (Inv.hp <= 0) { this.faint(); return; }
            this.flyHome();
        }
    }
    /* fly back along the trace to the mark */
    flyHome(opts = {}) {
        const pts = this.trace.slice().reverse().map(([x, y]) => [x * T + 8, y * T + 10]);
        if (!pts.length || !this.mark || this.mark.area !== this.area.id) {
            const m = this.mark;
            this.state = 'normal';
            if (m) { this.x = m.tx * T + 8; this.y = m.ty * T + 10; }
            return;
        }
        pts.unshift([this.x, this.y]);
        let len = 0; for (let i = 1; i < pts.length; i++) len += dist(pts[i - 1][0], pts[i - 1][1], pts[i][0], pts[i][1]);
        const dur = opts.dur || clamp(Math.round(len / 4.5), 24, 110);
        this.flight = { pts, len, dur, t: 0, opts };
        this.state = 'flight'; this.stateT = 0;
        Sfx.play('flight');
    }
    updateFlight() {
        const f = this.flight;
        f.t++;
        const k = f.t / f.dur, want = k * f.len;
        let acc = 0;
        for (let i = 1; i < f.pts.length; i++) {
            const [ax, ay] = f.pts[i - 1], [bx, by] = f.pts[i], seg = dist(ax, ay, bx, by);
            if (acc + seg >= want || i === f.pts.length - 1) {
                const u = seg ? clamp((want - acc) / seg, 0, 1) : 1;
                this.x = lerp(ax, bx, u); this.y = lerp(ay, by, u);
                f.seg = i;
                break;
            }
            acc += seg;
        }
        if (f.t >= f.dur) {
            const m = this.mark;
            this.x = m.tx * T + 8; this.y = m.ty * T + 10;
            this.state = 'normal'; this.inv = 40; this.flight = null;
            this.trace = [[m.tx, m.ty]];
            Sfx.play('land'); Fx.dust(this.x, this.y);
            if (f.opts.then) f.opts.then();
        }
    }
    startHop(tx, ty) {
        /* land on the first open tile below the ledge */
        let ly = ty + 1;
        while (this.area.kind(tx, ly).ledge) ly++;
        this.hop = { fx: this.x, fy: this.y, tx: this.x, ty: ly * T + 8, t: 0, dur: 22 };
        this.state = 'hop'; this.stateT = 0; Sfx.play('lift');
    }
    updateHop() {
        const h = this.hop; h.t++;
        const k = h.t / h.dur;
        this.x = lerp(h.fx, h.tx, k); this.y = lerp(h.fy, h.ty, k);
        this.z = Math.sin(k * Math.PI) * 10;
        if (h.t >= h.dur) { this.z = 0; this.state = 'normal'; Sfx.play('land'); Fx.dust(this.x, this.y); this.hop = null; }
    }
    canBeShoved(d) {
        if (this.flying || this.state !== 'normal') return false;
        const nx = this.x + DX[d] * T, ny = this.y + DY[d] * T;
        /* shoved into anything but a wall (pits and water are fair game) */
        const tx = tileOf(nx), ty = tileOf(ny), k = this.area.kind(tx, ty);
        if (k.solid && !k.deep) return false;
        const o = this.area.at(tx, ty); if (o && o !== this.carry) return false;
        for (const b of this.area.blockers) if (b.blocks(tx, ty, this)) return false;
        return true;
    }
    shoved(d, dur) {
        this.shove = { fx: this.x, fy: this.y, tx: this.x + DX[d] * T, ty: this.y + DY[d] * T, t: 0, dur };
        if (this.grip) this.release();
        Sfx.play('hurt');
    }
    updateShove() {
        const s = this.shove; s.t++;
        this.x = lerp(s.fx, s.tx, s.t / s.dur); this.y = lerp(s.fy, s.ty, s.t / s.dur);
        if (s.t >= s.dur) { this.shove = null; this.afterMove(); }
    }

    /* ----- drawing ----- */
    sprite() {
        let fr = 0;
        if (this.walking) fr = [0, 1, 0, 2][Math.floor(this.anim / 8) % 4];
        if (this.carry || this.liftT > 0 || this.state === 'hold') {
            const d = this.dir === LEFT ? 'right' : this.dir === RIGHT ? 'right' : this.dir === UP ? 'up' : 'down';
            return { im: spr(`wren_lift_${d}`), flip: this.dir === LEFT };
        }
        if (this.state === 'flight') { const d = [DOWN, RIGHT, UP, LEFT][Math.floor(this.stateT / 4) % 4]; return { im: personFrame('wren', d, 0), flip: d === LEFT }; }
        if (this.state === 'faint' || this.state === 'sleep') return { im: spr('wren_sleep'), flip: false };
        return { im: personFrame('wren', this.dir, fr), flip: this.dir === LEFT };
    }
    draw(cx, cy) {
        if (this.hidden) return;
        if (this.liftT > 0) this.liftT--;
        if (this.state === 'fall') {
            const k = 1 - this.stateT / 26;
            const { im } = this.sprite();
            if (!HEADLESS && im && k > 0) {
                const w = Math.max(1, Math.round(16 * k));
                Gfx.ctx.globalAlpha = Math.max(0, k);
                Gfx.ctx.drawImage(im, Math.round(this.x - cx - w / 2), Math.round(this.y - cy - 12 * k + (1 - k) * 4), w, w);
                Gfx.ctx.globalAlpha = 1;
            }
            return;
        }
        if (this.inv > 0 && this.state === 'normal' && (this.inv >> 2) % 2 && this.inv < 69) return;
        const { im, flip } = this.sprite();
        const z = this.z || 0;
        /* shadow */
        Gfx.alpha(0.25); Gfx.rect(this.x - cx - 5, this.y - cy + 2, 10, 2, PAL.ink); Gfx.alpha(1);
        let sx = this.x - cx - 8, sy = this.y - cy - 13 - z;
        if (this.walking && (Math.floor(this.anim / 8) % 2)) sy -= 1;
        if (this.pushT > 3) sx += DX[this.dir] * 1;
        Gfx.img(im, sx, sy, flip);
        if (this.carry) {
            const c = this.carry, ci = c.sprite();
            if (ci) Gfx.img(ci, this.x - cx - 8, this.y - cy - 25 - z);
        }
        if (this.swingT > 0) this.drawStick(cx, cy);
    }
    drawStick(cx, cy) {
        /* the stick sweeps through an arc in front */
        const d = this.dir, k = 1 - this.swingT / 16;
        const base = { [DOWN]: Math.PI / 2, [UP]: -Math.PI / 2, [LEFT]: Math.PI, [RIGHT]: 0 }[d];
        const ang = base + (k - 0.5) * 2.0 * (d === LEFT || d === UP ? -1 : 1);
        const hx = this.x - cx + DX[d] * 3, hy = this.y - cy - 5 + DY[d] * 2;
        const ex = hx + Math.cos(ang) * 13, ey = hy + Math.sin(ang) * 13;
        Gfx.line(hx + 1, hy + 1, ex + 1, ey + 1, PAL.ink);
        Gfx.line(hx, hy, ex, ey, '#c08a50');
        Gfx.rect(ex - 1, ey - 1, 2, 2, PAL.ink);
        if (this.swingT > 6 && this.swingT < 12) { Gfx.alpha(0.5); Gfx.line(hx, hy, hx + Math.cos(ang - 0.4) * 12, hy + Math.sin(ang - 0.4) * 12, PAL.white); Gfx.alpha(1); }
    }
}

/* ---------- thrown things ---------- */
const Thrown = {
    list: [],
    start(o, p, d) {
        const t = { o, d, x: p.x, y: p.y - 12, z: 12, t: 0, dist: 0, max: 4 * T + 4, speed: 3.2, lastTx: p.tx, lastTy: p.ty };
        o.flying = true;
        this.list.push(t);
        Stats.count('throws');
    },
    update(area) {
        for (const t of this.list) {
            if (t.o.area !== area) { t.done = true; continue; }
            t.t++;
            const nx = t.x + DX[t.d] * t.speed, ny = t.y + DY[t.d] * t.speed;
            const tx = tileOf(nx), ty = tileOf(ny + 12);
            t.dist += t.speed;
            t.z = Math.max(0, 12 - Math.pow(t.dist / t.max, 2) * 12);
            /* walls and standing things stop it */
            const k = area.kind(tx, ty);
            let stop = (k.solid && !k.deep && !k.pit && !k.ledge) || !area.inside(tx, ty);
            const occ = area.at(tx, ty);
            if (occ && occ !== t.o) { stop = true; if (occ.hit) occ.hit(t.o, t.d); }
            for (const b of area.blockers) if (b.blocks(tx, ty)) stop = true;
            for (const e of area.ents) {
                if (!e.hurtBox || e === t.o) continue;
                const h = e.hurtBox();
                if (h && nx + 4 > h.x0 && nx - 4 < h.x1 && ny + 8 > h.y0 && ny < h.y1) { e.struck(t.o, 1, t.d); stop = true; }
            }
            if (!stop) {
                t.x = nx; t.y = ny;
                if (tx !== t.lastTx || ty !== t.lastTy) { t.lastTx = tx; t.lastTy = ty; Return.moved(t.o, tx, ty); }
            }
            if (stop || t.dist >= t.max) { t.done = true; this.land(t, area); }
        }
        this.list = this.list.filter(t => !t.done);
    },
    land(t, area) {
        const o = t.o;
        o.flying = false;
        const tx = t.lastTx, ty = t.lastTy;
        if (o.breaks) { Shards.start(o, tx, ty); return; }
        o.tx = tx; o.ty = ty; o.x = tx * T; o.y = ty * T;
        if (area.at(tx, ty) && area.at(tx, ty) !== o) {
            /* fall back to a free tile next to it */
            for (let d = 0; d < 4; d++) if (area.freeForThing(tx + DX[d], ty + DY[d], o)) { o.tx += DX[d]; o.ty += DY[d]; break; }
        }
        area.place(o, o.tx, o.ty);
        Sfx.play('land');
        if (o.ret) Return.moved(o, o.tx, o.ty);
        o.landed();
    },
    draw(cx, cy) {
        for (const t of this.list) {
            const im = t.o.sprite();
            Gfx.alpha(0.25); Gfx.rect(t.x - cx - 4, t.y - cy + 12, 8, 2, PAL.ink); Gfx.alpha(1);
            if (im) Gfx.img(im, t.x - cx - 8, t.y - cy - t.z);
        }
    },
};

/* ---------- shards: a broken thing flies home in pieces along its trace ---------- */
const Shards = {
    list: [],
    start(o, tx, ty) {
        const a = o.area;
        Sfx.play('shatter');
        Fx.burst(tx * T + 8, ty * T + 8, o.shardCol || '#d98f3a');
        Stats.count('shatters');
        if (!o.ret) { a.remove(o); return; }
        o.shattered = true;
        /* the way home: the trace reversed, from where it broke */
        Return.moved(o, tx, ty);
        const path = o.ret.trace.slice().reverse();
        this.list.push({ o, path, i: 0, t: 0, pace: 4, x: tx * T + 8, y: ty * T + 8, delay: 10 });
    },
    update(area) {
        for (const s of this.list) {
            if (s.o.area !== area) { s.done = true; this.reform(s); continue; }
            if (s.delay > 0) { s.delay--; continue; }
            s.t++;
            if (s.t >= s.pace) {
                s.t = 0; s.i++;
                if (s.i >= s.path.length) { this.reform(s); s.done = true; continue; }
                const [tx, ty] = s.path[s.i];
                this.strike(area, tx, ty, s);
            }
            const [ax, ay] = s.path[Math.max(0, s.i)], b = s.path[Math.min(s.path.length - 1, s.i + 1)];
            const k = s.t / s.pace;
            s.x = lerp(ax, b[0], k) * T + 8; s.y = lerp(ay, b[1], k) * T + 8;
        }
        this.list = this.list.filter(s => !s.done);
    },
    /* the pieces hit what's on the way at head height */
    strike(area, tx, ty, s) {
        const o = area.at(tx, ty);
        if (o && o !== s.o && o.hit) o.hit(s.o, -1, true);
        for (const e of area.ents) {
            if (!e.hurtBox) continue;
            const h = e.hurtBox();
            const cx = tx * T + 8, cy = ty * T + 8;
            if (h && cx + 6 > h.x0 && cx - 6 < h.x1 && cy + 6 > h.y0 && cy - 6 < h.y1) e.struck(s.o, 1, -1, true);
        }
        if (s.o.onShardTile) s.o.onShardTile(tx, ty);
    },
    reform(s) {
        const o = s.o;
        o.shattered = false;
        o.ret.trace = [[o.ret.mx, o.ret.my]];
        o.tx = o.ret.mx; o.ty = o.ret.my; o.x = o.tx * T; o.y = o.ty * T;
        o.ret.state = 'home';
        o.pendingHome = true;
    },
    draw(cx, cy) {
        for (const s of this.list) {
            if (s.delay > 0) continue;
            const col = s.o.shardCol || '#d98f3a';
            for (let i = 0; i < 5; i++) {
                const a = G.t * 0.3 + i * 1.3;
                Gfx.rect(s.x - cx + Math.cos(a) * 3, s.y - cy - 6 + Math.sin(a) * 2, 2, 2, i % 2 ? col : shade(col, -0.35));
            }
        }
    },
};

// ---- 12_camera.js ----
/* The camera follows Wren and keeps to the room Wren is in. Crossing into another room scrolls over
   (the world waits meanwhile) and gives Wren a new mark at the doorway. Outdoors the area is one room. */

const Cam = {
    x: 0, y: 0, room: null, trans: null,
    target(p, room) {
        const r = room || this.room;
        let x = p.x - W / 2, y = p.y - 6 - H / 2;
        const rx = r.x * T, ry = r.y * T, rw = r.w * T, rh = r.h * T;
        /* the HUD sits over the top 14 px of a room-sized room */
        const top = ry - (rh <= H ? (H - rh) / 2 : 0);
        if (rw <= W) x = rx - (W - rw) / 2; else x = clamp(x, rx, rx + rw - W);
        if (rh <= H) y = top; else y = clamp(y, ry, ry + rh - H);
        return { x: Math.round(x), y: Math.round(y) };
    },
    snap(p) {
        this.room = p.area.roomAt(p.tx, p.ty) || p.area.rooms[0];
        const t = this.target(p);
        this.x = t.x; this.y = t.y; this.trans = null;
    },
    update(p) {
        if (this.trans) {
            const tr = this.trans;
            tr.t++;
            const k = tr.t / tr.dur, e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
            this.x = Math.round(lerp(tr.fx, tr.tx, e)); this.y = Math.round(lerp(tr.fy, tr.ty, e));
            /* Wren steps on through the doorway */
            p.x = lerp(tr.px0, tr.px1, k); p.y = lerp(tr.py0, tr.py1, k);
            p.anim++; p.walking = true;
            if (tr.t >= tr.dur) {
                this.trans = null;
                p.setMark();
                Stats.enterRoom(p.area, this.room);
                if (G.onRoomEnter) G.onRoomEnter(p.area, this.room);
            }
            return;
        }
        if (p.state === 'flight' || p.state === 'faint') {
            const r = p.area.roomAt(p.tx, p.ty);
            if (r && r !== this.room) { this.room = r; }
        }
        const r = p.area.roomAt(p.tx, p.ty);
        if (r && r !== this.room && p.state === 'normal' && !Script.blocking()) {
            const from = this.room;
            this.room = r;
            const t = this.target(p, r);
            /* carry Wren a little way in so the doorway is behind */
            const dx = sign(Math.round(p.x / T - 0.5) - Math.round((from.x + from.w / 2))), dy = 0;
            const dirx = p.tx < r.x + 0.01 ? 0 : 0;
            let px1 = p.x, py1 = p.y;
            if (p.tx >= r.x && p.tx < r.x + r.w && (tileOf(p.x - DX[p.dir] * T) < r.x || tileOf(p.x - DX[p.dir] * T) >= r.x + r.w)) px1 = p.x + DX[p.dir] * 14;
            if (p.ty >= r.y && p.ty < r.y + r.h && (tileOf(p.y - DY[p.dir] * T) < r.y || tileOf(p.y - DY[p.dir] * T) >= r.y + r.h)) py1 = p.y + DY[p.dir] * 14;
            this.trans = { fx: this.x, fy: this.y, tx: t.x, ty: t.y, t: 0, dur: 34, px0: p.x, py0: p.y, px1, py1 };
            if (p.grip) p.release();
            return;
        }
        const t = this.target(p);
        /* outdoors, a gentle follow; indoors, exact */
        if (p.area.family === 'outdoor') {
            this.x = Math.round(lerp(this.x, t.x, 0.2)); this.y = Math.round(lerp(this.y, t.y, 0.2));
            if (Math.abs(this.x - t.x) < 1) this.x = t.x; if (Math.abs(this.y - t.y) < 1) this.y = t.y;
        } else { this.x = t.x; this.y = t.y; }
    },
    get busy() { return !!this.trans; },
};

// ---- 13_script.js ----
/* Scripts: cutscenes, conversations and events written as generator functions.
     Script.run(function* () { yield* say('Gran', 'Morning, love.'); yield 30; yield () => door.open; })
   A script yields a number (wait that many steps), a function (wait until it's true) or delegates to
   another script with yield*. While a blocking script runs, Wren doesn't take input. */

const Script = {
    list: [],
    run(fn, opts = {}) {
        const it = typeof fn === 'function' ? fn() : fn;
        const s = { it, wait: 0, until: null, blocking: opts.blocking !== false, name: opts.name || '', done: false, onDone: opts.onDone };
        this.list.push(s);
        this.step(s);
        return s;
    },
    blocking() { return this.list.some(s => s.blocking && !s.done); },
    running(name) { return this.list.some(s => s.name === name && !s.done); },
    update() {
        for (const s of this.list.slice()) if (!s.done) this.step(s);
        this.list = this.list.filter(s => !s.done);
    },
    step(s) {
        try {
            if (s.wait > 0) { s.wait--; return; }
            if (s.until) { if (!s.until()) return; s.until = null; }
            for (let guard = 0; guard < 1000; guard++) {
                const r = s.it.next(s.ret);
                s.ret = undefined;
                if (r.done) { s.done = true; if (s.onDone) s.onDone(r.value); return; }
                const v = r.value;
                if (typeof v === 'number') { if (v > 0) { s.wait = v - 1; return; } continue; }
                if (typeof v === 'function') { if (!v()) { s.until = v; return; } continue; }
                if (v && v.then) { return; }
                return;   /* bare yield: next step */
            }
        } catch (e) { reportError(e); s.done = true; }
    },
    clear() { this.list = []; },
};

/* ---- script helpers (use with yield*) ---- */
function* wait(n) { yield n; }
function* say(who, text, opts = {}) {
    const lines = Array.isArray(text) ? text : [text];
    for (const t of lines) {
        Dialog.open(who, t, opts);
        yield () => !Dialog.active;
    }
}
/* a question: returns the index picked */
function* ask(who, text, choices, opts = {}) {
    Dialog.open(who, text, Object.assign({}, opts, { choices }));
    yield () => !Dialog.active;
    return Dialog.picked;
}
function* fadeOut(n = 20) { UI.fade = { from: UI.fadeA, to: 1, t: 0, dur: n }; yield n; }
function* fadeIn(n = 20) { UI.fade = { from: UI.fadeA, to: 0, t: 0, dur: n }; yield n; }
/* walk a grid walker (townsfolk) or Wren to a tile */
function* walkTo(e, tx, ty, speed = 1) {
    if (e === G.player) {
        const p = e;
        const gx = tx * T + 8, gy = ty * T + 10;
        for (let n = 0; n < 600; n++) {
            const dx = gx - p.x, dy = gy - p.y;
            if (Math.abs(dx) < 1.2 && Math.abs(dy) < 1.2) { p.x = gx; p.y = gy; break; }
            const sp = PSPEED * speed;
            if (Math.abs(dx) >= 1.2) { p.dir = dx < 0 ? LEFT : RIGHT; p.x += clamp(dx, -sp, sp); }
            else { p.dir = dy < 0 ? UP : DOWN; p.y += clamp(dy, -sp, sp); }
            p.walking = true; p.anim++;
            yield 1;
        }
        p.walking = false; p.anim = 0;
        return;
    }
    if (e.walkTo) { e.walkTo(tx, ty, speed); yield () => !e.walking; }
}
function* face(e, d) { e.dir = d; yield 1; }
function* shake(n = 20) { G.shake = n; yield n; }

// ---- 14_ui.js ----
/* What's drawn over the world: the dialogue box, the HUD, toasts, banners and the fade. Every panel wears
   the same stitched look: cream cloth, a dark edge and a running stitch just inside it. */

function stitchedBox(x, y, w, h, opts = {}) {
    const fillC = opts.fill || '#fbf3df', edge = opts.edge || PAL.ink, stitch = opts.stitch || '#c0505a';
    Gfx.rect(x + 1, y, w - 2, h, edge); Gfx.rect(x, y + 1, w, h - 2, edge);
    Gfx.rect(x + 1, y + 1, w - 2, h - 2, fillC);
    /* shading at the bottom */
    Gfx.rect(x + 1, y + h - 3, w - 2, 2, opts.shadow || '#e9dcbc');
    /* the running stitch */
    for (let i = x + 4; i < x + w - 4; i += 4) { Gfx.rect(i, y + 3, 2, 1, stitch); Gfx.rect(i, y + h - 4, 2, 1, stitch); }
    for (let j = y + 5; j < y + h - 5; j += 4) { Gfx.rect(x + 3, j, 1, 2, stitch); Gfx.rect(x + w - 4, j, 1, 2, stitch); }
}

const VOICES = {};       /* speaker -> blip pitch */

const Dialog = {
    active: false, who: null, pages: [], page: 0, shown: 0, choices: null, sel: 0, picked: -1, opts: {},
    open(who, text, opts = {}) {
        this.active = true; this.who = who; this.opts = opts;
        const lines = Font.wrap(Story.fill(text), 286);
        this.pages = [];
        for (let i = 0; i < lines.length; i += 3) this.pages.push(lines.slice(i, i + 3));
        this.page = 0; this.shown = 0; this.choices = opts.choices || null; this.sel = 0; this.picked = -1;
        this.t = 0;
    },
    pageLen() { return this.pages[this.page].reduce((n, l) => n + stripMarkup(l).length, 0); },
    update() {
        if (!this.active) return;
        this.t++;
        const len = this.pageLen();
        const fast = Input.down('act') || Input.down('atk');
        if (this.shown < len) {
            const sp = Settings.textSpeed;
            this.shown = Math.min(len, this.shown + (fast && this.t > 4 ? 3 : sp));
            if (Math.floor(this.shown) % 3 === 0) Sfx.play(this.who && VOICES[this.who] === 'low' ? 'blipLow' : 'blip');
            if (Input.pressed('act') && this.t > 3) this.shown = len;
            return;
        }
        const last = this.page === this.pages.length - 1;
        if (last && this.choices) {
            if (Input.pressed('up')) { this.sel = (this.sel + this.choices.length - 1) % this.choices.length; Sfx.play('menu'); }
            if (Input.pressed('down')) { this.sel = (this.sel + 1) % this.choices.length; Sfx.play('menu'); }
            if (Input.pressed('act')) { this.picked = this.sel; this.close(); Sfx.play('select'); }
            return;
        }
        if (Input.pressed('act') || Input.pressed('atk')) {
            if (last) this.close(); else { this.page++; this.shown = 0; this.t = 0; }
        }
    },
    close() { this.active = false; Input.swallow(); },
    draw() {
        if (!this.active) return;
        const p = G.player;
        const top = p && (p.y - Cam.y) > 110;

const TOOL_ORDER = ['gloves', 'hook', 'paddle', 'bell', 'bedroll', 'crossbar', 'needle', 'shears'];

const Inv = {
    reset() {
        this.hp = 6; this.maxHp = 6;       /* in half hearts */
        this.buttons = 0;
        this.tools = []; this.equipped = null;
        this.keyCount = {}; this.patterns = []; this.plans = [];
        this.knots = []; this.patches = 0; this.patchIds = [];
        this.items = {};                    /* quest things, notes, strays */
    },
    has(id) { return this.tools.includes(id) || !!this.items[id]; },
    keys(h) { return this.keyCount[h] || 0; },
    useKey(h) { this.keyCount[h] = Math.max(0, this.keys(h) - 1); },
    hasPattern(h) { return this.patterns.includes(h); },
    giveTool(id) { if (!this.tools.includes(id)) { this.tools.push(id); this.tools.sort((a, b) => TOOL_ORDER.indexOf(a) - TOOL_ORDER.indexOf(b)); } if (!this.equipped || ITEMS[id].kind === 'tool') this.equipped = id; },
    cycleTool(d) {
        if (!this.tools.length) return;
        const i = this.tools.indexOf(this.equipped);
        this.equipped = this.tools[(i + d + this.tools.length) % this.tools.length];
        Sfx.play('menu');
    },
    heal(n) { this.hp = Math.min(this.maxHp, this.hp + n); },
    addHeart() { this.maxHp += 2; this.hp = this.maxHp; },
    pickup(what, src) {
        switch (what) {
            case 'heart': this.heal(2); Sfx.play('heart'); break;
            case 'b1': this.buttons += 1; Sfx.play('button'); break;
            case 'b5': this.buttons += 5; Sfx.play('button'); break;
            case 'b20': this.buttons += 20; Sfx.play('button'); break;
            case 'key': {
                const h = G.map.def.house; this.keyCount[h] = this.keys(h) + 1; Sfx.play('smallitem');
                UI.toast('A small key.'); break;
            }
            case 'heartpatch': Script.run(Story.getItem('heartpatch', src && src.id)); break;
            default: Script.run(Story.getItem(what));
        }
    },
};

const Progress = {
    reset() { this.flags = {}; this.areaFlags = {}; this.notes = []; this.journal = []; this.goal = ''; },
    flag(n) { return !!this.flags[n]; },
    set(n, v = true) { this.flags[n] = v; },
    get(n) { return this.flags[n]; },
    areaFlag(a, n) { return !!(this.areaFlags[a] && this.areaFlags[a][n]); },

// ---- 16_world.js ----
/* Going places: building an area from its definition, putting Wren in it, warps between areas.
   An area is built fresh every time Wren arrives: everything in it is back in its place. */

const SPAWN = {
    block: (x, y, p) => new Block(x, y, p),
    wood: (x, y, p) => new Block(x, y, Object.assign({ style: 'wood' }, p)),
    marble: (x, y, p) => new Block(x, y, Object.assign({ style: 'marble' }, p)),
    stray: (x, y, p) => new Block(x, y, Object.assign({ stray: true }, p)),
    pot: (x, y, p) => new Pot(x, y, p),
    crate: (x, y, p) => new Crate(x, y, p),
    bust: (x, y, p) => new Bust(x, y, p),
    plate: (x, y, p) => new Plate(x, y, p),
    crystal: (x, y, p) => new Crystal(x, y, p),
    door: (x, y, p) => new Door(x, y, p),
    chest: (x, y, p) => new Chest(x, y, p),
    sign: (x, y, p) => new Sign(x, y, p),
    pickup: (x, y, p) => new Pickup(x * T, y * T, p),
    warp: (x, y, p) => new Warp(x, y, p),
    prop: (x, y, p) => new Prop(x, y, p),
};

class Warp extends FloorThing {
    constructor(tx, ty, props = {}) { super('warp', tx, ty, props); this.armed = false; }
    update() {
        const p = G.player;
        if (!p || p.area !== this.area || p.state !== 'normal' || Script.blocking()) return;
        const on = p.feetOn(this.tx, this.ty);
        /* only fires after Wren has stepped off it once (arriving on a warp doesn't send you back) */
        if (!on) { this.armed = true; return; }
        if (!this.armed) return;
        if (this.dir !== undefined && p.dir !== dirByName(this.dir)) return;
        if (this.when && !Signals.eval(this.area, this.when)) return;
        this.armed = false;
        World.go(this.to, this.tx2, this.ty2, { dir: this.face, fade: true, from: this.area.id });
    }
    draw() { }
}

const World = {
    going: false,
    build(id) {
        const def = AREAS[id];
        if (!def) throw new Error('no area ' + id);
        const a = new Area(def);
        for (const s of a._spawns) {
            const f = SPAWN[s.L.ent];
            if (f) a.add(f(s.x, s.y, Object.assign({}, s.L.props || {})));
        }
        for (const e of def.ents || []) {
            if (e.if && !Story.cond(e.if)) continue;
            const f = SPAWN[e.k];
            if (!f) { log('no spawn kind', e.k); continue; }
            const props = Object.assign({}, e); delete props.k; delete props.x; delete props.y;
            a.add(f(e.x, e.y, props));
        }
        /* things changed for good (pits filled with strays...) */
        const af = Progress.areaFlags[id] || {};
        for (const k in af) {
            const m = /^fill:(\d+),(\d+)$/.exec(k);
            if (m) a.setCell(+m[1], +m[2], a.family === 'outdoor' ? ':' : ',');
        }
        if (def.build) def.build(a);
        return a;
    },
    /* put Wren in an area at a tile */
    go(id, tx, ty, opts = {}) {
        if (opts.fade && !HEADLESS) {
            if (this.going) return;
            this.going = true;
            Script.run(function* () {
                yield* fadeOut(14);
                World.enter(id, tx, ty, opts);
                yield 4;
                World.going = false;
                yield* fadeIn(14);
            }, { name: 'warp' });
            return;
        }
        this.enter(id, tx, ty, opts);
    },
    enter(id, tx, ty, opts = {}) {
        const prev = G.map;
        if (prev && prev.def.onLeave) prev.def.onLeave(prev);
        /* keys don't leave their House */
        if (prev && prev.def.house && AREAS[id] && AREAS[id].def !== undefined) { }
        if (prev && prev.def.house && (!AREAS[id] || AREAS[id].house !== prev.def.house)) Story.leaveHouse(prev.def.house);
        const a = this.build(id);
        G.map = a;
        Fx.clear(); Thrown.list = []; Shards.list = [];
        let p = G.player;
        if (!p) { p = G.player = new Player(0, 0); }
        if (p.carry) { p.carry = null; }
        p.grip = null;
        p.area = a;
        p.x = tx * T + 8; p.y = ty * T + 10;
        if (opts.px !== undefined) { p.x = opts.px; p.y = opts.py; }
        p.dir = opts.dir !== undefined ? (typeof opts.dir === 'string' ? dirByName(opts.dir) : opts.dir) : p.dir;
        p.state = 'normal'; p.kx = p.ky = 0; p.shove = null; p.z = 0;
        p.setMark();
        Cam.snap(p);
        Stats.enterRoom(a, Cam.room);
        Progress.set('visited:' + id);
        if (a.def.music) Music.play(typeof a.def.music === 'function' ? a.def.music() : a.def.music);
        G.region = null;
        this.checkRegion(true);
        if (a.def.onEnter) a.def.onEnter(a, opts);
        if (G.onRoomEnter) G.onRoomEnter(a, Cam.room);
        if (!opts.noSave && !G.noAutosave) Save.autosave();
    },
    checkRegion(first) {
        const p = G.player, a = G.map;
        if (!p || !a) return;
        const r = a.regionAt(p.tx, p.ty);
        const name = r ? r.name : a.name;
        if (name !== G.regionName) {
            G.regionName = name;
            if (name && (!first || !a.def.quietName)) UI.showBanner(name, r && r.sub);
            const m = r && r.music;
            if (m) Music.play(m);
            if (r && r.mark !== false && a.family === 'outdoor' && p.state === 'normal') p.setMark();
        }
    },
};

// ---- 17_save.js ----
/* Saving: three slots in this browser's storage, plus a code to carry a save elsewhere.
   Saves are plain JSON with a version; migrate() upgrades older ones so old saves always load. */

const SAVE_V = 1;
const Save = {
    slot: 1,
    key(n) { return 'hollowell-slot-' + n; },
    snapshot() {
        const p = G.player, a = G.map;
        return {
            v: SAVE_V, game: 'hollowell', version: VERSION, savedAt: Date.now(),
            name: G.wanderer,
            inv: JSON.parse(JSON.stringify(Inv, (k, v) => typeof v === 'function' ? undefined : v)),
            progress: { flags: Progress.flags, areaFlags: Progress.areaFlags, notes: Progress.notes, journal: Progress.journal, goal: Progress.goal },
            stats: { c: Stats.c, rooms: Stats.rooms, playFrames: Stats.playFrames, visited: Stats.visited },
            pos: a && p ? { area: a.id, x: p.x, y: p.y, dir: p.dir, mark: p.mark } : null,
            seed: G.seed,
        };
    },
    write(n = this.slot) {
        if (G.noSave) return false;
        try { localStorage.setItem(this.key(n), JSON.stringify(this.snapshot())); return true; }
        catch (e) { reportError(e); return false; }
    },
    autosave() { if (G.scene === 'play' && !G.noSave) this.write(); },
    read(n) {
        try { const s = localStorage.getItem(this.key(n)); return s ? this.migrate(JSON.parse(s)) : null; }
        catch (e) { return null; }
    },
    migrate(s) {
        if (!s || s.game !== 'hollowell') return null;
        /* v1 is the first; later shapes upgrade here, one step at a time */
        s.inv = Object.assign({ hp: 6, maxHp: 6, buttons: 0, tools: [], keyCount: {}, patterns: [], plans: [], knots: [], patches: 0, patchIds: [], items: {} }, s.inv || {});
        s.progress = Object.assign({ flags: {}, areaFlags: {}, notes: [], journal: [], goal: '' }, s.progress || {});
        s.stats = Object.assign({ c: {}, rooms: {}, playFrames: 0, visited: {} }, s.stats || {});
        s.v = SAVE_V;
        return s;
    },
    /* put a save into the running game */
    apply(s) {
        Inv.reset(); Object.assign(Inv, s.inv);
        Progress.reset(); Object.assign(Progress, s.progress);
        Stats.reset(); Object.assign(Stats, s.stats);
        G.wanderer = s.name || 'Wren';
        G.seed = s.seed || 1; G.rng = mulberry(G.seed + Stats.playFrames);
        G.player = null;
        const pos = s.pos;
        if (pos && AREAS[pos.area]) {
            World.enter(pos.area, 0, 0, { px: pos.x, py: pos.y, dir: pos.dir, noSave: true });
            /* in a House, start at the room's doorway (the mark) */
            if (pos.mark && pos.mark.area === pos.area && G.map.def.house) {
                G.player.x = pos.mark.tx * T + 8; G.player.y = pos.mark.ty * T + 10; G.player.setMark(); Cam.snap(G.player);
            }
        } else World.enter(START.area, START.x, START.y, { noSave: true });
    },
    list() { return [1, 2, 3].map(n => ({ n, s: this.read(n) })); },
    erase(n) { try { localStorage.removeItem(this.key(n)); } catch { } },
    /* a save code: the save as text, to copy somewhere safe */
    code(n = this.slot) {
        const s = this.read(n) || this.snapshot();
        const j = JSON.stringify(s);
        return 'HW1:' + (typeof btoa === 'function' ? btoa(unescape(encodeURIComponent(j))) : Buffer.from(j).toString('base64'));
    },
    fromCode(c) {
        c = c.trim();
        if (!c.startsWith('HW1:')) return null;
        try {
            const j = typeof atob === 'function' ? decodeURIComponent(escape(atob(c.slice(4)))) : Buffer.from(c.slice(4), 'base64').toString();
            return this.migrate(JSON.parse(j));
        } catch { return null; }
    },
};

// ---- 18_tools.js ----
/* Tools Wren finds in the Houses. Gloves work through the action button (11_player.js); the rest are used
   with C. Each tool: use(p) on press, hold(p) while held, busy(p) while it keeps Wren still. */

const TOOLS = {};
const Tools = {
    use(p) {
        const id = Inv.equipped; if (!id) return;
        const t = TOOLS[id];
        if (t && t.use) { t.use(p); Stats.count('tool:' + id); }

function overrideRows(rows, ov) {
    if (!ov) return rows;
    return rows.map((r, i) => {
        const o = ov[i]; if (!o) return r;
        /* '.' in an override keeps what's underneath only where the override is clear */
        let s = '';
        for (let j = 0; j < 16; j++) s += (o[j] && o[j] !== '.') ? o[j] : (r[j] || '.');
        return s;
    });
}

        c: look.cheek || '#f0a0a0', e: '#2a1f2d',

/* a townsperson on the grid */
class NPC extends GridThing {
    constructor(tx, ty, props = {}) {
        super('npc', tx, ty, Object.assign({ weight: WEIGHT.medium }, props));
        this.dir = props.face !== undefined ? dirByName(props.face) : DOWN;
        this.sprId = props.sprite || props.who;
        this.walking = false; this.anim = 0;
        this.pushedT = 0;
        this.noPush = true;           /* pushing works differently: they budge */
        this.idle = props.idle || null;
        this.path = null;
        this.patience = props.patience || 100;
    }
    onAdd(area) {
        super.onAdd(area);
        if (this.ret) { this.ret.color = THREAD.town; this.ret.patience = this.patience; }
        this.quietHome = true;
    }
    get sortY() { return this.py + 15; }
    onPushed(p, d) {
        /* townsfolk budge when you lean on them */
        this.pushedT++;
        if (this.mv || this.walking) return false;
        if (this.area.freeForThing(this.tx + DX[d], this.ty + DY[d], this)) {
            this.startMove(this.tx + DX[d], this.ty + DY[d], 20);
            this.dir = OPP[d];
            Story.budged(this);
            Stats.count('budge:' + this.who);
        }
        return false;
    }
    interact(p) {
        if (this.mv) return false;
        this.dir = OPP[p.dir];
        const t = Story.talk(this);
        if (t) Script.run(t, { name: 'talk' });
        return true;
    }
    walkTo(tx, ty, speed = 1) {
        const path = findPath(this.area, this.tx, this.ty, tx, ty, this);
        this.path = path; this.walking = !!(path && path.length); this.walkSpeed = speed;
    }
    tick() {
        if (this.path && !this.mv) {
            if (!this.path.length) { this.path = null; this.walking = false; if (this.ret && !this.free) { /* stays a stranger to its spot */ } return; }
            const [nx, ny] = this.path[0];
            if (this.area.freeForThing(nx, ny, this)) {
                this.path.shift();
                this.dir = dirOf(nx - this.tx, ny - this.ty);
                this.startMove(nx, ny, Math.round(16 / (this.walkSpeed || 1)), this.free ? false : false);
                if (this.free && this.ret) { this.ret.mx = nx; this.ret.my = ny; this.ret.trace = [[nx, ny]]; this.ret.state = 'home'; }
            }
        }
        if (this.mv) this.anim++; else if (!this.walking) this.anim = 0;
        if (this.idleTick) this.idleTick();
        if (this.ret && this.ret.state === 'returning' && this.mv) this.anim++;
    }
    sprite() {
        const moving = !!this.mv;
        const fr = moving ? [1, 0, 2, 0][Math.floor(this.anim / 6) % 4] : 0;
        return personFrame(this.sprId, this.dir, fr);
    }
    draw(cx, cy) {
        const im = this.sprite(); if (!im) return;
        const sx = this.px - cx, sy = this.py - cy - (im.height - T) - 2;
        Gfx.alpha(0.22); Gfx.rect(sx + 3, this.py - cy + 13, 10, 2, PAL.ink); Gfx.alpha(1);
        Gfx.img(im, sx, sy, this.dir === LEFT);
        if (this.bubble) { Gfx.img(spr('bubble_' + this.bubble), sx + 8, sy - 10); }
    }
}

/* shortest path on the grid for walkers (4 ways) */
function findPath(area, sx, sy, gx, gy, who, max = 4000) {
    if (sx === gx && sy === gy) return [];
    const q = [[sx, sy]], prev = new Map([[key2(sx, sy), null]]);
    let n = 0;
    while (q.length && n++ < max) {
        const [x, y] = q.shift();
        for (let d = 0; d < 4; d++) {
            const nx = x + DX[d], ny = y + DY[d], k = key2(nx, ny);
            if (prev.has(k)) continue;
            const goal = nx === gx && ny === gy;
            const kk = area.kind(nx, ny);
            if (kk.solid || kk.pit || kk.deep || kk.ledge || kk.fog) continue;
            const o = area.at(nx, ny);
            if (o && o !== who && !goal) continue;
            if (area.blockers.some(b => b.blocks(nx, ny, who))) continue;
            prev.set(k, [x, y]);
            if (goal) {
                const path = []; let c = [nx, ny];
                while (c && !(c[0] === sx && c[1] === sy)) { path.unshift(c); c = prev.get(key2(c[0], c[1])); }
                return path;
            }
            q.push([nx, ny]);
        }
    }
    return null;
}

// ---- 20_enemies.js ----
/* Creatures. Each has a nest (its mark) and keeps a trace like everything else: knocked or lured away it
   goes back along it; beaten, it unravels into a ball of yarn that rolls home and is a creature again
   next time Wren comes by. */

const ENEMY = {};      /* kind -> { hp, speed, leash, sprite, ai, dmg, weight, ... } */

class Enemy extends Ent {
    constructor(tx, ty, props = {}) {
        super('enemy', props);
        const D = ENEMY[props.type] || {};
        this.type = props.type;
        this.D = D;
        this.x = tx * T + 8; this.y = ty * T + 10;
        this.hx = tx; this.hy = ty;           /* the nest */
        this.hp = props.hp || D.hp || 1;
        this.dir = DOWN; this.t = 0; this.anim = 0;
        this.kx = 0; this.ky = 0; this.flash = 0; this.stun = 0;
        this.isWalker = true; this.weightN = D.weight || WEIGHT.medium;
        this.trace = [[tx, ty]];
        this.mode = 'idle'; this.modeT = 0;
        this.alive = true;
        this.thread = props.thread;
        this.vx = 0; this.vy = 0;
    }
    get sortY() { return this.y + 2; }
    get tx() { return tileOf(this.x); }
    get ty() { return tileOf(this.y); }
    onTile(x, y) {
        if (!this.alive) return false;
        const r = this.D.r || 5;
        return x * T < this.x + r && (x + 1) * T > this.x - r && y * T < this.y + 4 && (y + 1) * T > this.y - 4;
    }
    feetOn(x, y) { return this.alive && this.tx === x && this.ty === y && !this.D.flies; }
    hurtBox() { if (!this.alive) return null; const r = this.D.r || 6; return { x0: this.x - r, x1: this.x + r, y0: this.y - (this.D.tall || 12), y1: this.y + 3 }; }
    solidAt(tx, ty) {
        const a = this.area, k = a.kind(tx, ty);
        if (k.solid || k.ledge || (k.deep && !this.D.swims) || k.fog) return true;
        if (k.pit && !this.D.flies) return true;
        if (a.at(tx, ty)) return true;
        for (const b of a.blockers) if (b.blocks(tx, ty, this)) return true;
        return false;
    }
    move(dx, dy) {
        const r = (this.D.r || 5) - 1;
        const free = (x, y) => !this.solidAt(tileOf(x - r), tileOf(y - 3)) && !this.solidAt(tileOf(x + r), tileOf(y - 3)) && !this.solidAt(tileOf(x - r), tileOf(y + 3)) && !this.solidAt(tileOf(x + r), tileOf(y + 3));
        let moved = false;
        if (dx && free(this.x + dx, this.y)) { this.x += dx; moved = true; }
        if (dy && free(this.x, this.y + dy)) { this.y += dy; moved = true; }
        return moved;
    }
    traceStep() {
        const tx = this.tx, ty = this.ty, tr = this.trace, last = tr[tr.length - 1];
        if (last[0] === tx && last[1] === ty) return;
        let cut = -1; for (let i = tr.length - 1; i >= 0; i--) if (tr[i][0] === tx && tr[i][1] === ty) { cut = i; break; }
        if (cut >= 0) tr.length = cut + 1; else tr.push([tx, ty]);
    }
    /* walk back along the trace toward the nest */
    goHome(sp) {
        const tr = this.trace;
        if (tr.length < 2) { this.mode = 'idle'; return true; }
        const [nx, ny] = tr[tr.length - 2];
        const gx = nx * T + 8, gy = ny * T + 10;
        const dx = gx - this.x, dy = gy - this.y, d = Math.hypot(dx, dy);
        if (d < sp + 0.5) { this.x = gx; this.y = gy; tr.pop(); return false; }
        this.dir = dirOf(dx, dy);
        if (!this.move(dx / d * sp, dy / d * sp)) { this.x += dx / d * sp; this.y += dy / d * sp; }
        return false;
    }
    update() {
        if (!this.alive) return this.updateYarn();
        this.t++;
        if (this.flash > 0) this.flash--;
        if (this.kx || this.ky) {
            this.move(this.kx, this.ky); this.kx *= 0.8; this.ky *= 0.8;
            if (Math.abs(this.kx) + Math.abs(this.ky) < 0.2) { this.kx = this.ky = 0; }
            this.traceStep();
            return;
        }
        if (this.stun > 0) { this.stun--; return; }
        const p = G.player;
        const ai = this.D.ai || 'wander';
        AI[ai](this, p);
        this.traceStep();
        /* touching Wren */
        if (p && p.area === this.area && p.state === 'normal' && !this.D.harmless && this.mode !== 'home') {
            if (Math.abs(p.x - this.x) < (this.D.r || 5) + 4 && Math.abs(p.y - this.y) < 7) p.hurt(this.D.dmg || 1, this.x, this.y);
        }
        /* pits and water */
        const k = this.area.kind(this.tx, this.ty);
        if ((k.pit && !this.D.flies) || (k.deep && !this.D.swims)) this.die(true);
    }
    struck(by, dmg, dir, shard) {
        if (!this.alive || this.flash > 0) return;
        if (this.D.armored && !shard && !(by && by.isGrid)) { Sfx.play('hitthing'); Fx.ring(this.x, this.y - 6); if (dir >= 0) { this.kx = DX[dir] * 1.5; this.ky = DY[dir] * 1.5; } return; }
        this.hp -= dmg; this.flash = 18;
        Sfx.play('enemyhit'); G.hitstop = 3;
        const p = G.player;
        let ddx = dir >= 0 ? DX[dir] : sign(this.x - p.x), ddy = dir >= 0 ? DY[dir] : sign(this.y - p.y);
        this.kx = ddx * 3.5; this.ky = ddy * 3.5;
        if (this.hp <= 0) this.die();
    }
    /* unravel: a yarn ball rolls home along the trace */
    die(quiet) {
        this.alive = false; this.yarnT = 0;
        if (!quiet) { Sfx.play('unravel'); Fx.yarn(this.x, this.y - 6, this.D.yarn || '#e8463c'); }
        Stats.count('defeated:' + this.type);
        if (!quiet && G.rng() < (this.D.drop || 0.35)) {
            const r = G.rng(), what = r < 0.45 ? 'heart' : r < 0.85 ? 'b1' : 'b5';
            this.area.add(new Pickup(this.x - 8, this.y - 12, { what, vz: 2.5, life: 480 }));
        }
        if (this.onDie) this.onDie();
    }
    updateYarn() {
        this.yarnT++;
        if (this.trace.length > 1) this.goHome(2.2);
        else if (this.yarnT > 60) this.yarnHome = true;
    }
    draw(cx, cy) {
        if (!this.alive) {
            /* the yarn ball */
            const x = this.x - cx, y = this.y - cy;
            if (!this.yarnHome || (G.t % 40 < 30)) {
                Gfx.circle(x, y - 3, 3, this.D.yarn || '#e8463c'); Gfx.rect(x - 2, y - 4, 3, 1, shade(this.D.yarn || '#e8463c', 0.4));
                Gfx.rect(x - 1, y - 2, 3, 1, shade(this.D.yarn || '#e8463c', -0.3));
            }
            return;
        }
        const im = ENEMY_DRAW[this.type] ? ENEMY_DRAW[this.type](this) : null;
        if (!im) return;
        Gfx.alpha(0.25); Gfx.rect(this.x - cx - 5, this.y - cy + 2, 10, 2, PAL.ink); Gfx.alpha(1);
        const img = this.flash > 0 && (this.flash >> 1) % 2 ? tinted(im, '#ffffff') : im;
        Gfx.img(img, this.x - cx - im.width / 2, this.y - cy - im.height + 4 - (this.z || 0), this.dir === LEFT && !this.D.noFlip);
    }
}
const ENEMY_DRAW = {};

/* behaviours */
const AI = {
    /* potter about near the nest; come after Wren within reach, but never past the end of the leash */
    wander(e, p) {
        const D = e.D, sp = D.speed || 0.5, leash = (D.leash || 5) * T;
        const nx = e.hx * T + 8, ny = e.hy * T + 10;
        const pd = p && p.area === e.area && p.state === 'normal' ? dist(p.x, p.y, e.x, e.y) : 999;
        const far = dist(e.x, e.y, nx, ny);
        if (e.mode === 'home') { if (e.goHome(sp * 1.4)) e.mode = 'idle'; return; }
        if (far > leash) { e.mode = 'home'; return; }
        if (D.chase && pd < (D.sight || 4) * T && dist(p.x, p.y, nx, ny) < leash) {
            e.mode = 'chase';
            const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
            e.dir = dirOf(dx, dy); e.move(dx / d * sp * (D.chaseMul || 1.3), dy / d * sp * (D.chaseMul || 1.3));
            e.anim++;
            return;
        }
        if (e.mode === 'chase') { e.mode = 'home'; return; }
        if (--e.modeT <= 0) { e.modeT = 40 + Math.floor(G.rng() * 60); e.wdir = Math.floor(G.rng() * 5); }
        if (e.wdir < 4) { e.dir = e.wdir; if (!e.move(DX[e.wdir] * sp, DY[e.wdir] * sp)) e.modeT = 0; e.anim++; }
    },
    /* hop toward Wren in little jumps */
    hop(e, p) {
        const D = e.D;
        e.z = Math.max(0, e.z || 0);
        if (e.hopT > 0) {
            e.hopT--; const k = 1 - e.hopT / 20; e.z = Math.sin(k * Math.PI) * 6;
            e.move(e.vx, e.vy);
            return;
        }
        if (--e.modeT > 0) return;
        e.modeT = 30 + Math.floor(G.rng() * 30);
        const nx = e.hx * T + 8, ny = e.hy * T + 10;
        let tx, ty;
        if (p && p.area === e.area && dist(p.x, p.y, e.x, e.y) < (D.sight || 5) * T && dist(p.x, p.y, nx, ny) < (D.leash || 6) * T) { tx = p.x; ty = p.y; }
        else if (dist(e.x, e.y, nx, ny) > 2 * T) { tx = nx; ty = ny; }
        else { tx = e.x + (G.rng() - 0.5) * 48; ty = e.y + (G.rng() - 0.5) * 48; }
        const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy) || 1;
        e.vx = dx / d * (D.speed || 1); e.vy = dy / d * (D.speed || 1); e.hopT = 20; e.dir = dirOf(dx, dy);
    },
    still() { },
};

/* The story's machinery: who's who, what they say (TALK, filled by the content files), getting things,
   fainting, the fog, leaving a House with its keys, and conditions on flags. */

const PEOPLE = {};     /* id -> { name, col, voice } */
const TALK = {};       /* id -> function* (npc) : what they say now */
const BUDGE = {};      /* id -> line when pushed off their spot */
const START = { area: 'lab', x: 2, y: 8 };

const Story = {
    name(id) { return id === 'wren' ? G.wanderer : (PEOPLE[id] && PEOPLE[id].name) || id; },
    /* {name} in text becomes the Wanderer's name */
    fill(s) { return String(s).replace(/\{name\}/g, G.wanderer || 'Wren'); },
    cond(c) {
        if (typeof c === 'function') return c();
        return c.split('&').every(t => { t = t.trim(); return t[0] === '!' ? !Progress.flag(t.slice(1)) : Progress.flag(t); });
    },
    talk(npc) {
        const f = TALK[npc.who];
        if (f) return () => f(npc);
        return function* () { yield* say(npc.who, '...'); };
    },
    budged(npc) {
        const n = 'budged:' + npc.who;
        const first = !Progress.flag(n);
        Progress.set(n);
        const line = BUDGE[npc.who];
        if (first && line) UI.toast(Story.fill(typeof line === 'function' ? line() : line), 150);
        else if (first) UI.toast(Story.name(npc.who) + ': "Oop."', 120);
        Story.checkBudgedAll && Story.checkBudgedAll();
    },
    /* the fanfare for a found thing */
    getItem(id, srcId) {
        return function* () {
            const p = G.player;
            const I = ITEMS[id] || { name: id, kind: 'quest' };
            const prevState = p.state;
            p.state = 'hold'; p.holding = id;
            Music.duck = true;
            Sfx.play(I.kind === 'tool' || id === 'knot' || id === 'heartstitch' ? 'item' : 'smallitem');
            G.holdUp = { id, t: 0 };
            if (I.kind === 'tool') Inv.giveTool(id);
            else if (id === 'heartpatch') { Inv.patches++; if (srcId) Inv.patchIds.push(srcId); }
            else if (id === 'heartstitch') Inv.addHeart();
            else if (id === 'key') { const h = G.map.def.house; Inv.keyCount[h] = Inv.keys(h) + 1; }
            else if (id === 'pattern') Inv.patterns.push(G.map.def.house);
            else if (id === 'plan') Inv.plans.push(G.map.def.house);
            else if (id.startsWith('b') && /^b\d+$/.test(id)) Inv.buttons += parseInt(id.slice(1));
            else Inv.items[id] = (Inv.items[id] || 0) + 1;
            yield 30;
            const line = ITEM_LINES[id] ? ITEM_LINES[id]() : `You found the {${I.kind === 'tool' ? 'red' : 'blue'}}${I.name}{/}!` + (I.desc ? ' ' + I.desc : '');
            yield* say(null, line);
            if (id === 'heartpatch' && Inv.patches % 4 === 0) { Inv.addHeart(); yield* say(null, 'Four Heart Patches stitch together into a new heart!'); }
            G.holdUp = null;
            p.state = prevState === 'hold' ? 'normal' : 'normal';
            Music.duck = false;
            if (ITEM_AFTER[id]) yield* ITEM_AFTER[id]();
        };
    },
    /* hearts ran out */
    faint() {
        return function* () {
            const p = G.player;
            G.hideHud = false;
            yield 50;
            yield* fadeOut(40);
            Inv.hp = Inv.maxHp;
            const house = G.map.def.house;
            if (house && AREAS[G.map.id].entry) {
                /* in a House, you come to at its door */
                const e = AREAS[G.map.id].entry;
                World.enter(G.map.id, e.x, e.y, { dir: UP });
                Progress.set('fainted_in_house');
                p.state = 'normal';
                yield* fadeIn(30);
                yield* say(null, 'You come to by the door of the House, with no idea how you got here.');
            } else {
                World.enter('gran_room', 4, 3, { dir: DOWN });
                G.player.state = 'sleep';
                yield* fadeIn(40);
                yield 40;
                G.player.state = 'normal';
                yield* Story.wakeAfterFaint();
            }
        };
    },
    *wakeAfterFaint() {
        const n = (Progress.get('faintHome') || 0) + 1; Progress.set('faintHome', n);
        const lines = FAINT_LINES[Math.min(n, FAINT_LINES.length) - 1];
        yield* say(null, lines);
    },
    /* the fog: you can't go further, it pulls you back */
    fogPull(p) {
        Script.run(function* () {
            const n = (Progress.get('fogTries') || 0) + 1; Progress.set('fogTries', n);
            p.flyHome();
            yield () => p.state === 'normal';
            yield* say(null, FOG_LINES[Math.min(n, FOG_LINES.length) - 1]);
        });
    },
    /* small keys fly back into their House */
    leaveHouse(house) {
        const k = Inv.keys(house);
        if (k > 0) {
            Inv.keyCount[house] = 0;
            Progress.set('keys_went_home');
            G.pendingToast = k === 1 ? 'Your small key tugs free and flies back into the House.' : 'Your small keys tug free and fly back into the House.';
            Progress.setAreaFlag('house:' + house, 'keysBack', (Progress.areaFlags['house:' + house] || {}).keysBack + k || k);
        }
    },
};

const ITEM_LINES = {};     /* id -> () => the line when found */
const ITEM_AFTER = {};     /* id -> function* after the fanfare */
const FAINT_LINES = [
    "You wake up in your own bed. There's a cup of warm milk on the stool, and Gran's humming downstairs. You must have walked home in your sleep... somehow.",
    "Home in bed again. Your scarf is folded on the stool. You don't remember the walk at all.",
    "Your bed. Of course. Everything comes home in the end.",

const FOG_LINES = [
    "The fog is thick as wool. A few steps in, something tugs you gently back the way you came.",
    "The fog again. It won't let you through: it just turns you round and sends you back.",
    "Everyone knows you can't go into the Drift. The Way always brings you back.",
];

/* Debug tools and the test API. play.html?debug turns on F1 (the debug panel); window.HW is how the
   tests (and the autopilot) drive the game: start a game, warp, give tools, set a preset, step frames,
   press buttons, walk to a tile, run a list of commands. */

const Auto = {
    plan: null,
    /* walk Wren to a tile along a path that avoids solid things */
    walk(tx, ty, opts = {}) {
        const p = G.player;
        const path = playerPath(p.area, p.tx, p.ty, tx, ty);
        if (!path) return false;
        this.plan = { kind: 'walk', path, i: 0, stuck: 0, opts };
        return true;
    },
    active() { return !!this.plan; },
    update() {
        const pl = this.plan; if (!pl) return;
        const p = G.player;
        Input.virt = {};
        if (p.state !== 'normal' || Cam.busy || Script.blocking()) return;
        if (pl.kind === 'walk') {
            if (pl.i >= pl.path.length) { this.plan = null; return; }
            const [tx, ty] = pl.path[pl.i];
            const gx = tx * T + 8, gy = ty * T + 10;
            const dx = gx - p.x, dy = gy - p.y;
            if (Math.abs(dx) <= 1.4 && Math.abs(dy) <= 1.4) { pl.i++; pl.stuck = 0; if (pl.i >= pl.path.length) { p.x = gx; p.y = gy; this.plan = null; } return; }
            if (Math.abs(dx) > 1.4) Input.virt[dx < 0 ? 'left' : 'right'] = true;
            if (Math.abs(dy) > 1.4) Input.virt[dy < 0 ? 'up' : 'down'] = true;
            if (++pl.stuck > 240) { this.plan = null; this.failed = 'stuck walking to ' + tx + ',' + ty; }
        }
    },
};
/* a path for Wren: tiles Wren can stand in */
function playerPath(area, sx, sy, gx, gy) {
    const p = G.player;
    const ok = (x, y) => { if (!area.inside(x, y)) return false; const k = area.kind(x, y); if (k.solid || k.pit || k.deep || k.ledge || k.fog) return false; if (area.at(x, y)) return false; return !area.blockers.some(b => b.blocks(x, y, p)); };
    if (sx === gx && sy === gy) return [[gx, gy]];
    const q = [[sx, sy]], prev = new Map([[key2(sx, sy), null]]);
    while (q.length) {
        const [x, y] = q.shift();
        for (let d = 0; d < 4; d++) {
            const nx = x + DX[d], ny = y + DY[d], k = key2(nx, ny);
            if (prev.has(k) || !ok(nx, ny)) continue;
            prev.set(k, [x, y]);
            if (nx === gx && ny === gy) {
                const path = []; let c = [nx, ny];
                while (c) { path.unshift(c); c = prev.get(key2(c[0], c[1])); }
                return path;
            }
            q.push([nx, ny]);
        }
    }
    return null;
}

const PRESETS = {};    /* name -> () => sets up a game state (the content files add these) */

const HW = {
    G, Inv, Progress, Stats, Save, World, Script, Input, Return, AREAS, ERRORS, LOG, PRESETS, Auto, Story, Dialog, Cam,
    newGame(name = 'Wren', opts = {}) { G.noAutosave = !!opts.noAutosave; Game.newGame(name, opts); if (opts.skipIntro) { Script.clear(); Dialog.active = false; UI.fadeA = 0; } return this.state(); },
    warp(id, x, y, dir) { World.enter(id, x, y, { dir }); return this.state(); },
    preset(name) { PRESETS[name](); return this.state(); },
    give(id) { if (ITEMS[id] && ITEMS[id].kind === 'tool') Inv.giveTool(id); else Inv.items[id] = (Inv.items[id] || 0) + 1; },
    step(n = 1) { for (let i = 0; i < n; i++) Game.step(); },
    /* hold buttons for n steps then let go */
    press(btns, n = 2) { btns = [].concat(btns); for (let i = 0; i < n; i++) { Input.virt = {}; for (const b of btns) Input.virt[b] = true; Game.step(); } Input.virt = {}; Game.step(); },
    hold(btns) { Input.virt = {}; for (const b of [].concat(btns)) Input.virt[b] = true; },
    release() { Input.virt = {}; },
    /* talk through any open dialogue (picking choice i when asked) */
    skipTalk(choice = 0, max = 4000) {
        for (let n = 0; n < max && (Dialog.active || Script.blocking()); n++) {
            if (Dialog.active && Dialog.shown >= Dialog.pageLen()) {
                if (Dialog.choices && Dialog.page === Dialog.pages.length - 1) { Dialog.sel = choice; }
                this.press('act', 1);
            } else this.step(1);
        }
        return !Dialog.active;
    },
    walkTo(tx, ty, max = 3000) {
        if (!Auto.walk(tx, ty)) return false;
        for (let n = 0; n < max && Auto.active(); n++) { Auto.update(); Game.step(); }
        Input.virt = {};
        const p = G.player;
        return p.tx === tx && p.ty === ty;
    },
    /* face a direction without moving (a tap) */
    face(d) { G.player.dir = typeof d === 'string' ? dirByName(d) : d; },
    /* push the thing in front n tiles (walk into it) */
    push(d, n = 1) {
        const dn = typeof d === 'string' ? d : DIR_NAME[d];
        for (let i = 0; i < n; i++) {
            const p = G.player, f = p.front ? null : null;
